camada_energetica:
  impressao_mental: "Aquário/Urano é REDE e CIRCULAÇÃO INVERTIDA — as veias RECOLHEM e LEVAM DE VOLTA. A mente opera em redes e retornos."
  permeacao_emocional: "Necessidade de pertencer à rede; medo de 'ficar de fora'."
  manifestacao_externa: "Campo simbólico de circulação, retorno e conexão; não corresponde a sintomas ou eventos clínicos."
  como_guiar_o_astral: "Usar apenas para estudo de imagens e linguagem simbólica; qualquer queixa de saúde requer avaliação profissional."

porque_simbolico: |
  As VEIAS recolhem o sangue e o LEVAM DE VOLTA ao coração — é o SISTEMA DE RETORNO, a REDE que fecha o circuito.
  Aquário = REDE, CIRCUITO, COLETIVIDADE. Urano = ELÉTRICIDADE que circula. As veias são 'fios' que transportam o fluido (sangue) de volta — exatamente o que Aquário faz: conecta pontos para que o sistema funcione.
  Por isso veias = Aquário: porque são a rede de RETORNO, o 'fio que volta'.

linha_tradicao: "Urano/Aquário para veias é uma associação moderna; Saturno aparece em algumas tabelas antigas para estrutura, mas cada fonte deve ser identificada."
foco_especial:
  familiar: "Veias em mapa familiar = 'fluxo familiar' — onde a família 'bloqueia' ou 'libera'."

