porque_simbolico: |
  Mercúrio = comunicação, pensamento, troca. O cérebro é o ÓRGÃO DA COMUNICAÇÃO INTERNA — bilhões de 'fios' (neurônios) conversando entre si. Não é à toa que 'ter neurônios' = 'ser inteligente'.
  Os NERVIOS são FIOS que levam informação de um ponto a outro — exatamente o que Mercúrio faz (transmite, conecta, transporta).

linha_tradicao: "Listas de melotesia tardias associam Mercúrio/Gêmeos a nervos, mãos e funções de mediação; autores e edições divergem."
