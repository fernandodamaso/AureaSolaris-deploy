camada_energetica:
  impressao_mental: "Escorpião/Plutão é FILTRO e ELIMINAÇÃO — os rins filtram o sangue e eliminam toxinas. A mente 'filtra' o que merece ficar."
  permeacao_emocional: "Medo de 'ficar sujo', obsessão por limpeza, ou dificuldade de SOLTAR."
  manifestacao_externa: "Campo simbólico de filtragem, eliminação e limite; não corresponde a sintomas ou eventos clínicos."
  como_guiar_o_astral: "Usar apenas para estudo de imagens e linguagem simbólica; qualquer queixa de saúde requer avaliação profissional."

porque_simbolico: |
  Os rins FILTRAM e ELIMINAM — exatamente o que Escorpião/Plutão faz simbolicamente: separa o que é 'nutritivo' do que é 'tóxico' na emoção.
  A BEXIGa ARMAZENA e SOLTA — como Escorpião guarda segredos e explode quando não aguenta. A retenção urinária = retenção emocional.

linha_tradicao: "A melotesia pré-moderna não usa Plutão; associações a Escorpião/Marte e extensões plutonianas devem ser separadas por período."
