porque_simbolico: |
  A PELE é o LIMITE entre 'eu' e 'mundo' — exatamente o que Touro/Vênus define: o que é 'meu' (Touro) e o que é 'belo' (Vênus).
  A pele PROTEGE e EXIBE — como Touro que protege seus bens e exibe sua beleza. O toque é o sentido de Touro (tato, prazer).
  Contato e superfície são imagens simbólicas; não explicam alergias, rubor ou condições dermatológicas.

linha_tradicao: "Tabelas de melotesia costumam associar Touro/Vênus a garganta, pescoço, pele ou tato conforme o autor; registrar a variante."
