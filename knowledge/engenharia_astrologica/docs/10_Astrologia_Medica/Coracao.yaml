camada_energetica:
  impressao_mental: "O Sol é o CENTRO da identidade; o coração é o centro do corpo. A mente 'centraliza' tudo no EU."
  permeacao_emocional: "Amor, orgulho, generosidade — mas também ego inflado ou rigidez."
  manifestacao_externa: "Campo simbólico de centro, vitalidade e circulação na tradição; não corresponde a sintomas ou eventos clínicos."
  como_guiar_o_astral: "Usar apenas para estudo de imagens e linguagem simbólica; qualquer queixa de saúde requer avaliação profissional."

porque_simbolico: |
  O coração é o ÓRGÃO CENTRAL — bombeia sangue para TODO o corpo, assim como o Sol é oastro CENTRAL do sistema. Ele É o centro. Não é à toa que 'ter coração' = 'ter centro', e 'coração partido' = 'o centro desabou'.
  Artérias PARTEM do coração (como o Sol EMITE luz). Veias CHEGAM (como a Lua RECEBE). Por isso coração = Sol = centro emissor.

linha_tradicao: "A melotesia greco-romana e medieval costuma associar Leão/Sol ao coração; a formulação e o alcance variam entre autores."
foco_especial:
  infantil: "Não inferir estado físico ou emocional infantil por correspondência corporal astrológica."
