camada_energetica:
  impressao_mental: "Capricórnio/Saturno = ESTRUTURA (coluna = eixo). Áries/Marte = MOVIMENTO (coluna que se movimenta). Juntos: estrutura que age."
  permeacao_emocional: "Carga pesada nas costas = 'estou carregando algo que não é meu' (Saturno). Rigidez = 'não me dobro' (Saturno fixo)."
  manifestacao_externa: "Campo simbólico de estrutura, sustentação e flexibilidade; não corresponde a sintomas ou eventos clínicos."
  como_guiar_o_astral: "Usar apenas para estudo de imagens e linguagem simbólica; qualquer queixa de saúde requer avaliação profissional."

porque_simbolico: |
  A COLUNA é o EIXO do corpo — 'eixo' é Saturno (eixo do tempo, estrutura). Ela SUPORTA todo o peso — como Saturno suporta responsabilidades.
  A coluna também DOBRA (flexão) — como Saturno pede 'ceder para não quebrar'.
  A imagem de estrutura e movimento é uma analogia simbólica moderna; não explica dor, postura ou patologia.

linha_tradicao: "Listas de melotesia tardias vinculam Saturno/Capricórnio a ossos, joelhos e estrutura; a associação com Áries/Marte depende da tabela."
