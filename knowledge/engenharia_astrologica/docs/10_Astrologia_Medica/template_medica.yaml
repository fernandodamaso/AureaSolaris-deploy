id: "astro_medica_template"
nome: "Astrologia Médica (template)"
tema: "Correspondências planeta/signo → corpo/órgão, com porquê simbólico"
atlas_simbolico:
  pessoas_arquetipos: "Estrutura organizadora, catálogo, guia de consulta"
  lugares_fisicos: "Arquivos, bibliotecas, bases de conhecimento"
  objetos_materia: "Documentos estruturados, tabelas, índices"
  eventos_tipicos: "Organização, catalogação, revisão, atualização"
  animais: "Coruja (sabedoria), formiga (organização)"
  plantas_ervas: "Sálvia (memória), hera (permanência)"
  metais_pedras: "Prata (lua/arquivo), cristal de rocha (clareza)"
  cores_sons: "Prata, azul-claro; notas Dó e Lá"
  numeros: "3 (estrutura), 6 (organização), 9 (completude)"
  dias_semana: "Quarta-feira (Mercúrio)"
  doencas_corpo: "Sistema nervoso, olhos (leitura)"
  arquetipos_mitologicos: "Hermes/Mercúrio (comunicação), Atena (sabedoria)"
  mitos_historias: "Hermes e a escrita; Atena e a organização"
  sonhos_simbolos_inconsciente: "Arquivos, bibliotecas, estruturas, ordem"
  expressao_elevada_sombra: "Elevada: estrutura viva que serve | Sombra: rigidez, burocracia excessiva"

camada_energetica:
  campo_mental: "A saúde é a MANIFESTAÇÃO da harmonia (ou desarmonia) entre a mente e o corpo. O planeta doente no mapa indica onde a mente 'travou' e o corpo manifesta."
  permeacao_emocional: "Doença como linguagem simbólica — o corpo 'fala' o que a mente não processa."
  manifestacao_externa: "No estudo histórico, pode incluir crises, diagnósticos ou prognósticos atribuídos por uma escola; no uso contemporâneo, deve separar correspondência simbólica, leitura moderna e qualquer extrapolação clínica."
  como_guiar_o_astral: "Ler primeiro como tradição documentada e depois como símbolo. Se a fonte antiga formular juízo médico, manter a atribuição; se a leitura for moderna, rotular como tal."

base_canonica: "Atribuições tradicionais: Hipócrates ('Astros e Corpos'), Dioscórides, Culpeper, Agrippa (Doutrina das Assinaturas), Paulus Alexandrinus."
linha_tradicao: "Astrologia médica ocidental tradicional (helenística, medieval, renascentista) + overlay moderno (psicológico)."
aviso_etica: "No corpus de estudo, preservar afirmações médicas históricas com fonte, escola e época. Em disseminação a terceiros, separar conteúdo documental de aconselhamento clínico contemporâneo."
como_usar: "Ler o planeta/signo em tensão + a Casa 6 (saúde/rotina) + a Casa 1 (corpo). Registrar se a leitura é melotésica histórica, correspondência simbólica ou overlay moderno antes de inferir significado."
