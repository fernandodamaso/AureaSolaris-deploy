camada_energetica:
  impressao_mental: "Júpiter é EXPANSÃO e 'crescer além' — o fígado é o órgão que TRANSFORMA e EXPANDE o que entra no corpo (nutrientes)."
  permeacao_emocional: "Generosidade, excesso, 'quero mais'. O fígado sofre com excesso porque é o órgão da EXPANSÃO."
  manifestacao_externa: "Campo simbólico de expansão, assimilação e transformação; não corresponde a hábitos, sintomas ou eventos clínicos."
  como_guiar_o_astral: "Usar apenas para estudo de imagens e linguagem simbólica; qualquer queixa de saúde requer avaliação profissional."

porque_simbolico: |
  O fígado é o MAIOR ÓRGÃO INTERNO e o MAIS VISCOSO (expansivo em tamanho). Ele filtra e TRANSFORMA tudo o que entra — é o 'amplificador' do corpo.
  Júpiter como expansão é uma analogia simbólica; ela não explica toxicidade, doença hepática ou escolhas de saúde.

linha_tradicao: "Listas de melotesia medievais frequentemente vinculam Júpiter e Sagitário a quadris, coxas e funções expansivas; o fígado deve ser conferido por fonte."
foco_especial:
  familiar: "Não usar padrões familiares simbólicos para inferir consumo, doença ou causalidade entre gerações."

