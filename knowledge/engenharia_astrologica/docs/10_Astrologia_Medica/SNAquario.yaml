camada_energetica:
  impressao_mental: "Aquário/Urano é REDE ELÉTRICA — o SNA é o 'sistema elétrico autônomo' que mantém o corpo funcionando sem você 'pensar'."
  permeacao_emocional: "Desconexão entre corpo e mente quando Aquário tensionado — 'não sinto o que meu corpo faz'."
  manifestacao_externa: "Campo simbólico de rede, ritmo e interrupção; não corresponde a sintomas ou eventos clínicos."
  como_guiar_o_astral: "Usar apenas para estudo de imagens e linguagem simbólica; qualquer queixa de saúde requer avaliação profissional."

porque_simbolico: |
  O SNA é uma REDE de 'fios' que funciona AUTONOMAMENTE — você não decide 'bater o coração' ou 'digerir', o corpo faz.
  Aquário = REDE, CIRCUITO, FUNCIONAMENTO COLETIVO. Urano = ELÉTRICIDADE. O SNA é a 'eletricidade autônoma' do corpo.
  Por isso pânico = 'curto-circuito na rede'; dormência = 'desconexão do circuito'.

linha_tradicao: "Urano e o sistema nervoso autônomo são associações modernas; não as atribuir a fontes pré-modernas."
foco_especial:
  relacional_familiar: "SNA em tensão em mapa de casal = 'a relação está no piloto automático' — ninguém sente o que o outro sente."
