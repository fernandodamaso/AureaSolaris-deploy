porque_simbolico: |
  Os OSSOS são a ESTRUTURA — sustentam o corpo, não se movem por si, precisam de MÚSCULO para se mover. Exatamente Saturno: estrutura, limite, tempo, esforço.
  Os JOELHOS são o ponto de 'apoio e flexão' — Saturno pede que a estrutura 'se dobre' sem quebrar. Quem não dobra os joelhos (rigidez) quebra a coluna.
  Os DENTES são 'ossos que aparecem' — Saturno é o que 'aparece' como autoridade/limite.

linha_tradicao: "A melotesia tradicional costuma associar Saturno/Capricórnio a ossos, joelhos e dentes, em tabelas com variantes."
