camada_energetica:
  impressao_mental: "Marte é AÇÃO e DEFESA — o sangue DEFENDE (imunidade) e ATACA (infecção). A mente 'luta'."
  permeacao_emocional: "Raiva, coragem, 'vou enfrentar'. O sangue esquenta quando a pessoa 'se prepara para lutar'."
  manifestacao_externa: "Campo simbólico de calor, movimento e impulso; não corresponde a sintomas ou eventos clínicos."
  como_guiar_o_astral: "Usar apenas para estudo de imagens e linguagem simbólica; qualquer queixa de saúde requer avaliação profissional."

porque_simbolico: |
  O SANGUE é o FLUÍDO DE VIDA — transporta oxigênio e DEFESA por todo o corpo. É o EXÉRCITO do corpo (glóbulos brancos = soldados).
  Marte = GUERRA, AÇÃO, FOGO. O sangue ESQUENTA quando a pessoa se prepara para lutar (adrenalina, glândulas suprarrenais = cabeça de Áries).
  Por isso febre = 'guerra interna'; inflamação = 'defesa agressiva demais'.

linha_tradicao: "Tabelas de melotesia associam Áries/Marte a cabeça, calor e movimento em variantes diferentes; registrar autor e período."
foco_especial:
  infantil: "Não inferir imunidade, infecção ou desenvolvimento infantil por fatores astrológicos."

