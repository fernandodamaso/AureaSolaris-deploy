porque_simbolico: |
  O ESTÔMAGO RECEBE e TRANSFORMA — assim como a Lua/Câncer RECEBE emoções e as transforma em 'nutrição interna'.
  É o 'útero' do消化 — o alimento entra, é 'gestado' e 'parido' como energia. A boca é o 'nascimento'; o estômago é o 'útero' da digestão.
  A metáfora de digestão emocional é linguagem contemporânea; não explica gastrite, úlcera ou qualquer sintoma.

