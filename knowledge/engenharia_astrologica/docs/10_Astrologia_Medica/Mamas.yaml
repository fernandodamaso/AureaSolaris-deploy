porque_simbolico: |
  As MAMAS produzem LEITE = alimento que NUTRE sem esforço do bebê. É a doação PURA, assim como a Lua reflete a luz sem gerar própria.
  O ÚTERO é o 'ninho' — Lua = mãe, ninho, origem. Tudo que CRIA e ACOLHE é Lua.
  Imagens de nutrir e receber cuidado são metáforas; não explicam nódulos, lactação ou qualquer condição mamária.

linha_tradicao: "Em tabelas de melotesia, Lua/Câncer pode ser vinculada a nutrição e regiões corporais; o detalhe varia por autor."
