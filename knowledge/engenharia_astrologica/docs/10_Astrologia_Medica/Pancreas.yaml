porque_simbolico: |
  O PÂNCREAS CLASSIFICA o que entra: açúcar = energia ou toxina. É um FILTRO INTELIGENTE.
  Virgem = análise, classificação. Mercúrio = comunicação entre órgãos (insulina = 'mensageiro' que diz 'armazene ou queime').
  'Doçura' é uma metáfora editorial; não deve ser associada a diabetes, glicemia ou conduta de saúde.

linha_tradicao: "O pâncreas é uma associação moderna em muitas tabelas; não a retroprojetar para autores antigos sem fonte específica."
