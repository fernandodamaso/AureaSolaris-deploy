porque_simbolico: |
  Os INTESTINOS fazem a ÚLTIMA CLASSIFICAÇÃO do corpo: o que vira nutrição (absorve) e o que vira lixo (elimina). É o FILTRO FINAL.
  Virgem = análise, classificação, método. Mercúrio = comunicação/transporte. Os intestinos 'comunicam' o corpo: 'isso entra, isso sai'.
  A metáfora de seleção e eliminação é linguagem simbólica; não explica sintomas digestivos.

