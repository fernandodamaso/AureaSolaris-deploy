camada_energetica:
  impressao_mental: "Virgem/Mercúrio é CLASSIFICAR e ELIMINAR — os intestinos separam o 'que serve' do 'que não serve' e ELIMINAM. A mente analisa e descarta."
  permeacao_emocional: "Ansiedade de 'não digerir bem' — intestino é o 'segundo cérebro' emocional."
  manifestacao_externa: "Campo simbólico de seleção, processamento e eliminação; não corresponde a sintomas ou eventos clínicos."
