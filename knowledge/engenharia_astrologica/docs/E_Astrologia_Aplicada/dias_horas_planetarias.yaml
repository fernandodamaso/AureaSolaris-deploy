status: review
id: "dias_planetarios"
nome: "Dias e Horas Planetárias"
tradicoes:
  - "aplicada contemporanea"
  - "tradicional quando explicitado"
tipo: "Astrologia Aplicada"
subtema: "Tempo e ritmo astrológico"

origens_e_divergencias:
  tradicional: "Dias e horas planetárias usam a ordem caldaica Saturno–Júpiter–Marte–Sol–Vênus–Mercúrio–Lua, difundida em tradições helenísticas, medievais e renascentistas."
  moderna: "Usos contemporâneos eletivos ou mágicos variam; não são uma regra universal para iniciar ou evitar ações."
  nota: "O cálculo divide o intervalo nascer do Sol–pôr do Sol em doze horas diurnas e o intervalo pôr–nascer em doze noturnas; as durações variam por local/data. A primeira hora diurna recebe o regente do dia e a sequência segue a ordem caldaica, não uma ordem inversa fixa."

referencias:
  - autor: "Vettius Valens"
    obra: "The Anthology"
    natureza: "fonte primária helenística"
    localizador: "Ordem planetária e cronologia; conferir edição"
  - autor: "Heinrich Cornelius Agrippa"
    obra: "Three Books of Occult Philosophy"
    natureza: "fonte renascentista"
    localizador: "Livro II, dias e horas planetárias; consultar edição"

regras_de_calculo:
  entrada: "Data, coordenadas, fuso/UTC, nascer e pôr do Sol calculados pela convenção declarada."
  sequencia: "Saturno, Júpiter, Marte, Sol, Vênus, Mercúrio, Lua, repetida ciclicamente."
  limite: "Não usar hora civil de sessenta minutos como substituto silencioso das horas temporais."

