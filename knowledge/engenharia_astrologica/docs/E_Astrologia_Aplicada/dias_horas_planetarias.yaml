camada_energetica:
  impressao_mental: "Cada dia/hora tem uma qualidade planetária. 'Hoje é dia de Marte: ação'. 'Esta hora é de Vênus: harmonia'."
  permeacao_emocional: "Ritmo emocional seguindo os ciclos planetários."
  manifestacao_externa: "Eventos prováveis de timing, planejamento, ritmo. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a SINCRONIZAR COM O RITMO CÓSMICO. Dia planetário não é regra — é sugestão."

como_usar: |
  Ordem dos dias:
  - Sábado = Saturno
  - Quinta-feira = Júpiter
  - Terça-feira = Marte
  - Domingo = Sol
  - Sexta-feira = Vênus
  - Quarta-feira = Mercúrio
  - Segunda-feira = Lua

  Horas planetárias seguem ordem inversa:
  - 1ª hora = planeta do dia
  - 2ª hora = próximo planeta
  - ...até completar 7
  - repetir ordem inversa para completar 24

