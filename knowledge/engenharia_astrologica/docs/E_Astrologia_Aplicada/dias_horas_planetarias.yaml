  lugares_fisicos: "Relógios, calendários, templos"
  objetos_materia: "Relógios solares, calendários, ampulhetas"
  eventos_tipicos: "Planejamento, timing, decisões"
  animais: "Gato (Saturnday), águia (Jupiter), lobo (Mars), leão (Sun), pomba (Venus), lebre (Mercury), caranguejo (Moon)"
  plantas_ervas: "Hera (Saturno), carvalho (Jupiter), alecrim (Marte), girassol (Sol), rosa (Vênus), verbena (Mercúrio), lírio (Lua)"
  metais_pedras: "Chumbo (Saturno), estanho (Jupiter), ferro (Marte), ouro (Sol), cobre (Vênus), mercúrio (Mercúrio), prata (Lua)"
  cores_sons:
    cores: ["Preto (Saturno)", "azul-royal (Jupiter)", "vermelho (Marte)", "dourado (Sol)", "verde (Vênus)", "amarelo (Mercúrio)", "prata (Lua)"]
    sons: ["Gongo (Saturno)", "órgão (Jupiter)", "tambor (Marte)", "trombeta (Sol)", "harpa (Vênus)", "silvo (Mercúrio)", "flauta (Lua)"]
  numeros: [7]
