atlas_simbolico:
  pessoas_arquetipos: "O consulente, o juiz, o mensageiro"
  lugares_fisicos: "Locais de consulta, tribunais"
  objetos_materia: "Mapas horários, perguntas, respostas"
  eventos_tipicos: "Consultas, respostas, decisões"
  animais: "Águia (visão), coruja (sabedoria)"
  plantas_ervas: "Sálvia, hera"
