nome: "Astrologia Horária"
tradicoes:
  - "horaria tradicional"
  - "medieval"
tipo: "Aprofundamento"
subtema: "Mapa da pergunta no tempo"

origens_e_divergencias:
  tradicional: "A horária de pergunta é especialmente documentada nas transmissões árabe-medievais e renascentistas; não deve ser reduzida a uma fórmula helenística única."
  moderna: "Linhas contemporâneas divergem sobre radicalidade, casas, recepção, orbes e permissibilidade da pergunta."
  nota: "A carta precisa registrar instante, local, sistema de casas, pergunta e escola. Significadores e condição vêm antes de qualquer resposta resumida."

referencias:
