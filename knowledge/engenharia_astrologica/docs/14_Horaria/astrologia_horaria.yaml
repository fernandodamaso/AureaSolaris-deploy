    - "Hermes (mensageiro)"
    - "Atena (estratégia)"
  mitos_historias: "Hermes e a resposta"
  expressao_elevada_sombra: "Elevada: resposta clara | Sombra: resposta ambígua"

camada_energetica:
  impressao_mental: "A horária é o 'mapa da pergunta no tempo'. 'O que eu pergunto agora?'."
  permeacao_emocional: "Ansiedade e espera por resposta. Quando saudável: clareza. Quando ferido: dúvida."
  manifestacao_externa: "Eventos prováveis de respostas, decisões. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a FAZER PERGUNTAS CLARAS. Horária não adivinha — responde o que é perguntado."

como_usar: |
  1. A pergunta deve ser CLARA e ESPECÍFICA.
  2. Calcule o mapa do MOMENTO da pergunta.
  3. Identifique os significadores (planetas que representam a pergunta).
  4. Leia os aspectos entre significadores.
  5. SEMPRE como tendência, não como sentença.

  Regra: se não sabe ler a resposta, não responda.

