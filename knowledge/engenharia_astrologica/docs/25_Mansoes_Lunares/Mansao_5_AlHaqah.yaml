status: draft

id: "mansao_5_alhaquah"
nome: "Mansão 5 — Al-Haq'ah (A Marca / 10°40'–13°20' Touro)"
tradicoes:
  - "arabes ocidentais"
  - "medievais"
regente: "Vênus (Dorotheus)"
qualidade: "Benéfica (beleza, contrato, marca sagrada)"
atlas_simbolico:
  pessoas_arquetipos: "O sombrio, o que se esconde, o mistério"
  lugares_fisicos: "Subterrâneos, cavernas, lugares de sombra"
  objetos_materia: "Espelhos, instrumentos de sombra, segredos"
  eventos_tipicos: "Mistérios, sombras, revelações tardias"
  animais: "Escorpião, serpente, morcego"
  plantas_ervas: "Papoula, açafrão, heléboro"
  metais_pedras: "Ferro, obsidiana, granada"
  cores_sons: "Vermelho-escuro, preto; notas Dó e Sol"
  numeros: "5 (mistério), 8 (transformação), 13 (morte)"
  dias_semana: "Terça-feira (Marte/Plutão)"
  doencas_corpo: "Sistema nervoso, órgãos sexuais"
  arquetipos_mitologicos: "Hécate, Hades/Plutão, Esculápio"
  mitos_historias: "Hécate e os cruzamentos; Esculápio e a cura"
  sonhos_simbolos_inconsciente: "Sombras, mistérios, segredos, revelações"
  expressao_elevada_sombra: "Elevada: sombra integrada, mistério consciente | Sombra: medo, segredos opressivos"

camada_energetica:
  impressao_mental: "A mente entra em TOURO + VÊNUS = 'o que é belo e meu'. Beleza que DEIXA MARCA."
  permeacao_emocional: "Amor estético, apego ao que 'fica', 'o que é meu para sempre'."
  manifestacao_externa: "Eventos PROVÁVEIS de encontro amoroso, arte, contrato, 'marca' (tatuagem, marca na vida). Arquétipos: a Marca, o Beijo. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a 'marcar o que ama' — a mansão 5 é de COMPROMISSO estético."

porque_simbolico: |
  Al-Haq'ah = 'A MARCA' (árabe) = a marca que DEIXA RASTRO (como o olho de Touro que deixa rastro).
  Vênus = beleza, contrato, apego. A mansão 5 = 'o que eu AMO e DEIXO MARCADO'.

linha_tradicao: "Dorotheus: mansão 5 = Vênus = 'beleza, contrato, sorte no amor'."
origens_e_divergencias:
  tradicional: "Simbólica astronômica/tradicional dos textos clássicos de astrologia."
  moderna: "Uso contemporâneo como recurso gráfico de memorização e estudo visual."
  nota: "Manter fidelidade ao glyph canônico; variações estilísticas são permitidas para caderno."

