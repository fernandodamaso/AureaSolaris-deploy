status: draft

id: "mansao_5_alhaquah"
revisao_editorial:
  estado: "draft_enriquecido"
  atribuicao: "Al-Haqʿah é a quinta manzil em listas árabes medievais; a identificação estelar e as correspondências rituais variam em manuscritos."
  divergencias: "Registrar transliteração, estrela e sistema de limites; o uso eletivo pertence à magia astral medieval, não a uma regra natal universal."
  uso_no_motor: "Exigir catálogo estelar e fonte da interpretação antes do cálculo."
referencias:
  - autor: "Abū Maʿshar"
    obra: "The Abbreviation of the Introduction to Astrology"
    data: "século IX"
    funcao: "transmissão árabe das mansões"
  - autor: "Christopher Warnock"
    obra: "The Mansions of the Moon"
    data: "2010"
    funcao: "reconstrução moderna ocidental explicitamente rotulada"
nome: "Mansão 5 — Al-Haq'ah (A Marca / 10°40'–13°20' Touro)"
tradicoes:
  - "arabes ocidentais"
  - "medievais"
regente: "Varia por catálogo e autor; não atribuir Vênus a Doroteu sem localizar a passagem."
qualidade: "Varia entre favorável, marcial, ambígua ou ligada a marca/ação conforme a tradição e o uso eletivo."
atlas_simbolico:
  pessoas_arquetipos: "O sombrio, o que se esconde, o mistério"
  lugares_fisicos: "Subterrâneos, cavernas, lugares de sombra"
  objetos_materia: "Espelhos, instrumentos de sombra, segredos"
  eventos_tipicos: "Mistérios, sombras, revelações tardias"
  animais: "Escorpião, serpente, morcego"
  plantas_ervas: "Papoula, açafrão, heléboro"
  metais_pedras: "Ferro, obsidiana, granada"
  cores_sons: "Vermelho-escuro, preto; notas Dó e Sol"
  numeros: "5 (mistério), 8 (transformação), 13 (morte)"
  dias_semana: "Terça-feira (Marte/Plutão)"
  doencas_corpo: "Sistema nervoso, órgãos sexuais"
  arquetipos_mitologicos: "Hécate, Hades/Plutão, Esculápio"
  mitos_historias: "Hécate e os cruzamentos; Esculápio e a cura"
  sonhos_simbolos_inconsciente: "Sombras, mistérios, segredos, revelações"
  expressao_elevada_sombra: "Elevada: sombra integrada, mistério consciente | Sombra: medo, segredos opressivos"

camada_energetica:
  impressao_mental: "A mente entra em TOURO + VÊNUS = 'o que é belo e meu'. Beleza que DEIXA MARCA."
  permeacao_emocional: "Amor estético, apego ao que 'fica', 'o que é meu para sempre'."
  manifestacao_externa: "Eventos PROVÁVEIS de encontro amoroso, arte, contrato, 'marca' (tatuagem, marca na vida). Arquétipos: a Marca, o Beijo. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a 'marcar o que ama' — a mansão 5 é de COMPROMISSO estético."

porque_simbolico: |
  Al-Haq'ah = 'A MARCA' (árabe) = a marca que DEIXA RASTRO (como o olho de Touro que deixa rastro).
  Vênus = beleza, contrato, apego. A mansão 5 = 'o que eu AMO e DEIXO MARCADO'.

linha_tradicao: "Al-Haqʿah é a quinta manzil em listas árabes e corresponde ao asterismo da Cabeça de Gêmeos; usos de marca, ação ou proteção variam nos textos."
origens_e_divergencias:
  tradicional: "Manāzil árabes e magia astral medieval tratam Al-Haqʿah como posição estelar e janela eletiva; não como regra natal única."
  moderna: "Reconstruções ocidentais modernas acrescentam linguagem de marca, sombra e compromisso; preservar como camada identificada."
  divergencias: "Transliterações, estrelas associadas e limites mudam entre catálogos; a faixa tropical exige declarar época/precessão."
  nota: "Não atribuir a Doroteu uma regência ou promessa amorosa sem fonte e localizador."

