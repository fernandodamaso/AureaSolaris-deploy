status: draft

id: "mansao_4_aldabaran"
nome: "Mansão 4 — Aldebaran (O Olho do Touro / 8°0'–10°40' Touro)"
tradicoes:
  - "arabes ocidentais"
  - "medievais"
regente: "Sol (Dorotheus)"
qualidade: "Benéfica (luz, proteção, sucesso)"
atlas_simbolico:
  pessoas_arquetipos: "O guerreiro, o que avança, o vitorioso"
  lugares_fisicos: "Campos de batalha, montanhas, lugares de tensão"
  objetos_materia: "Espadas, ferramentas de guerra, armaduras"
  eventos_tipicos: "Guerras, avanços, conquistas, vitórias"
  animais: "Touro, leão, lobo"
  plantas_ervas: "Alecrim, urtiga, plantas espinhosas"
  metais_pedras: "Ferro, aço, rubi, jaspe"
  cores_sons: "Vermelho, laranja; notas Si e Dó"
  numeros: "1 (início), 4 (tensão), 7 (guerra)"
  dias_semana: "Terça-feira (Marte)"
  doencas_corpo: "Cabeça, olhos, sistema nervoso"
  arquetipos_mitologicos: "Ares/Marte, Hércules, Teseu"
  mitos_historias: "Os 12 trabalhos; A guerra de Troia"
  sonhos_simbolos_inconsciente: "Guerras, avanços, conquistas, vitórias"
  expressao_elevada_sombra: "Elevada: guerra justa, avanço corajoso | Sombra: violência, agressividade"

camada_energetica:
  impressao_mental: "Aldebaran = OLHO QUE VÊ — a mente 'enxerga longe'."
  permeacao_emocional: "Confiança, 'eu vejo o caminho', proteção de quem guia."
  manifestacao_externa: "Eventos PROVÁVEIS de sucesso, proteção, liderança. Arquétipos: o Farol, o Guia. Inclinação, não destino."
  como_guiar_o_astral: "Aldebaran pede LIDERANÇA — a pessoa 'vê e guia'."

porque_simbolico: |
  Aldebaran = 'O SEGUIDOR' (árabe) = a estrela que SEGUE as Plêiades. É o OLHO do touro — o que VÊ e NÃO DESVIA.
  Sol = luz, identidade. A mansão 4 = 'o olho solar' — ver com a própria luz.

linha_tradicao: "Dorotheus: mansão 4 = Sol = 'sucesso, proteção, honra'."
origens_e_divergencias:
  tradicional: "Simbólica astronômica/tradicional dos textos clássicos de astrologia."
  moderna: "Uso contemporâneo como recurso gráfico de memorização e estudo visual."
  nota: "Manter fidelidade ao glyph canônico; variações estilísticas são permitidas para caderno."

