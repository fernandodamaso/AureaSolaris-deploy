status: draft

id: "mansao_3_al-thurayya"
nome: "Mansão 3 — Al-Thurayya (As Plêiades / 5°20'–8°0' Touro)"
tradicoes:
  - "arabes ocidentais"
  - "medievais"
regente: "Marte (Dorotheus)"
qualidade: "Maléfica (drama, luta, beleza perigosa)"
atlas_simbolico:
  pessoas_arquetipos: "O agrupado, o que brilha junto, o coletivo"
  lugares_fisicos: "Grupos, clubes, espaços coletivos, redes"
  objetos_materia: "Bandeiras, distintivos, instrumentos de grupo"
  eventos_tipicos: "Reuniões, grupos, coletividades, amizades"
  animais: "Cão pastor, golfinho, cisne"
  plantas_ervas: "Olivas, samambaia, zimbro"
  metais_pedras: "Alumínio, lápis-lazúli, água-marinha"
  cores_sons: "Azul-elétrico, prata; notas Mi e Lá"
  numeros: "3 (grupo), 6 (coletivo), 11 (gênio)"
  dias_semana: "Sábado (Saturno/Urano), segunda-feira (Lua)"
  doencas_corpo: "Tornozelos, circulação, sistema nervoso"
  arquetipos_mitologicos: "Prometeu, Atena, Zeus/Júpiter"
  mitos_historias: "Prometeu e o fogo coletivo; Atena e a cidade"
  sonhos_simbolos_inconsciente: "Grupos, coletivos, amizades, redes"
  expressao_elevada_sombra: "Elevada: grupo consciente, amizade verdadeira | Sombra: massificação, perda de identidade"

camada_energetica:
  impressao_mental: "A mente entra em TOURO — prazer e ESTÉTICA, mas com fio de MARTE (drama)."
  permeacao_emocional: "Beleza que fascina e assusta ao mesmo tempo — 'quero, mas tenho medo'."
  manifestacao_externa: "Eventos PROVÁVEIS de encontro ESTÉTICO intenso (arte, amor, luxo) — e de drama se Marte ativa. Arquétipos: as Plêiades, a Beleza Fatal. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a 'apreciar a beleza sem se perder' — a mansão 3 é perigosa por sedução."

porque_simbolico: |
  Al-Thurayya = AS PLÊIADES (árabe) = o aglomerado de estrelas no pescoço de Touro — BELEZA e também PERDA (as plêiades 'choram' na mitologia).
  Marte = DRAMA, LUTA. A mansão 3 = 'a beleza que corta' (como os chifres de Touro).

linha_tradicao: "Dorotheus: mansão 3 = Marte = 'beleza perigosa, drama, luta'."
origens_e_divergencias:
  tradicional: "Simbólica astronômica/tradicional dos textos clássicos de astrologia."
  moderna: "Uso contemporâneo como recurso gráfico de memorização e estudo visual."
  nota: "Manter fidelidade ao glyph canônico; variações estilísticas são permitidas para caderno."

