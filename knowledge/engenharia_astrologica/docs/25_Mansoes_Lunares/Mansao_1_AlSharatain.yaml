status: draft

id: "mansao_1_alsharatain"
nome: "Mansão 1 — Al-Sharatain (Os Dois Chifres / 0°–2°40' Áries)"
tradicoes:
  - "arabes ocidentais"
  - "medievais"
regente: "Saturno (Dorotheus)"
qualidade: "Maléfica (corte, perigo)"
atlas_simbolico:
  pessoas_arquetipos: "O pioneiro, o que inicia, o guerreiro"
  lugares_fisicos: "Campos de batalha, fronteiras, lugares de início"
  objetos_materia: "Espadas, sementes, instrumentos de início"
  eventos_tipicos: "Inícios, guerras, plantios, pioneirismo"
  animais: "Carneiro, lobo, falcão"
  plantas_ervas: "Alecrim, urtiga, girassol"
  metais_pedras: "Ferro, aço, jaspe, rubi"
  cores_sons: "Vermelho, dourado; notas Dó e Si"
  numeros: "1 (início), 2 (dualidade), 6 (colheita)"
  dias_semana: "Terça-feira (Marte), segunda-feira (Lua)"
  doencas_corpo: "Cabeça, olhos, sistema nervoso"
  arquetipos_mitologicos: "Ares/Marte, Hermes/Mercúrio"
  mitos_historias: "Ares e a guerra; Hermes e o início"
  sonhos_simbolos_inconsciente: "Guerras, sementes, inícios, pioneirismo"
  expressao_elevada_sombra: "Elevada: início consciente, pioneirismo | Sombra: pressa, impulsividade"

camada_energetica:
  impressao_mental: "O ciclo COMEÇA em SATURNO — a mente nasce com 'responsabilidade pesada' e 'fome de avanço'."
  permeacao_emocional: "Urgência de PARTIDA, mas medo de 'dar o primeiro passo'. Chifres de Áries = 'bater antes de pensar'."
  manifestacao_externa: "Eventos PROVÁVEIS de início ARRISCADO. Arquétipos: o Chifre, o Batedor Perigoso. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a 'canalizar a urgência' — a primeira mansão pede CORAGEM, não precipitação."

porque_simbolico: |
  Al-Sharatain = 'OS DOIS CHIFRES' (árabe) = os chifres de Áries (o carneiro). São a PARTIDA, mas também o PERIGO (chifres cortam).
  Regente Saturno = 'cabeça pesada' — nascer na mansão 1 = 'peso no nascimento', 'fome de fazer'.

linha_tradicao: "Dorotheus: mansão 1 = Saturno = 'perigo, mas sucesso se cauteloso'."
origens_e_divergencias:
  tradicional: "Simbólica astronômica/tradicional dos textos clássicos de astrologia."
  moderna: "Uso contemporâneo como recurso gráfico de memorização e estudo visual."
  nota: "Manter fidelidade ao glyph canônico; variações estilísticas são permitidas para caderno."

