status: draft
id: "mansoes_lunares"
revisao_editorial:
  estado: "draft_enriquecido"
  atribuicao: "O conjunto de 28 manāzil pertence principalmente à astrologia árabe medieval e à transmissão latina; nomes, estrelas e limites variam."
  divergencias: "Esta pasta estuda a linhagem árabe-ocidental; Jyotisha, mansões chinesas e zodíaco sideral não devem ser mesclados."
  uso_no_motor: "Declarar lista, catálogo de estrelas, época e método de longitude em toda saída."
referencias:
  - autor: "Abū Rayḥān al-Bīrūnī"
    obra: "The Book of Instruction in the Elements of the Art of Astrology"
    data: "século XI"
    funcao: "lista e descrição das manāzil"
  - autor: "Picatrix"
    obra: "Ghāyat al-Ḥakīm / Picatrix"
    data: "século XI–XIII"
    funcao: "usos eletivos e talismânicos"
nome: "Mansões Lunares"
tradicoes:
  - "arabes ocidentais"
  - "medievais"
tipo: "Aprofundamento"
subtema: "28 mansões da Lua"

origens_e_divergencias:
  tradicional: "Tradição árabe e helenística — 28 mansões lunares dividem o zodíaco lunar."
  moderna: "Magia cerimonial e astrologia prática — cada mansão tem qualidade."
  nota: "Revisar ao citar — marca a escola usada."

atlas_simbolico:
  pessoas_arquetipos: "A viajante, a sensitiva, o estágio"
  lugares_fisicos: "Céu noturno, caminhos lunares"
  objetos_materia: "Calendários lunares, mapas de fases"
  eventos_tipicos: "Ciclos, fases, mudanças emocionais"
  animais: "Caranguejo, gato, lebre, cisne"
  plantas_ervas: "Lírio, jasmim noturno, alface"
  metais_pedras: "Prata, pedra da lua, pérola"
  cores_sons:
    cores: ["Prata", "branco luar", "azul-prateado"]
    sons: ["Flauta", "murmúrio d'água"]
  numeros: [28, 13, 7]
  dias_semana: ["Segunda-feira"]
  doencas_corpo:
    doencas: ["Problemas digestivos", "ansiedade"]
    partes_corpo: ["Estômago", "útero", "seios"]
  arquetipos_mitologicos:
    - "Artemis"
    - "Hécate"
    - "Selene"
  mitos_historias: "Lua e Endimion"
  expressao_elevada_sombra: "Elevada: ciclo consciente | Sombra: ciclo inconsciente"

camada_energetica:
  impressao_mental: "28 mansões = 28 estágios do ciclo emocional. Cada uma tem QUALIDADE."
  permeacao_emocional: "Ciclo emocional completo. Quando saudável: ritmo. Quando ferido: descompasso."
  manifestacao_externa: "Eventos prováveis de mudança emocional por fase lunar. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a MAPEAR SEU CICLO LUNAR. Mansões são o relógio emocional."

como_usar: |
