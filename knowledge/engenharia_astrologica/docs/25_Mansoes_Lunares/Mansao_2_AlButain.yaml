status: draft

id: "mansao_2_albutain"
nome: "Mansão 2 — Al-Butain (O Peito / 2°40'–5°20' Áries)"
tradicoes:
  - "arabes ocidentais"
  - "medievais"
regente: "Júpiter (Dorotheus)"
qualidade: "Benéfica (generosidade, proteção)"
atlas_simbolico:
  pessoas_arquetipos: "O crescente, o que expande, o comunicador"
  lugares_fisicos: "Mercados, escolas, ruas, estações"
  objetos_materia: "Livros, cartas, instrumentos de comunicação"
  eventos_tipicos: "Comunicações, aprendizados, expansões"
  animais: "Borboleta, macaco, raposa"
  plantas_ervas: "Lavanda, menta, verbena"
  metais_pedras: "Mercúrio, ágata, citrino"
  cores_sons: "Amarelo, verde-claro; notas Mi e Lá"
  numeros: "2 (crescimento), 3 (comunicação), 5 (oportunidade)"
  dias_semana: "Quarta-feira (Mercúrio), segunda-feira (Lua)"
  doencas_corpo: "Pulmões, braços, sistema nervoso"
  arquetipos_mitologicos: "Hermes/Mercúrio, Atena, Apolo"
  mitos_historias: "Hermes mensageiro; Atena e a sabedoria"
  sonhos_simbolos_inconsciente: "Cartas, mapas, estradas, mensagens"
  expressao_elevada_sombra: "Elevada: comunicação consciente, aprendizado | Sombra: fofoca, superficialidade"

camada_energetica:
  impressao_mental: "Depois dos chifres, o PEITO — a mente agora RECEBE e ACOLHE."
  permeacao_emocional: "Generosidade, 'quero compartilhar', proteção."
  manifestacao_externa: "Eventos PROVÁVEIS de encontro generoso, proteção, sorte. Arquétipos: o Acolhedor, o Presente. Inclinação, não destino."
  como_guiar_o_astral: "Mostrar que a mansão 2 é DOM de generosidade — 'o que você dá, volta'."

porque_simbolico: |
  Al-Butain = 'O PEITO' (árabe) = o peito de Áries (o carneiro que avança). O peito RECEBE o ar, ACOLHE.
  Júpiter = expansão, generosidade. A mansão 2 é a PRIMEIRA PAUSA após a partida arriscada — 'respirar antes de avançar'.

linha_tradicao: "Dorotheus: mansão 2 = Júpiter = 'proteção, generosidade, sorte'."
origens_e_divergencias:
  tradicional: "Simbólica astronômica/tradicional dos textos clássicos de astrologia."
  moderna: "Uso contemporâneo como recurso gráfico de memorização e estudo visual."
  nota: "Manter fidelidade ao glyph canônico; variações estilísticas são permitidas para caderno."

