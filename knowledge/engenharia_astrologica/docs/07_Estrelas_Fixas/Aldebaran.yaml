porque_simbolico: |
  Aldebaran = 'O SEGUIDOR' (árabe) = a estrela que SEGUE as Plêiades. O touro SEGUE o que quer.
  OLHO DO TOURO = o olho que NÃO PISCA, que VÊ o alvo e NÃO DESVIA.

linha_tradicao: "Ptolomeu: Aldebaran = natureza de Marte (luta)."
