porque_simbolico: |
  Spica = 'ESPIGA DE TRIGO' (latim) — a parte da planta que ALIMENTA. Virgem = a ceifeira que COLHE.
  TRIGO = símbolo de AGRICULTURA e SOBREVIVÊNCIA — Spica = 'a estrela que nutre'.

linha_tradicao: "Ptolomeu: Spica = natureza de Vênus + Mercúrio (sorte, fertilidade, arte)."
