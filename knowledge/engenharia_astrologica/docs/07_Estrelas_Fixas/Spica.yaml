  permeacao_emocional: "Esperança de 'colher', generosidade, 'o que dou volta'."
  manifestacao_externa: "Eventos PROVÁVEIS de ganho material, fertilidade, sorte suave. Arquétipos: a Colheita, o Celeiro. Inclinação, não destino."
