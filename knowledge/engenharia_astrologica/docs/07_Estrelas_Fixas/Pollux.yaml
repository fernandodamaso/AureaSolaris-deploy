porque_simbolico: |
  Pollux = um dos GÊMEOS DIVINOS (Castor e Pollux). Pollux era IMORTAL; Castor, mortal. Pollux representa a parte QUE NÃO MORRE.
  Está em GÊMEOS = signo da DUALIDADE — Pollux = 'o lado imortal da dualidade'.

linha_tradicao: "Ptolomeu: Pollux = natureza de Marte (guerra, coragem, violência)."
