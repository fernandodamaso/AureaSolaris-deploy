  permeacao_emocional: "Valentia, 'sou imortal', mas risco de violência."
  manifestacao_externa: "Eventos PROVÁVEIS de coragem, luta, proteção de irmãos. Arquétipos: o Gêmeo Imortal, o Guerreiro. Inclinação, não destino."
