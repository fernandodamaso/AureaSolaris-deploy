porque_simbolico: |
  Algol = 'A CABEÇA DA MEDUSA' (árabe/grego) = a cabeça que PETRIFICA quem olha.
  Está em TOURO = signo do PRAZER e da POSSE — Algol em Touro = 'prazer que vira perigo' (gula, apego, luxo destrutivo).

linha_tradicao: "Ptolomeu: Algol = natureza de Saturno + Marte (perigo, violência, morte)."
