porque_simbolico: |
  Vega = 'A HARPA DE ORFEU' (árabe) = a música que ELEVA a alma. Orfeu desceu ao inferno e voltou com a harpa — Vega = 'subida após a descida'.
  Está em CAPRICÓRNIO = signo da ESTRUTURA — Vega = 'arte que estrutura'.

linha_tradicao: "Ptolomeu: Vega = natureza de Vênus + Mercúrio (arte, sorte)."
