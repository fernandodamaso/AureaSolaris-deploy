  arquetipos_mitologicos: os guardi?es do firmamento, os far?is fixos do c?u
  expressao_elevada_sombra: 'Elevada: orienta??o, mem?ria celeste, precis?o observacional | Sombra: press?gio simplista, fatalismo por cat?logo'
camada_energetica:
  campo_mental: Estrelas fixas são 'pontos de memória do cosmos' — elas marcam o fundo imutável sobre o qual o mapa gira.
  permeacao_emocional: Cada estrela carrega um arquétipo ancestral que ressoa no emocional.
  manifestacao_externa: Eventos PROVÁVEIS quando a estrela é ativada por trânsito ou por conjunção natal. Inclinação, não destino.
  como_guiar_o_astral: Usar como 'marca de fundo' — a estrela fixa dá o 'clima ancestral' do planeta/ângulo que ela toca.
linha_tradicao: Ptolomeu (Tetrabiblos), Hiparco, tradição helenística, árabe e renascentista. Cada estrela tem 'natureza' (benéfica/maléfica) e 'casa' preferencial.
nota: Magnitude e posição moderna usadas como referência; leitura simbólica é tradicional.
origens_e_divergencias:
  tradicional: Tradição astrológica clássica/árabe/ptolomaica.
  moderna: Interpretação simbólica e psicológica moderna.
  nota: Revisar fontes específicas para cada mansão/ponto.
