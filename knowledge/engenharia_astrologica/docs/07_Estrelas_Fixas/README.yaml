status: draft
id: estrelas_fixas
nome: Estrelas Fixas
tradicoes:
- tradicional
- editorial
tema: As estrelas de primeira magnitude e sua simbologia astrológica
essencia:
- Regulus (α Leão) — coração do leão, realeza, sucesso com risco de queda
- Aldebaran (α Touro) — olho do touro, luta, persistência
- Antares (α Escorpião) — coração do escorpião, intensidade, crise
- Sirius (α Cão Maior) — estrela do cão, proteção, brilho, fama
- Spica (α Virgem) — espiga de trigo, fertilidade, sorte material
- Algol (β Perseu) — cabeça da Medusa, perigo, intensidade sombria
- Fomalhaut (α Peixe Austral) — boca do peixe, idealismo, promessa
atlas_simbolico:
  pessoas_arquetipos: vigias do c?u, navegadores, catalogadores estelares, int?rpretes de press?gios
  lugares_fisicos: observat?rios, desertos noturnos, mares de navega??o astron?mica, atlas estelares
  objetos_materia: astrol?bios, cat?logos, cartas celestes, tabelas de precess?o
