porque_simbolico: |
  Arcturus = 'GUARDIÃO DO URSO' (árabe/grego) = quem PROTEGE a constelação.
  Está em LIBRA = signo da JUSTIÇA — Arcturus = 'proteção equilibrada'.

linha_tradicao: "Ptolomeu: Arcturus = natureza de Júpiter + Marte (proteção, justiça)."
