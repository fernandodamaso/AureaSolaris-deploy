camada_energetica:
  impressao_mental: "Sirius = BRILHO e PROTECÃO — a mente 'guia os outros'."
  permeacao_emocional: "Lealdade, proteção, 'sou o farol'."
  manifestacao_externa: "Eventos PROVÁVEIS de fama, proteção, 'chegada de mestre'. Arquétipos: o Cão de Guarda, o Farol. Inclinação, não destino."
  como_guiar_o_astral: "Sirius pede SERVIR COM BRILHO — a pessoa 'é vista' e precisa 'guiar'."

porque_simbolico: |
  Sirius = 'QUEIMANDO' (grego). É a estrela MAIS BRILHANTE do céu — o 'sol do solstício de verão' (egípcios alinhavam a pirâmide a ela).
  CÃO MAIOR = animal de PROTECÃO e FIDELIDADE. Sirius = 'o cão que guia'.

linha_tradicao: "Ptolomeu: Sirius = natureza de Vênus + Júpiter (fama, sorte, proteção)."
