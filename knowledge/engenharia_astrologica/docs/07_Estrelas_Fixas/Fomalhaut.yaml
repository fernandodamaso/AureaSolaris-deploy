  permeacao_emocional: "Esperança mística, 'algo maior vem'."
  manifestacao_externa: "Eventos PROVÁVEIS de inspiração, arte, espiritualidade. Arquétipos: a Boca que Canta, o Poeta. Inclinação, não destino."
