porque_simbolico: |
  Fomalhaut = 'BOCA DO PEIXE' (árabe) = o peixe que ABRE a boca para o invisível.
  Está em PEIXES = signo da dissolução — Fomalhaut = 'a promessa que vem do mar'.

linha_tradicao: "Ptolomeu: Fomalhaut = natureza de Vênus + Mercúrio (arte, idealismo)."
