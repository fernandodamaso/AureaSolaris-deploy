porque_simbolico: |
  Antares = 'RIVAL DE ARES' (árabe/grego) — compete com Marte (o planeta da guerra). É o 'anti-Marte': mesma intensidade, mas mais profunda.
  CORAÇÃO DO ESCORPIÃO = o ponto onde a 'picada' acontece — onde a dor vira transformação.

linha_tradicao: "Ptolomeu: Antares = natureza de Marte + Saturno (intensidade perigosa)."
