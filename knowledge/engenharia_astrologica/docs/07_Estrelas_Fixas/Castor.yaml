camada_energetica:
  impressao_mental: "Castor = MORTALIDADE e TALENTO — a mente 'sabe que vai morrer e por isso cria'."
  permeacao_emocional: "Melancolia, 'sou humano', mas risco de desespero."
  manifestacao_externa: "Eventos PROVÁVEIS de talento humano, criação, morte/renascimento simbólico. Arquétipos: o Artista, o Humano. Inclinação, não destino."
  como_guiar_o_astral: "Castor pede CRIAR PORQUE SOMOS MORTAIS — a pessoa 'faz arte porque sabe que acaba'."

porque_simbolico: |
  Castor = um dos GÊMEOS DIVINOS, mas era MORTAL (ao contrário de Pollux). Representa a parte HUMANA, que CRIA porque SABE que morre.
  Está em GÊMEOS = signo da DUALIDADE — Castor = 'o lado mortal da dualidade'.

linha_tradicao: "Ptolomeu: Castor = natureza de Mercúrio (talento, comunicação, morte)."
