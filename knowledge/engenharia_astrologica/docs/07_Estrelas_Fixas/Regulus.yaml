  como_guiar_o_astral: "Regulus pede HUMILDADE NO SUCESSO — a coroa só dura se o rei serve."

porque_simbolico: |
  Regulus = 'PÉ PEQUENO' (latim) = o rei que PISA FIRME (coragem) mas que pode CAIR se pisar em falso.
  Está no CORAÇÃO de Leão = o centro do 'rei dos animais'.
  Tradição: 'Regulus dá sucesso, mas pede generosidade; se o nativo for cruel, a estrela traz queda'.

linha_tradicao: "Ptolomeu: Regulus = natureza de Júpiter + Marte (sucesso com força)."
aviso_cosmico: "A 'Queda de Regulus' = quando o poder vira abuso."
