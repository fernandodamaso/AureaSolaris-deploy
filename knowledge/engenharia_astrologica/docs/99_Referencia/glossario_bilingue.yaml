- pt: Urano
  en: Uranus
  definicao: Urano — termo do atlas simbólico.
- pt: Vega
  en: Vega
  definicao: Vega — termo do atlas simbólico.
- pt: Vênus
  en: Venus
  definicao: Vênus — termo do atlas simbólico.
- pt: Virgem
  en: Virgo
  definicao: Virgem — termo do atlas simbólico.
- pt: Benéfico
  en: Benefic
  definicao: 'Planeta tradicionalmente positivo: Júpiter (grande benéfico) e Vênus
    (pequeno benéfico).'
- pt: Casa derivada
  en: Derivative house
  definicao: 'Casa usada para representar outra pessoa/questão a partir de um ponto
    focal do mapa (ex.: Casa 7 = parceiro).'
- pt: Cúspide
  en: Cusp
  definicao: Linha divisória entre duas casas ou signos.
- pt: Descendente
  en: Descendant
  definicao: Ponto oposto ao Ascendente; cúspide da Casa 7; representa o outro, parcerias.
- pt: Direto
  en: Direct motion
  definicao: Movimento normal e aparente de um planeta pelo zodíaco, em direção ao
    leste.
- pt: Efeméride
  en: Ephemeris
  definicao: Tabela de posições planetárias para datas/horas específicas; ferramenta
    básica do astrólogo.
- pt: Estação planetária
  en: Station
  definicao: Momento em que um planeta aparenta parar antes de mudar de direção (direto/retrógrado).
- pt: Estrela Fixa
  en: Fixed star
  definicao: 'Estrela de primeira magnitude usada como referência em astrologia; ex.:
    Regulus, Sirius, Aldebaran.'
- pt: Fogo lunar
  en: Lunar phase
  definicao: Fase da Lua vista da Terra; base para timing emocional e eclipses.
- pt: Grau anaretico
  en: Anaretic degree
  definicao: 29° de qualquer signo; grau crítico de finalização, pressão e karmas
    urgentes.
- pt: Ímum Coeli
  en: Imum Coeli
  definicao: Ponto mais baixo do céu; oposto ao MC; cúspide da Casa 4; lar, raízes,
    privado.
- pt: Ingresso
  en: Ingress
  definicao: Momento em que um planeta entra num novo signo; muda o tom das matérias
    que governa.
- pt: Lua Balsâmica
  en: Balsamic Moon
  definicao: Fase final do ciclo lunar (antes da Lua Nova); introspecção, fechamento,
    cura.
- pt: Lua Crescente
  en: Waxing Crescent
  definicao: Fase após a Lua Nova; início, germinação, novos começos.
- pt: Lua Gibbous
  en: Gibbous Moon
  definicao: Fase entre o quarto crescente e a Lua Cheia; crescimento, análise, ajuste.
- pt: Luminação
  en: Luminary
  definicao: Sol e Lua coletivamente; corpos que emitem ou refletem luz diretamente.
- pt: Maléfico
  en: Malefic
  definicao: 'Planeta tradicionalmente desafiador: Saturno (grande maléfico) e Marte
    (pequeno maléfico).'
- pt: MC
  en: Midheaven
  definicao: Ponto mais alto do céu; cúspide da Casa 10; carreira, reputação pública,
    destino social.
- pt: Meio Céu
  en: Medium Coeli
  definicao: Ver MC.
- pt: Nodo Norte
  en: North Node
  definicao: Ponto de crescimento espiritual e direção de vida; eixo nodoso.
- pt: Nodo Sul
  en: South Node
  definicao: Ponto de passado, talentos naturais e padrões cármicos antigos; oposto
    ao Nodo Norte.
- pt: Parte do Espírito
  en: Part of Spirit
  definicao: Lote calculado por Sol - Lua + ASC; contraparte da Parte da Fortuna;
    propósito, vontade, carreira ativa.
- pt: Perigeu
  en: Perigee
  definicao: Ponto mais próximo da Terra na órbita da Lua; correlaciona-se com Priapo.
- pt: Planeta interior
  en: Inner planet
  definicao: 'Planetas pessoais e rápidos: Sol, Lua, Mercúrio, Vênus, Marte.'
- pt: Precessão
  en: Precession
  definicao: Movimento lento do eixo terrestre (~26.000 anos); causa a diferença entre
    zodíaco tropical e sideral.
- pt: Quente
  en: Hot planet
  definicao: 'Planetas quentes por natureza: Sol, Marte, Júpiter; associados a fogo,
    ação, expansão.'
- pt: Retorno de Saturno
  en: Saturn Return
  definicao: Trânsito de Saturno à sua posição natal, ocorrendo por volta dos 29,
    58 e 87 anos; amadurecimento, estruturas, responsabilidade.
- pt: Retrogradação
  en: Retrogradation
  definicao: Movimento aparente de um planeta em direção oposta à normal; revisão,
    internalização.
- pt: Significador natural
  en: Natural significator
  definicao: 'Planeta tradicionalmente associado a um tema (ex.: Júpiter = riqueza,
    Saturno = tempo).'
- pt: Signo interceptado
  en: Intercepted sign
  definicao: Signo que fica totalmente dentro de uma casa, sem cúspide; energia presa/internalizada.
- pt: Sincronicidade
  en: Synchronicity
  definicao: Coincidência significativa entre evento psíquico e evento externo; Jung
    + astrologia.
- pt: Terra
  en: Earth
  definicao: 'Signos de Terra: Touro, Virgem, Capricórnio; praticidade, materialidade,
    estabilidade.'
- pt: Vento solar
  en: Solar wind
  definicao: Fluxo de partículas do Sol; não é termo astrológico tradicional.
- pt: Água
  en: Water
  definicao: 'Signos de Água: Câncer, Escorpião, Peixes; emoção, intuição, profundidade.'
- pt: Árvore da Vida
  en: Tree of Life
  definicao: Diagrama da Cabala com 10 Sephiroth; mapeia a criação divina.
- pt: Árido
  en: Barren sign
  definicao: 'Signos tradicionalmente estéreis: Gêmeos, Leão, Virgem; pouca fertilidade.'
- pt: Juno
  en: Juno
  definicao: 'Asteroides: compromisso, casamento, rivalidade, lealdade.'
- pt: Pallas
  en: Pallas
  definicao: 'Asteroides: estratégia, arte, padrão, proteção.'
- pt: Vesta
  en: Vesta
  definicao: 'Asteroides: devoção, foco, serviço, pureza.'
- pt: Ceres
  en: Ceres
  definicao: 'Asteroides: nutrição, cuidado, colheita, maternidade.'
- pt: Vertex
  en: Vertex
  definicao: Ponto calculado do mapa; porta do destino, encontros fatais.
- pt: East Point
  en: East Point
  definicao: Ponto da eclíptica no horizonte leste no momento do nascimento.
- pt: Antivertex
  en: Antivertex
  definicao: Ponto oposto ao Vertex; liberação de destino.
- pt: Void-of-course
  en: Void-of-course Moon
  definicao: Período em que a Lua não faz mais aspectos antes de mudar de signo; traditionalmente
    desfavorável para iniciar ações.
- pt: Profecção anual
  en: Annual profection
  definicao: 'Técnica de timing: avanço de 1 signo por ano de vida; destaca área e
    planeta regente do ano.'
- pt: Arco solar
  en: Solar arc
  definicao: 'Método de direção simbólica: avança todos os pontos pelo mesmo arco
    do Sol progredido.'
- pt: Albedo
  en: Albedo
  definicao: 'Fase alquímica branca: purificação após a putrefação (nigredo).'
- pt: Rubedo
  en: Rubedo
  definicao: 'Fase alquímica vermelha: consciência iluminada, união dos opostos.'
- pt: Citrinitas
  en: Citrinitas
  definicao: 'Fase alquímica amarela: iluminação solar, despertar da consciência.'
- pt: Sigilo
  en: Sigil
  definicao: Símbolo gráfico de um planeta/espírito; usado em talismãs e operações
    mágicas.
- pt: Sephiroth
  en: Sephiroth
  definicao: 10 esferas da Árvore da Vida cabalística; emanações divinas.
- pt: Corpus Hermeticum
  en: Corpus Hermeticum
  definicao: Coleção de textos gnósticos/helenísticos atribuídos a Hermes Trismegisto;
    base da filosofia hermética.
- pt: Syzygy
  en: Syzygy
  definicao: Alinhamento Sol-Lua-Terra; eclipse ou lua nova/cheia; na astrologia lunar
    avançada = momento de fecundação/formação.
- pt: Lua Pré-Natal
  en: Prenatal Syzygy
  definicao: Última Lua Nova ou Lua Cheia antes do nascimento; ponto formativo do
    mapa.
- pt: Retorno Lunar
  en: Lunar return
  definicao: Mapa calculado para o momento em que a Lua retorna à posição natal; ciclo
    de ~27.3 dias.
- pt: Benéfico/Maléfico
  en: Benefic/Malefic
  definicao: 'Classificação tradicional: Júpiter/Vênus = benéficos; Saturno/Marte
    = maléficos.'
- pt: Receção mútua
  en: Mutual reception
  definicao: Dois planetas mutuamente no domicílio um do outro; atenuação de dificuldades.
- pt: Regente diurno/nocturno
  en: Day ruler / Night ruler
  definicao: 'Para uma triplicidade: planeta diurno rege o dia, nocturno rege a noite.'
- pt: Dignidade essencial
  en: Essential dignity
  definicao: 'Força do planeta por posição no signo/casa: domicílio, exaltação, triplicidade,
    face, termo.'
- pt: Dignidade acidental
  en: Accidental dignity
  definicao: 'Força do planeta por condições não-essenciais: angularidade, velocidade,
    aspectos, etc.'
- pt: Significador acidental
  en: Accidental significator
  definicao: Planeta que, por circunstâncias acidentais, assume a regência de um tema
    no julgamento.
- pt: Out of bounds
  en: Out of bounds
  definicao: Planeta cuja declinação ultrapassa o limite solar máximo; energia mais
    livre/extrema.
- pt: Sect
  en: Sect
  definicao: 'Classificação do mapa por dia/noite: planetas diurnos (Sol, Júpiter,
    Saturno) vs. noturnos (Lua, Vênus, Marte); muda dignidades.'
- pt: Temperamento
  en: Temperament
  definicao: 'Constitucional astrológica baseada nos 4 elementos/qualidades: sanguíneo,
    fleumático, bilioso, melancólico.'
- pt: Humor
  en: Humor
  definicao: 'Fluido corporal na teoria médica astrológica: sangue (ar), fleuma (água),
    bile amarela (fogo), bile negra (terra).'

