status: draft
id: glossario_bilingue
nome: Glossário Bilíngue
tradicoes:
  - "editorial"
  - "referencia"
tipo: Referência
subtema: Termos astrológicos PT/EN
origens_e_divergencias:
  tradicional: Termos originais gregos/latinos.
  moderna: Traduções modernas e adaptações.
  nota: Bilingue PT/EN para acesso internacional.
atlas_simbolico:
  pessoas_arquetipos: O estudante, o tradutor, o pesquisador
  lugares_fisicos: Bibliotecas, arquivos
  objetos_materia: Dicionários, glossários
  eventos_tipicos: Traduções, estudos
  animais: Coruja (sabedoria)
  plantas_ervas: Sálvia (memória)
  metais_pedras: Prata (lua), cristal (clareza)
  cores_sons:
    cores:
    - Prata
    - azul-claro
    sons:
    - Dó
    - lá
  numeros:
  - 3
  - 6
  - 9
  dias_semana:
  - Quarta-feira
  doencas_corpo:
    doencas:
    - Problemas nervosos
    - olhos
    partes_corpo:
    - Olhos
    - cérebro
  arquetipos_mitologicos:
  - Hermes (comunicação)
  - Atena (sabedoria)
  mitos_historias: Hermes e a escrita
  expressao_elevada_sombra: 'Elevada: tradução fiel | Sombra: erro de interpretação'
camada_energetica:
  impressao_mental: Glossário é a PONTE entre idiomas e tradições.
  permeacao_emocional: 'Clareza conceitual. Quando saudável: comunicação. Quando ferido:
    confusão.'
  manifestacao_externa: Eventos prováveis de estudos, traduções. Inclinação, não destino.
  como_guiar_o_astral: Ajudar a pessoa a PRECISAR OS TERMOS. Glossário é ferramenta,
    não fim.
glossario:
- pt: Aspecto
  en: Aspect
  definicao: Ângulo entre dois planetas. Mede a relação entre duas energias.
- pt: Casa
  en: House
  definicao: Área da vida onde o planeta se manifesta.
- pt: Dignidade
  en: Dignity
  definicao: Força do planeta no signo/casa.
- pt: Eclipse
  en: Eclipse
  definicao: Sombra da Lua ou da Terra sobre o Sol/Lua.
- pt: Eixo nodoso
  en: Nodal axis
  definicao: Nodo Norte (missão) e Nodo Sul (passado).
- pt: Horário
  en: Hour
  definicao: Divisão do dia em 12 partes iguais para timing planetário.
- pt: Lote
  en: Lot / Part
  definicao: Ponto matemático calculado no mapa.
- pt: Orbe
  en: Orb
  definicao: Margem de erro para considerar um aspecto ativo.
- pt: Parte da Fortuna
  en: Part of Fortune
  definicao: Ponto de sorte e prosperidade.
- pt: Progressão
  en: Progression
  definicao: Avanço simbólico do mapa ao longo do tempo.
- pt: Regente
  en: Ruler
  definicao: Planeta que governa um signo/casa.
- pt: Signo
  en: Sign
  definicao: Divisão de 30° do zodíaco. Modo de ser.
- pt: Trânsito
  en: Transit
  definicao: Posição atual de um planeta que ativa o mapa natal.
- pt: Alcocoden
  en: Alcocoden
  definicao: Planeta que indica a duração da vida nativa na astrologia tradicional.
- pt: Almuten
  en: Almuten / Almuten figuris
  definicao: Planeta com maior dignidade essencial no mapa ou em pontos específicos.
- pt: Anareta
  en: Anareta
  definicao: Planeta ou ponto significador de morte/evento terminal na tradição helenística.
- pt: Apheta
  en: Apheta
  definicao: Significador da vida/longevidade; correlaciona-se com Alcocoden/Hyleg.
- pt: Casa angular
  en: Angular house
  definicao: Casa 1, 4, 7, 10 — de ação e manifestação imediata.
- pt: Casa cadente
  en: Cadent house
  definicao: Casa 3, 6, 9, 12 — de internalização e finalização.
- pt: Casa sucedente
  en: Succedent house
  definicao: Casa 2, 5, 8, 11 — de desenvolvimento e acumulação.
- pt: Combustão
  en: Combustion
  definicao: Planeta muito próximo ao Sol, enfraquecido pela luz solar (a menos que
    Cazimi).
- pt: Contra-antíscia
  en: Contra-antiscia
  definicao: Reflexo de um planeta no ponto oposto do eixo solsticial; relação por
    declinação.
- pt: Cronocrator
  en: Time lord / Chronocrator
  definicao: Planeta regente de um período temporal em sistemas previsivos (Firdarias,
    etc).
- pt: Decano
  en: Decan
  definicao: Divisão de 10° dentro de um signo (3 por signo).
- pt: Declinação
  en: Declination
  definicao: Distância angular de um corpo em relação ao equador celeste; base para
    paralelos.
- pt: Diurnal/Noturno
  en: Diurnal/Nocturnal
  definicao: 'Classificação por sect: planetas diurnos (Sol, Júpiter, Saturno) e noturnos
    (Lua, Vênus, Marte).'
- pt: Domicílio
  en: Domicile
  definicao: Signo regido naturalmente por um planeta; sua casa.
- pt: Domificação
  en: House division
  definicao: Método de dividir a esfera celeste em 12 casas (Placidus, Koch, Whole
    Sign, etc).
- pt: Eleição
  en: Electional astrology
  definicao: Escolha de momento auspicioso para iniciar uma ação.
- pt: Exaltação
  en: Exaltation
  definicao: Posição de máxima expressão simbólica do planeta num signo.
- pt: Exílio
  en: Detriment
  definicao: Planeta no signo oposto ao seu domicílio; energia em tensão.
- pt: Face
  en: Face
  definicao: Divisão de 10° dentro de um decanato (3 faces por decanato = 10° cada).
- pt: Firdaria
  en: Firdaria / Firdâriyya
  definicao: 'Sistema de timing medievaliraniano: períodos planetários sucessivos.'
- pt: Geocêntrico
  en: Geocentric
  definicao: Ponto de vista Terra-centrado, padrão em astrologia.
- pt: Grande Cruz
  en: Grand Cross
  definicao: Quadratura entre 4 planetas (2 oposições); tensão máxima.
- pt: Hyleg
  en: Hyleg / Al-haylaj
  definicao: Ponto de partida para cálculo da duração da vida na tradição.
- pt: Inconsciente
  en: Unconscious
  definicao: Conceito junguiano de conteúdos psíquicos não acessíveis diretamente.
- pt: Individuação
  en: Individuation
  definicao: Processo de integração dos arquétipos junguianos; eixo evolutivo.
- pt: Lilith (Média)
  en: Mean Lilith / Black Moon
  definicao: Média do apogeu lunar; não é a mesma que Lilith osculante.
- pt: Macrocosmo
  en: Macrocosm
  definicao: O todo, o universo; paralelo ao microcosmo humano.
- pt: Melotesia
  en: Melothesia
  definicao: Correspondência entre signos/planetas e partes do corpo/doenças.
- pt: Microcosmo
  en: Microcosm
  definicao: O ser humano como espelho do universo.
- pt: Midpoint
  en: Midpoint
  definicao: Ponto médio entre dois planetas; base para técnicas de midpoint relacional.
- pt: Monômoro
  en: Monomoirion
  definicao: Valor numérico de 1° de movimento lunar em horas.
- pt: Mundos
  en: Mundane astrology
  definicao: Astrologia de coletividades, países, eventos mundiais.
- pt: Nigredo
  en: Nigredo
  definicao: Fase alquímica da putrefação/escurecimento; correspondente à crise inicial.
- pt: Nocturnal/Diurnal
  en: Nocturnal/Diurnal chart
  definicao: Mapa com Sol abaixo/above do horizonte; determina sect.
- pt: Orbe (aplicativo)
  en: Applying orb
  definicao: Aspecto que se forma no futuro próximo; aplicação.
- pt: Orbe (separativo)
  en: Separating orb
  definicao: Aspecto que se desfaz; separação.
- pt: Peregrino
  en: Peregrine
  definicao: Planeta sem dignidade essencial no signo onde está.
- pt: Picatrix
  en: Picatrix / Ghayat al-Hakim
  definicao: Tratado de magia astrológica islâmico-espanhol do séc. X-XI.
- pt: Planeta Feral
  en: Feral planet
  definicao: Planeta no signo oposto ao seu domicílio e sem dignidade acidental.
- pt: Prefeito
  en: Prefeito / Significador natural
  definicao: Planeta naturalmente associado ao tema consultado.
- pt: Priapo
  en: Priapo / Perigee
  definicao: Ponto de perigeu lunar; oposto ao apogeu.
- pt: Profeção
  en: Profection
  definicao: 'Técnica de timing: avanço de 1 signo por ano a partir do ASC.'
- pt: Queda
  en: Fall
  definicao: Planeta no signo onde está em exílio relativo; segunda dignidade negativa.
- pt: Quincúncio
  en: Quincunx / Inconjunct
  definicao: 150°; aspecto de desajuste entre elementos/modalities.
- pt: Receção
  en: Reception
  definicao: Dois planetas mutuamente no domicílio/exaltação um do outro.
- pt: Retorno Solar
  en: Solar return
  definicao: Mapa calculado para o momento em que o Sol retorna à posição natal.
- pt: Saros
  en: Saros cycle
  definicao: Período de 223 meses sinódicos que regula a repetição de eclipses.
- pt: Septo
  en: Septile
  definicao: 51.4°; aspecto menor de ordem 7, associado a crises interiores.
- pt: Stellium
  en: Stellium
  definicao: 3+ planetas no mesmo signo/casa; concentração de energia.
- pt: T-Square
  en: T-Square
  definicao: Quadratura com um planeta oposto a outro e terceiro em quadratura aos
    dois.
- pt: Termo
  en: Term
  definicao: Faixa zodiacal dentro de um signo atribuída a planetas específicos.
- pt: Topocêntrico
  en: Topocentric
  definicao: Ponto de vista localizado na superfície terrestre.
- pt: Triplicidade
  en: Triplicity
  definicao: Grupo de 3 signos do mesmo elemento; dignidade menor.
- pt: Yod
  en: Yod
  definicao: Configuração de 2 sextis + 1 quincúncio; aponta para desajuste/compulsão.
- pt: Aldebaran
  en: Aldebaran
  definicao: Aldebaran — termo do atlas simbólico.
- pt: Algol
  en: Algol
  definicao: Algol — termo do atlas simbólico.
