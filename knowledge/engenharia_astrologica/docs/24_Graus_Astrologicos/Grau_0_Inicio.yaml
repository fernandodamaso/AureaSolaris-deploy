validacao_de_fontes:
  base: "A ficha separa início técnico, 0° de Áries/equinócio e simbolismo contemporâneo."
  limite: "O motor não deve afirmar ingenuidade, abertura mágica ou novo começo como efeito inevitável de 0° natal."

