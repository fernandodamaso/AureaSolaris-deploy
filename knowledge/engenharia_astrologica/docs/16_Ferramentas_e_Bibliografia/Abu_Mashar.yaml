id: "abu_mashar"
nome: "Abu Ma‘shar"

tradicoes:
  - "persa e ?rabe medieval"
  - "historiografia contempor?nea"
tema: "As Revoluções dos Anos nas Natividades — tratado clássico de previsão por revoluções solares e profecção"
status: review
origem: "Árabe, século IX d.C. — traduzido para o latim como Albumasar"
obra: "De Magnis Coniunctionibus / Revolutions of the Years in Nativities"
conceitos:
  - "Revoluções dos anos"
  - "Profecção"
  - "Conjunções máximas"
  - "Previsão por tempo"
essencia:
  - "Clássico fundamental para técnicas de previsão por revoluções solares e profecção."
  - "Sistematiza o uso dos anos planetários e retornos solares na astrologia nativa."
  - "Base para tradições medievais e renascentistas de timing astrológico."
tradicao: "Astrologia árabe medieval → latim → renascimento europeu"
fontes:
  - "Traduções latinas dos séculos XII–XIII"
  - "Comentários de Guido Bonatti, Regiomontanus"
aplicacao:
  - "Cálculo de revolução solar para cada aniversário"
  - "Uso de profecção como técnica simplificada de progressão"
  - "Interpretação de conjunções e eclipses em trânsito"
como_usar:
  - "Identificar o ano planetário a partir da idade do nativo"
  - "Lançar o mapa de revolução solar para o ano em questão"
  - "Comparar com o mapa natal e trânsitos relevantes"
porque_simbolico: "Cada ano carrega a energia de um planeta regente segundo ciclos tradicionais. A revolução solar marca um novo ciclo de consciência e eventos."
leitura_carmica: "Revoluções indicam pontos de escolha e maturation da alma no ano. Eclipses e aspectos tensos sinalizam desafios de crescimento."
aplicativo_separativo: "Revolução: mudança de ciclo, novo ano de expressão. Profecção: aceleração de temas por domínio planetário."
exemplo_pratico: "Uma pessoa com 30 anos está no ano de Saturno/Sol — usar revolução solar para avaliar carreira e autoridade."
arquetipos_simbolicos:
  expressao_elevada: "sábio do tempo"
  expressao_sombra: "fatalismo temporal"
consenso_tradicional: "Foi uma autoridade decisiva na astrologia árabe-latina medieval, mas não existe consenso de que todas as técnicas modernas chamadas 'revolução solar' reproduzam Abu Ma'shar. Bonatti, Regiomontanus e Morin pertencem a recepções posteriores e devem ser citados separadamente."
notas: "Inclui também teoria das conjunções máximas (Júpiter-Saturno) para história mundana."
camada_energetica:
  campo_mental: "O tempo como linguagem simbólica; cada ano reativo um arquétipo planetário."
  permeacao_emocional: "Antecipação e preparo emocional para ciclos de crescimento."
  manifestacao_externa: "Eventos concretos no ano regido pelo planeta da idade."
  como_guiar_o_astral: "Usar revoluções para alinhar decisões aos ciclos naturais do tempo."
origens_e_divergencias:
  tradicional: "Astrologia árabe ptolomaica com influências hindus e persas."
  moderna: "Integrado com psicologia temporal e ritmos biológicos."
  nota: "Comparar com direções primárias e progressões para triangulação."
revisao_editorial:
  atribuicao: "Abu Ma'shar (Abū Maʿšar al-Balkhī, 787–886) escreveu tratados sobre revoluções anuais, profecias e grandes conjunções. A transmissão latina medieval traduziu e reorganizou partes de sua obra; não se deve atribuir automaticamente a ele cada regra moderna de retorno solar."
  divergencias: "A técnica medieval usa senhores dos anos, profecções, revoluções e ingressos em combinações que variam por manuscrito e autor. A expressão moderna 'revolução solar' é uma aproximação editorial, não uma fórmula única de Abu Ma'shar."
  uso_no_motor: "Oferecer como perfil de escola: registrar idade, método de contagem, local do retorno, profecção e regras de prioridade. Nunca substituir a posição astronômica do retorno por uma narrativa cármica."
referencias:
