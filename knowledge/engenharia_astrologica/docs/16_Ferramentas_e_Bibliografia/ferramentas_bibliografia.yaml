revisao_editorial:
  atribuicao: "A bibliografia reúne fontes primárias, traduções, estudos historiográficos, escolas modernas e ferramentas de cálculo. Uma página ou software não substitui a obra que fundamenta uma regra."
  divergencias: "Astro.com, Astro-Seek e Solar Fire são calculadoras/repositórios de opções, não autoridades únicas sobre interpretação. Sistemas de casas, orbes e dignidades devem registrar a convenção selecionada."
  uso_no_motor: "Antes de calcular, registrar efeméride, versão, fuso IANA, zodíaco, sistema de casas, orbes e fonte de regra; manter links e data de consulta como metadados, sem tratar resultados de sites como verdade canônica."

