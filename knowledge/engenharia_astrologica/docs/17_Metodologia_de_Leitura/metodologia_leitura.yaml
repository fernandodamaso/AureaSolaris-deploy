validacao_de_fontes:
  base: "A ficha distingue metodologia editorial, julgamento tradicional e sequência psicológica moderna."
  limite: "O motor não deve pular auditoria de dados nem aplicar uma ordem natal a horária, eletiva ou previsão sem escolha explícita."

