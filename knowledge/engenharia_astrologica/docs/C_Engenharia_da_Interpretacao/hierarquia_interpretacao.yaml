  sonhos_simbolos_inconsciente: "Tribunais, argumentos, decisões"
  expressao_elevada_sombra: "Elevada: justiça, síntese, sabedoria | Sombra: parcialidade, dogmatismo"

camada_energetica:
  impressao_mental: "Como PENSAR o mapa. Primeiro: Sol (essência), depois Lua (contexto emocional), depois Ascendente (expressão)."
  permeacao_emocional: "Interpretação como julgamento justo — não como sentença."
  manifestacao_externa: "Eventos prováveis de decisões, sínteses, conclusões. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a ENTENDER A ORDEM. Não misturar tradições sem avisar."

como_usar: |
  Procedimento editorial, não ordem universal:
  1. Declare finalidade (natal, horária, eletiva, previsional, relacional) e tradição.
  2. Verifique dados, zodíaco, sistema de casas, seita, tabelas e pontos incluídos.
  3. Identifique significadores primários exigidos pela técnica (por exemplo, Ascendente/regente, luminar da seita, casa/pergunta).
  4. Julgue condição essencial e acidental, angularidade, fase/movimento e relações relevantes.
  5. Procure repetição e contradição antes de recorrer a fatores secundários ou simbólicos.
  6. Só então acrescente a camada psicológica, kármica, hermética ou sistêmica explicitamente rotulada.
  7. Sintetize com evidências, limites e divergências; não reduza o mapa a uma lista de palavras-chave.

referencias:
  - autor: "William Lilly"
    obra: "Christian Astrology"
    natureza: "primária histórica"
    localizador: "Princípios de significadores e julgamento; conferir edição."
  - autor: "Guido Bonatti"
    obra: "Liber Astronomiae"
    natureza: "primária histórica"
    localizador: "Ordem de julgamento e condições; conferir tradução/edição."
  - autor: "Jean-Baptiste Morin"
    obra: "Astrologia Gallica"
    natureza: "primária histórica"
    localizador: "Regras de julgamento natal; conferir edição/tradução."

validacao_de_fontes:
  base: "A ficha trata prioridade como método dependente de técnica, não como dogma de Sol–Lua–Ascendente."
  limite: "O motor não deve ocultar a tradição ou apresentar síntese multiescola como consenso."

