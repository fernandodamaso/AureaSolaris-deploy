status: review
id: "hierarquia_interpretacao"
nome: "Hierarquia de Interpretação"
tradicoes:
  - "editorial"
  - "multiescola"
tipo: "Engenharia da Interpretação"
subtema: "Primazia dos fatores"

origens_e_divergencias:
  tradicional: "Lilly, Bonatti, Valens e Morin oferecem métodos de julgamento com prioridades próprias; não existe uma ordem única em que Sol, Lua e Ascendente sempre ocupem as mesmas posições."
  moderna: "Linhas psicológicas podem iniciar pelas funções Sol–Lua–Ascendente, mas isso é uma pedagogia moderna, não a hierarquia universal da astrologia tradicional."
  nota: "Hierarquia é um protocolo de leitura escolhido por finalidade e escola. O sistema deve mostrar a ordem aplicada e os fatores que a modificaram."

atlas_simbolico:
  pessoas_arquetipos: "O juiz, o advogado, o conselheiro, o estrategista"
  lugares_fisicos: "Tribunais, bibliotecas, escritórios"
  objetos_materia: "Livros de lei, balanças, argumentos escritos"
  eventos_tipicos: "Julgamentos, sínteses, argumentações, decisões"
  animais: "Águia, lobo, coruja"
  plantas_ervas: "Sálvia, hera, carvalho"
  metais_pedras: "Prata, diamante, jaspe"
  cores_sons:
    cores: ["Azul", "dourado", "preto"]
    sons: ["Gongo", "tambor", "silêncio"]
  numeros: [1, 3, 7]
  dias_semana: ["Quinta-feira"]
  doencas_corpo:
    doencas: ["Problemas de visão", "ansiedade", "insônia"]
    partes_corpo: ["Olhos", "cérebro", "sistema nervoso"]
