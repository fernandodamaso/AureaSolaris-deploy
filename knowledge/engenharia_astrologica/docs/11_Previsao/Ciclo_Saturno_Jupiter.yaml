id: ciclo_saturno_jupiter
nome: Ciclo Saturno–Júpiter e grandes conjunções
tipo: ciclo_mundano_e_sinodico
tradicoes:
- medieval árabe e latina
- renascentista
- mundana contemporânea
status: review
definicao: Ciclo sinódico formado pelas conjunções, quadraturas e oposições entre
  Júpiter e Saturno. A conjunção é chamada de grande conjunção na tradição mundana.
  O ciclo é astronomicamente uma relação recorrente de longitude; as leituras de eras,
  religiões, dinastias ou elementos pertencem a escolas históricas específicas e não
  a uma consequência física da conjunção.
fundamento_astronomico:
  conjuncao: Ocorre quando as longitudes geocêntricas de Júpiter e Saturno coincidem;
    há uma grande conjunção aproximadamente a cada 20 anos.
  fases: Conjunção inicia um ciclo sinódico; quadraturas e oposição são relações angulares
    posteriores a calcular com data/hora e orbe declarados.
  retrogradacao: Algumas conjunções podem envolver passagens múltiplas aparentes;
    registrar a sequência direta/retrógrada/direta.
  trigonos: A sucessão de grandes conjunções desenha padrões de longo prazo no zodíaco,
    mas o esquema de triplicidades e suas durações varia entre autores.
linhas_historicas:
- Textos árabes e latinos de astrologia histórica usaram grandes conjunções na leitura
  de períodos coletivos, povos, religiões e dinastias.
- Abu Ma'shar é fonte central para a astrologia histórica das conjunções; Kepler também
  elaborou modelos de sucessões Jupiter–Saturno.
- A prática moderna pode lê-las como ciclos sociais, mas deve separar essa síntese
  de atribuições históricas textualmente determinadas.
procedimento_mundano:
- Calcular a conjunção exata, incluindo ocorrências retrógradas, signo, latitude,
  visibilidade e localidade da carta.
- 'Escolher o autor/escola para a hierarquia: conjunções menores, médias/maiores,
  triplicidades, ingressos ou regentes de período.'
- Relacionar a conjunção com ingresso, sizígia, eclipse e cartas territoriais somente
  pelas regras de combinação da tradição escolhida.
- Definir claramente o escopo coletivo (região, Estado, cultura, período), evitando
  inferir o mesmo efeito para toda pessoa individual.
- Separar a série de dados históricos da interpretação astrológica proposta no estudo
  de casos.
nao_confundir_com:
- 'Retorno de Júpiter ou Saturno: retorno de longitude natal individual, não relação
  entre dois planetas.'
- 'Conjunção visual especialmente próxima: proximidade angular observável e conjunção
  eclíptica não são critérios idênticos.'
- 'Cronocrator individual: a grande conjunção é técnica mundana; usos pessoais são
  adaptações posteriores.'
camada_simbolica:
  imagem: Júpiter e Saturno reabrem periodicamente uma articulação entre expansão,
    legislação, estrutura e sucessão histórica conforme a linguagem das escolas.
  curiosidade: O nome 'grande conjunção' é tradicional para Júpiter–Saturno; não significa,
    em astronomia, que os planetas estejam fisicamente próximos.
divergencias_e_limites:
- Durações, elementação das triplicidades, regências de épocas e uso de grandes/médias/menores
  conjunções não são unânimes.
- A categoria histórica de 'era' não deve ser usada sem a definição temporal exata
  do autor.
- A frequência aproximada de 20 anos é dado de calendário; a significação mundana
  é uma operação astrológica histórica.
