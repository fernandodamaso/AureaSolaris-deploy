id: ingressos_mundanos
nome: Ingressos sazonais e julgamento mundano
tipo: tecnica_mundana_de_tempo
tradicoes:
- helenística e ptolomaica
- medieval e renascentista
- mundana contemporânea
status: review
definicao: Ingresso é a entrada do Sol em um signo ou de outro fator num novo signo.
  No julgamento mundano tradicional, têm especial relevo as quatro entradas solares
  nos signos cardinais, ligadas a equinócios e solstícios. Uma carta de ingresso é
  uma técnica coletiva/sazonal, não um mapa natal anual simplificado.
fundamento_astronomico:
  cardinais_tropicais: 0° de Áries, Câncer, Libra e Capricórnio correspondem aos equinócios
    e solstícios no zodíaco tropical.
  instante: Calcular a hora exata em que a longitude tropical aparente do Sol alcança
    0° do signo, usando efeméride e escala de tempo declaradas.
  localidade: Planetas têm a mesma longitude no instante global; ângulos e casas dependem
    do local/território da carta mundana.
  escala: A carta pode ser estudada para localidade, nação, região ou tema coletivo
    somente se sua jurisdição for definida.
procedimento_tradicional:
- Definir território, período e tradição de casas/regências antes de levantar a carta.
- Calcular o ingresso solar e, se a escola o requer, a sizígia precedente, eclipses,
  grandes conjunções e cartas de lunação.
- Examinar ângulos, regente do Ascendente, luminares, casas temáticas e planetas relevantes
  segundo o autor.
- 'Distinguir carta de ingresso anual de ingressos intermediários: escolas divergem
  sobre quando cada carta governa e como se subordinam.'
- Registrar visibilidade e território para fenômenos complementares, em vez de tratar
  uma carta global como se suas casas fossem universais.
nao_confundir_com:
- Ingresso de planeta pessoal em signo natal, que é trânsito individual.
- Revolução solar, que retorna à longitude natal do Sol de uma pessoa.
- Mapa de equinócio/solstício astronômico sem método mundano declarado.
camada_simbolica:
  imagem: Os quatro portais sazonais organizam o ano tropical; a carta do céu no limiar
    estrutura, para as escolas mundanas, a leitura de uma estação.
  linguistica: Ingresso vem de ingressus, entrada; aqui descreve um fato de longitude
    antes de qualquer juízo de acontecimento.
divergencias_e_limites:
- Ptolomeu e autores medievais não aplicam os mesmos procedimentos, casas, territórios
  ou hierarquia de cartas.
- O uso contemporâneo de ingresso para uma pessoa é uma adaptação que não deve apagar
  a escala mundana original.
- A técnica requer fontes históricas e exemplos por autor; não existe uma lista única
  de significados de ingresso.
referencias:
