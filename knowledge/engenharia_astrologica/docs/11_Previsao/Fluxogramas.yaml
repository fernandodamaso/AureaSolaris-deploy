  permeacao_emocional: "Clareza ao seguir passos; ansiedade se o fluxo for confuso."
  manifestacao_externa: "Aulas, consultas estruturadas, material didático."
  como_guiar_o_astral: "Oferecer fluxogramas como 'mapa do mapa' — o consulente entende o processo."

tecnicas:
  ordem:
    - "1. Planetas por dignidade/força"
    - "2. Aspectos por orbe e natureza"
    - "3. Casas por cúspides e regentes"
    - "4. Timing por trânsitos/progressões"
  exemplo: "Fluxograma de leitura de relacionamento: Saturno em Casa 7 → falta de limite → trânsito Saturno em Casa 7 → prova de compromisso."
  adaptacao:
    regra: "Cada leitor deve ter seu fluxograma pessoal."
    cuidado: "Fluxograma não substitui intuição; é apoio."

