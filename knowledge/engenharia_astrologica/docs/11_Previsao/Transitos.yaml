id: transitos
nome: 'Trânsitos: método de cálculo e julgamento'
tipo: tecnica_de_movimento_atual
tradicoes:
- tradicional ocidental
- moderna ocidental
status: review
definicao: Trânsito é a relação, numa data e hora, entre a posição atual de um corpo
  celeste e fatores de uma carta de referência. É uma família de observação geométrica,
  não uma lista de palavras-chave. A leitura muda conforme se trate de natividade,
  carta de retorno, mapa mundano, horária ou eletiva.
dados_e_calculo:
  carta_de_referencia: Definir se o trânsito é lido sobre mapa natal, retorno, evento,
    mundano ou eleição; não alternar o mapa sem registrar.
  fatores: Selecionar antes os planetas, ângulos, lotes, estrelas ou cúspides admitidos
    pela escola.
  aspecto: Calcular longitude, aspecto por grau e orbe com critérios declarados; signo
    inteiro e aspecto por grau podem ter funções distintas em tradições diferentes.
  movimento: Anotar aplicação/separação, estações, retrogradação e repetições do contato.
  data: Usar UTC, local/fuso, efeméride, zodíaco e convenção de casas do protocolo
    reprodutível.
procedimento:
- Começar pelos significadores natais e pelo assunto, antes de procurar contatos transitórios.
- Calcular contatos exatos e janela de orbe com data/hora, distinguindo passagem direta,
  retrógrada e direta posterior.
- Avaliar o trânsito segundo natureza/condição do fator em movimento e do fator natal,
  casas, regências e recepção quando a escola usar esses critérios.
- Relacionar a janela ao senhor do tempo ou retorno vigente, se houver um método complementar
  escolhido.
- Separar fato astronômico (posição e aspecto), regra de escola e interpretação simbólica
  no registro.
regras_para_motor:
  saida_minima_obrigatoria:
  - Mapa de referência declarado, fator em trânsito, fator radical, aspecto, orbe,
    aplicação/separação, direção do movimento e carimbo temporal.
  - Quando houver retrogradação, listar cada passagem distinta e não só a data central
    mais próxima.
  guardrails:
  - Não gerar interpretação sem informar a escola ou o protocolo de julgamento adotado.
  - Exigir hora natal confiável para ângulos e lotes sensíveis ao minuto.
  - Não confundir aspecto por grau com relação por signo inteiro quando a técnica mantiver
    ambos separados.
camadas_de_escala:
  rapidos: 'Lua, Sol, Mercúrio, Vênus e Marte: ritmos mais breves; o valor interpretativo
    depende do mapa e do método.'
  lentos_tradicionais: 'Júpiter e Saturno: ciclos mais longos e retornos próprios.'
  modernos: Urano, Netuno e Plutão podem ser usados em escolas modernas; seu emprego
    não deve ser retroprojetado nos métodos tradicionais.
  angulos_e_lotes: Contatos com ângulos e lotes requerem hora natal e fórmula de lote
    confiáveis.
nao_confundir_com:
- 'Retorno planetário: caso particular de trânsito em que o próprio corpo retorna
  à longitude natal.'
- 'Progressão ou direção: mapa simbólico/direcional obtido por fórmula, não posição
  atual do planeta.'
- 'Carta de lunação ou eclipse: figura coletiva/cíclica específica, que pode ser comparada
  a trânsitos sem ser sinônimo deles.'
divergencias_e_limites:
- Orbes, aspectos admitidos, peso de planetas lentos e uso de casas variam muito entre
  escolas.
- O fato de ocorrer três passagens por retrogradação é uma propriedade de certos ciclos,
  não uma regra de interpretação em três atos.
- Trânsito isolado não elimina a necessidade de julgamento natal e de uma escala temporal
  clara.
