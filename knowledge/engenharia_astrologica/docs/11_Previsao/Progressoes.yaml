  lugares_fisicos: di?rios, calend?rios de vida, espelhos de passagem
  objetos_materia: efem?rides p?s-natais, linhas evolutivas, mapas secund?rios
  eventos_tipicos: amadurecimento, mudan?a de fase, internaliza??o gradual, viradas subjetivas
