nome: Progressões
tema: Avançar o mapa por dias/meses após o nascimento — evolução interna e timing.
essencia:
- 'Progressão secundária: 1 dia = 1 ano de vida.'
- Indica desenvolvimento interno, não eventos externos diretos.
- Comparar com trânsitos para timing.
- 'Progressão primária: 1 ano = 1 ano; rara no uso contemporâneo.'
origens_e_divergencias:
  tradicional: Não era usada na astrologia tradicional; é moderna.
  moderna: Progressões secundárias pertencem a linhagens modernas; a atribuição de sua popularização varia por autor e deve ser conferida na fonte, sem retroprojetá-las à astrologia tradicional.
  nota: Usar como complemento, não como método único de timing.
