  permeacao_emocional: Amadurecimento gradual; nem sempre visível de fora.
  manifestacao_externa: Eventos PROVÁVEIS quando progressão ativa trânsito real.
  como_guiar_o_astral: Usar progressão como espelho do desenvolvimento interior, não como datação externa.
tecnicas:
  secundaria:
    regra: 1 dia depois do nascimento = 1 ano de vida.
    uso: Interpretar planeta/signo/casa progressado como tema interno.
    aspecto: Progressão ativa trânsito = evento provável.
  terciaria:
    regra: 1 dia apos o nascimento = 1 mes aproximado de vida, conforme a convencao declarada.
    uso: Variant of modern symbolic timing; keep separate from both secondary progressions and primary directions.
  comparacao:
    regra: Progressão + trânsito = janela de timing.
    exemplo: Progressão Lua quadratura Saturno + trânsito Saturno em Casa 10 = prova profissional.
