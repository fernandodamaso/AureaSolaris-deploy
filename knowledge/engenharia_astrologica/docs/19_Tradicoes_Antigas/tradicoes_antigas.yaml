camada_energetica:
  impressao_mental: "A astrologia nasce da OBSERVAÇÃO. Os antigos olharam o céu e viram PADRÕES."
  permeacao_emocional: "Tradição como raiz. Quando saudável: respeito. Quando ferido: dogma, rigidez."
  manifestacao_externa: "Eventos prováveis de redescoberta, estudo de textos antigos. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a HONRAR A RAIZ SEM SER PRISIONEIRA. Tradição é base, não gaiola."

como_usar: |
  Ordem histórica:
  1. Babilônia (1800 a.C.) — primeiro registro de planetas
  2. Egito (1500 a.C.) — decanos, casas
  3. Grécia (500 a.C.) — Ptolomeu, aspectos, dignidades
  4. Roma — difusão
  5. Idade Média — preservação árabe
  6. Renascimento — nova interpretação
  7. Modernidade — psicologia e evolução

