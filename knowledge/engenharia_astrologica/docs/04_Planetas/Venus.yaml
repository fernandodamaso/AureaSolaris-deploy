camada_energetica:
  impressao_mental: "A mente de 'o que me atrai?'. Gosto, preferência, harmonia. Quando atrito: obsessão por beleza, indecisão amorosa, cálculo frio do que 'vale a pena'."
  permeacao_emocional: "Doçura e prazer. Quando bloqueado: frieza, crítica estética, 'não mereço'. Quando solto: generosidade, entrega."
  manifestacao_externa: "Eventos prováveis de encontros, arte, dinheiro, casamento. Trânsitos tendem a trazer encontros ou crises de valor."
  como_guiar_o_astral: "Ajudar a mente a reconhecer o que valoriza de verdade — não o que é socialmente esperado. Vênus pede autenticidade no desejo, não só na aparência."

representa:
  pessoas: ["Amante", "Artista", "Jovem mulher", "Diplomata"]
  eventos: ["Casamento", "Encontro", "Compra de arte/joias", "Celebração"]
  corpo: ["Rins", "Lombar", "Órgãos genitais femininos"]

dignidades_essenciais:
