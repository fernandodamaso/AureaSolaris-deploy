  detrimento: ["Escorpião", "Áries"]
  queda: ["Virgem"]

astronomia_e_regras_de_julgamento:
  astronomia_observacional:
    - "Planeta visível em forte brilho, porém sempre relativamente próximo do Sol; alterna estrela matutina e vespertina."
    - "Retrogradação, estações, combustão e elongação máxima são condições observáveis relevantes para seu estado."
  criterios_tradicionais:
    - "Vênus é benéfica por natureza, mas sua eficácia depende de dignidade, casa, aspecto, sect e estado solar."
    - "Mudanças entre aparição matutina/vespertina podem ser usadas por escolas específicas; não universalizar sem fonte."
  notas_de_motor:
    - "Auditar elongação, direção, combustão/cazimi e estado oriental/ocidental antes de fixar leitura automática."
    - "Separar amor/afeição tradicionais, acordos, prazeres e valor material das ressignificações psicológicas ou cármicas."

combinacoes_exemplo:
  casa_7:
    temas: ["casamento", "parceria", "beleza compartilhada"]
    possiveis_efeitos: ["atração forte", "gosto estético refinado", "necessidade de harmonia no relacionamento"]
    reforcado_por: ["jupiter_dignificado", "lua_conjunto"]
    amenizado_por: ["saturno_conjunto", "marte_aflito"]

origens_e_divergencias:
  escola_tradicional:
    autores: [Ptolomeu, Bonatti]
    conceito: "O pequeno benéfico, significador de amor, concórdia, prazeres, artes, acordos e bens agradáveis."
  escola_moderna:
    autores: [Liz Greene, Jung]
    conceito: "Função do sentimento: como valoramos, amamos e criamos harmonia."
  escola_evolutiva:
    autores: [Green, Forrest]
    conceito: "O que a alma veio aprender sobre amar e ser amado, através de repetições de padrão."
  por_que_da_divergencia: "Tradicional vê Vênus como benéfico material/emocional; moderna acrescenta a função psicológica de 'valorar'."
