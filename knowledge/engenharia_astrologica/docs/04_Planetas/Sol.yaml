camada_energetica:
  impressao_mental: "Senso de 'eu sou'. Foco, propósito, a direção que a mente quer assumir. Quando atrito: crise de identidade, necessidade de reconhecimento."
  permeacao_emocional: "Vitalidade e alegria quando alinhado; melancolia/perda de brilho quando bloqueado. É a fonte do ânimo."
  manifestacao_externa: "Eventos prováveis ligados a reconhecimento, liderança, saúde vital, pai (arquétipo solar). Trânsitos tendem a marcar picos de visibilidade ou crise de ego."
  como_guiar_o_astral: "Ajudar o consulente a reconhecer o que é expressão autêntica vs. vaidade defensiva. O Sol pede que a mente se autorize a brilhar — não para dominar, mas para centralizar a própria vida."

