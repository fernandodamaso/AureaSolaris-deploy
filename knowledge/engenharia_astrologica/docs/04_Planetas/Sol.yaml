astronomia_e_regras_de_julgamento:
  astronomia_observacional:
    - "Luminar diurno; não retrograda."
    - "O Sol não recebe combustão por estar no centro do critério; sua conjunção descreve a condição solar dos outros corpos."
  criterios_tradicionais:
    - "Julgar por signo, casa, dignidade, seita, aspectos, regência e relação com o Ascendente."
    - "Em cartas diurnas, sua participação na economia de seita e nos temas de visibilidade costuma ganhar peso."
  notas_de_motor:
    - "Não marcar o Sol como retrógrado, combusto ou sob os raios."
    - "Separar significações tradicionais de vida, autoridade e centralidade das leituras psicológicas modernas sobre ego e individuação."

