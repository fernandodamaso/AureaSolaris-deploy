origens_e_divergencias:
  escola_tradicional:
    autores: [Ptolomeu, Valens]
    conceito: "Luminar diurno e fonte de vida, calor, autoridade, visibilidade e vitalidade; não pertence à categoria técnica de benéfico ou maléfico."
  escola_moderna:
    conceito: "O Self, o centro da personalidade, a individuação (Jung/Rudhyar)."
  por_que_da_divergencia: "A visão moderna psicologizou o Sol: de 'o corpo e a vida' para 'o centro do eu e o propósito da alma'."
