astronomia_e_regras_de_julgamento:
  astronomia_observacional:
    - "Planeta superior de movimento relativamente lento, com retrogradações anuais longas e visíveis."
    - "Sua condição por casa, dignidade, visibilidade e aplicação pesa mais do que um rótulo genérico de abundância."
  criterios_tradicionais:
    - "Júpiter é o grande benéfico, porém o benefício concreto depende de assunto, regências, aspecto, recepção e sect."
    - "Em leituras tradicionais, lei, conselho, fé, magistratura, proteção e ampliação devem ser separados de promessas modernas de otimismo ilimitado."
  notas_de_motor:
    - "Não traduzir Júpiter automaticamente como sorte irrestrita; qualificar por condição, assunto e método."
    - "Registrar retrogradação, estações e repetição de aspectos em técnicas preditivas."

