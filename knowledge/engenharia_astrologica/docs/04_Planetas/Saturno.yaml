astronomia_e_regras_de_julgamento:
  astronomia_observacional:
    - "Planeta tradicional mais lento, com permanência prolongada por signo e retrogradações extensas."
    - "Sua lentidão amplia o peso de repetição temporal, maturação, demora e consolidação em várias técnicas."
  criterios_tradicionais:
    - "Como grande maléfico, Saturno deve ser julgado por dignidade, casa, aspectos, recepção, sect e assunto específico."
    - "Em muitas leituras tradicionais, fora de seita tende a endurecer mais; em boa condição pode estabilizar, preservar e estruturar."
  notas_de_motor:
    - "Não reduzir Saturno a trauma ou bloqueio psicológico: tempo, escassez, velhice, limite, rigor, estrutura e persistência pertencem ao núcleo histórico."
    - "Registrar explicitamente sua função cronológica em ciclos longos, retornos e contatos repetidos."

