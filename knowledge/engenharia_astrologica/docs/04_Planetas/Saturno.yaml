origens_e_divergencias:
  escola_tradicional:
    autores: [Ptolomeu, Bonatti, Agrippa]
    conceito: "O Grande Maléfico, significador da morte, do tempo, das perdas e das estruturas rígidas."
  escola_psicologica:
    autores: [Liz Greene, Jung]
    conceito: "O arquétipo do Pai Crítico Interno, a necessidade de estrutura e limites saudáveis."
  por_que_da_divergencia: "Tradicional: Saturno = maléfico que limita. Moderna: Saturno = professor que estrutura a personalidade."
