camada_energetica:
  impressao_mental: "A mente de 'como eu sustento?'. Tempo, limite, estrutura. Quando atrito: medo, rigidez, autocrítica, nunca é suficiente."
  permeacao_emocional: "Peso, solidez. Quando bloqueado: depressão, solidão, coração duro. Quando solto: maturidade, serenidade."
  manifestacao_externa: "Eventos prováveis de perda, estrutura, trabalho, tempo. Trânsitos tendem a marcar provas ou amadurecimento."
  como_guiar_o_astral: "Ajudar a mente a ver o limite como proteção, não punição. Saturno pede paciência e construção realista."

