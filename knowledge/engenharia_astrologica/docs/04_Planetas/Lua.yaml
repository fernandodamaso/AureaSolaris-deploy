astronomia_e_regras_de_julgamento:
  astronomia_observacional:
    - "Luminar noturno de movimento muito rápido; fase, velocidade e aplicação mudam sensivelmente em pouco tempo."
    - "A relação angular Sol–Lua informa fase, visibilidade e parte importante do julgamento tradicional."
  criterios_tradicionais:
    - "Julgar fase, casa, signo, aspectos, velocidade, aplicação/separação e relação com a seita."
    - "Hora natal imprecisa pode alterar de modo importante casas, aspectos partís e até o retorno lunar calculado."
  notas_de_motor:
    - "Não reduzir a Lua apenas ao emocional: povo, corpo, fluxos, nutrição, mudança e imaginação pertencem ao núcleo tradicional."
    - "Separar fase lunar observável de interpretações psicológicas posteriores."

combinacoes_exemplo:
  casa_4:
    temas: ["lar", "raízes", "mãe", "fim de vida"]
    possiveis_efeitos: ["forte ligação com a origem", "necessidade de ninho", "memória emotiva da família"]
    reforcado_por: ["venus_conjunto", "sol_dignificado"]
    amenizado_por: ["saturno_conjunto", "marte_aflito"]

origens_e_divergencias:
  escola_tradicional:
    autores: [Ptolomeu, Valens]
    conceito: "Luminar noturno ligado ao corpo, ao povo, à mutabilidade, à nutrição, aos fluxos e às condições corporais; não pertence à categoria técnica de benéfico ou maléfico."
  escola_psicologica:
    autores: [Liz Greene, Jung]
    conceito: "O arquétipo da mãe, o inconsciente pessoal, a capacidade de nutrir e ser nutrido."
  escola_evolutiva:
    autores: [Green, Forrest]
    conceito: "A ligação com a mãe biológica e o padrão emocional de segurança/insegurança herdado."
  por_que_da_divergencia: "A tradicional enfatiza corpo e povo; a moderna enfatiza a mãe interna e o padrão emocional."
