camada_energetica:
  impressao_mental: "A mente de 'sinto antes de pensar'. Receptividade, memória, apego, imaginação. Quando atrito: ansiedade, oscilação, apego a padrões antigos."
  permeacao_emocional: "Fluidez emocional. Quando bloqueado: oscilação, marés internas. Quando solto: empatia, nutrição."
  manifestacao_externa: "Eventos prováveis de mudança de humor, nutrição, lar, mãe (arquétipo), viagem. Trânsitos tendem a abrir ou fechar ciclos emocionais."
  como_guiar_o_astral: "Ajudar a mente a reconhecer a própria fluidez: o que sente hoje não é o que sentirá amanhã. O Lua pede acolhimento, não julgamento."

