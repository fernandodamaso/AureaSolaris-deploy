astronomia_e_regras_de_julgamento:
  astronomia_observacional:
    - "Planeta rápido e sempre relativamente próximo do Sol; alterna aparições matutinas e vespertinas."
    - "Retrogradações, estações, combustão e máxima elongação alteram fortemente sua observação e seu julgamento tradicional."
  criterios_tradicionais:
    - "Mercúrio é altamente condicional: natureza funcional e efeitos dependem da própria condição e das associações com benéficos, maléficos e luminares."
    - "Orientalidade/ocidentalidade, velocidade e estado solar devem ser declarados antes de sínteses interpretativas."
  notas_de_motor:
    - "Auditar elongação solar, velocidade, direção de movimento e estado oriental/ocidental antes de classificar a condição de Mercúrio."
    - "Não tratar Mercúrio como intrinsecamente benéfico ou maléfico sem contexto técnico."

combinacoes_exemplo:
  casa_3:
    temas: ["comunicação", "irmãos", "viagens curtas", "estudo"]
    possiveis_efeitos: ["mente ágil", "fala fácil", "curiosidade insaciável"]
    reforcado_por: ["venus_conjunto", "jupiter_dignificado"]
    amenizado_por: ["saturno_conjunto", "marte_aflito"]

origens_e_divergencias:
  escola_tradicional:
    autores: [Ptolomeu, Bonatti]
    conceito: "Planeta da linguagem, mediação, comércio, cálculo, escrita e razão discursiva, cuja qualidade prática depende muito de condição e companhia."
  escola_moderna:
    autores: [Liz Greene, Jung]
    conceito: "Função psicológica do pensamento: como a mente organiza, comunica e conecta ideias."
  por_que_da_divergencia: "Tradicional vê Mercúrio como 'função prática da mente'; moderna vê como 'função simbólica da comunicação interna'."
