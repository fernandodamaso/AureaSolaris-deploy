camada_energetica:
  impressao_mental: "A mente de 'como chega até mim?'. Velocidade, curiosidade, diálogo interno. Quando atrito: ansiedade, fofoca, mente acelerada sem direção."
  permeacao_emocional: "Leva a emoção por meio da linguagem. Quando bloqueado: comunicação muda, 'engolir sapos'. Quando solto: humor leve, troca."
  manifestacao_externa: "Eventos prováveis de encontro com irmãos, viagens curtas, notícias, estudos. Trânsitos aceleram ou bloqueiam comunicação."
  como_guiar_o_astral: "Ajudar a mente a escolher a palavra certa: Mercúrio pede clareza, não apenas velocidade. O que é dito molda o que será sentido."

