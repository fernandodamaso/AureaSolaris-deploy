camada_energetica:
  impressao_mental: |
    O Nodo Norte é a direção que a mente ainda não sabe trilhar — puxa para o novo, o desconfortável que faz crescer.
    O Nodo Sul é o pensamento automático, a rota conhecida e confortável (mas estagnada).
  permeacao_emocional: |
    Norte traz inquietação de quem aprende; Sul traz alívio de quem repete.
    O mapa tende a prender a pessoa no Sul por conforto — o trabalho é ir para o Norte.
  manifestacao_externa: |
    Eventos prováveis de 'encontros de destino' e repetições de padrão. Trânsitos sobre os Nodos tendem a abrir a direção de vida.
  como_guiar_o_astral: |
    Ajudar a mente a reconhecer o padrão do Sul (o que já domina) e dar o primeiro passo incômodo para o Norte (o que veio aprender).
    Não é 'destino garantido' — é inclinação de jornada.

nodo_norte:
  significado: "O que a alma veio DESENVOLVER nesta vida. Direção de crescimento, propósito em movimento."
  leitura: "Puxa para o novo. Desconfortável no início, natural com o tempo."
  casas_signos_exemplo: "Ler por signo (qualidade a desenvolver) e casa (área da vida)."

nodo_sul:
  significado: "O que a alma já DOMINA de vidas passadas. Conforto, talento, mas risco de estagnação."
  leitura: "Puxa para o repetido. Fácil, mas prende. É a 'zona de conforto cármica'."
  casas_signos_exemplo: "Ler por signo (domínio trazido) e casa (área onde se repete)."

foco_especial:
  infantil: "Na criança, o Nodo Norte é o desafio de desenvolvimento; o Sul é o talento já presente. Ajuda pais a entenderem 'onde a criança precisa crescer'."
  familiar: "Nodos dos familiares em sinastria mostram onde há complementaridade ou repetição de padrão geracional."
  carmico: "Eixo central da leitura evolutiva/cármica — oferecer a quem ressoa (separar do técnico, Regra 4)."

origens_e_divergencias:
  escola_tradicional:
    autores: [Ptolomeu, Valens]
    conceito: "Cabeça e Cauda do Dragão — pontos de eclipse, usados para timing e eventos."
  escola_evolutiva:
    autores: [J.W. Green, Forrest, Rudhyar]
    conceito: "Eixo de encarnacao: Norte = direcao da alma, Sul = heranca de vidas passadas."
  por_que_da_divergencia: "A tradicional via os Nodos como marcadores de eclipse/timing; a evolutiva os psicologizou como eixo de jornada da alma."
