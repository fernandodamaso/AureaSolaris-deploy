  manifestacao_externa: "Eventos prováveis de gravidez, nutrição, colheita, perda de filho. Trânsitos marcam ciclos de fertilidade."
  como_guiar_o_astral: "Ajudar a mente a reconhecer que nutrir não é controlar: Ceres pede confiança no ciclo de perda e retorno."

