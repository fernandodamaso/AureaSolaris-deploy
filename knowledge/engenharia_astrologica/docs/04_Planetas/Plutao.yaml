camada_energetica:
  impressao_mental: "A mente de 'o que eu não vejo me controla?'. Profundidade, oculto, poder. Quando atrito: obsessão, controle, 'tudo ou nada'."
  permeacao_emocional: "Intensidade extrema. Quando bloqueado: medo de perder controle, crises emocionais. Quando solto: transmutação, paixão transformada."
  manifestacao_externa: "Eventos prováveis de morte simbólica, crise, poder, sexo profundo, cura. Trânsitos marcam mortes e renascimentos."
  como_guiar_o_astral: "Ajudar a mente a encarar o que é oculto sem medo: Plutão pede coragem para morrer antes de renascer. O que foi negado retorna mais forte."

