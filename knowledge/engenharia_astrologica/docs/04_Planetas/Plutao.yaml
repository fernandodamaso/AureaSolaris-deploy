simbolo_grafico:
  glyph: "♇"
  composicao: "Sol (círculo) + Cruz (matéria, morte) + Lua (crescente, emocional, inconsciente)"
  leitura: "O círculo (eu) encontra a cruz (morte/mudança radical) dentro do crescente (inconsciente emocional). O símbolo representa o processo de morte do ego antigo e renascimento transformado."
  origem: "Glifo proposto por Marinus em 1903, aprovado pela IAU como símbolo astronômico de Plutão."

