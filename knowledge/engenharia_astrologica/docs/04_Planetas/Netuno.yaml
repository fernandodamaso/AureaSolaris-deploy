  manifestacao_externa: "Eventos prováveis de inspiração, vício, espiritualidade, arte. Trânsitos trazem névoa ou clareza mística."
  como_guiar_o_astral: "Ajudar a mente a distinguir o que é inspiração do que é ilusão. Netuno pede compaixão, não escapismo."

