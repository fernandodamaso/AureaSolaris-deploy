camada_energetica:
  impressao_mental: "A mente de 'vou atrás'. Impulso, coragem, raiva, desejo de conquistar. Quando atrito: irritação, pressa, agressividade defensiva."
  permeacao_emocional: "Paixão e o fogo do desejo. Quando bloqueado vira frustração acumulada; quando solto demais, queima tudo."
  manifestacao_externa: "Eventos prováveis de ação, conflito, acidentes, sexo, competição. Trânsitos tendem a acelerar ou inflamar situações."
  como_guiar_o_astral: "Canalizar a ação em vez de reprimir. Marte mal dirigido vira explosão; bem dirigido vira iniciativa. Ajudar a mente a 'escolher a batalha'."

