origens_e_divergencias:
  escola_tradicional:
    autores: [Ptolomeu, Bonatti]
    conceito: "O Maléfico Menor, calor e secura, conflito, feridas, ação direta."
  escola_moderna:
    autores: [Liz Greene, Jung]
    conceito: "A assertividade, a libido (vontade de viver), a energia vital de realização."
  por_que_da_divergencia: "De 'maléfico que fere' a 'energia de realização' — a moderna ressignificou Marte como motor saudável da ação."
