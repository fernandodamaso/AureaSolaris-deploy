astronomia_e_regras_de_julgamento:
  astronomia_observacional:
    - "Planeta de ciclo sinó­dico marcante, com estações e retrogradações que podem prolongar uma mesma zona zodiacal."
    - "Seu brilho, velocidade e condição retrógrada devem ser registrados em técnicas de trânsito e retorno."
  criterios_tradicionais:
    - "Como maléfico, sua força destrutiva ou cirúrgica depende de dignidade, casa, recepção, aspectos e sect."
    - "Fora de seita, tende a ser julgado como mais áspero em muitas leituras tradicionais."
  notas_de_motor:
    - "Não reduzir Marte a agressividade psicológica: corte, febre, separação, conflito, cirurgia, coragem e técnica pertencem ao núcleo histórico."
    - "Ao calcular repetições por retrogradação, registrar cada passagem em vez de fundir tudo num único evento."

combinacoes_exemplo:
