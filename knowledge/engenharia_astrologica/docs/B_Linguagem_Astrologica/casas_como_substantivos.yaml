camada_energetica:
  impressao_mental: "As casas são os SUBSTANTIVOS do mapa. Áreas de vida, territórios: 'EU SOU' (Sol em Casa 1) = 'minha identidade é pública'."
  permeacao_emocional: "Cada casa carrega uma área emocional específica."
  manifestacao_externa: "Eventos PROVÁVEIS na área de vida da casa. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a MAPEAR SEU TERRITÓRIO. Casa é onde a vida acontece."

tarot_relacionado:
  carta: "Cada casa corresponde a uma carta (ver atlas da casa)"
  conexao: "As casas são substantivos; os arcanos são ações nesses substantivos."

foco_especial:
  infantil: "A criança aprende as casas como 'onde': 'eu estudo na Casa 3'."
  familiar: "Cada membro da família ocupa casas diferentes."
  carmico_espiritual: "Casas indicam ONDE a alma aprende."

referencias:
  primarias:
    - "Ptolomeu. Tetrabiblos, especialmente o tratamento de lugares e aspectos; consultar tradução/edição declarada."
    - "Lilly, William. Christian Astrology. 1647, livros I–II."
  secundarias:
    - "Houlding, Deborah. The Houses: Temples of the Sky. The Wessex Astrologer, 1996."
    - "Rudhyar, Dane. The Astrology of Personality. Lucis Publishing, 1936; reedições posteriores."
  tecnicas:
