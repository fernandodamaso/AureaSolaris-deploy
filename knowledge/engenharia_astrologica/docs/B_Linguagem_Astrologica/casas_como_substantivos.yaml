origens_e_divergencias:
  tradicional: "As casas organizam lugares, temas e significadores; o vocabulário e o sistema de casas variam entre autores helenísticos, medievais e modernos."
  moderna: "Casas como áreas de desenvolvimento (psicológica/sistêmica)."
  nota: "'Casas como substantivos' é metáfora pedagógica do caderno. Não deve ser atribuída literalmente a Ptolomeu nem apagar divergências entre sistemas de casas."

limites_de_uso:
  - "A casa mostra um campo de manifestação apenas dentro de um sistema de casas declarado e de um mapa com dados de nascimento suficientes."
  - "Uma leitura psicológica, sistêmica ou cármica é uma camada de escola, não o sentido universal de toda casa."

