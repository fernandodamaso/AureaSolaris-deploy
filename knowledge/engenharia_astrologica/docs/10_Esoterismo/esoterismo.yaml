camada_energetica:
  impressao_mental: "O esoterismo é a CAMADA OCULTA da astrologia. Não é 'mágica' — é simbologia profunda."
  permeacao_emocional: "Poder como responsabilidade. Quando saudável: serviço. Quando ferido: manipulação."
  manifestacao_externa: "Eventos prováveis de transformação, proteção, invocação. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a USAR O ESOTERISMO COM ÉTICA. Ocultismo não é controle — é cooperação com o invisível."

aviso_etica: "NÃO é manual de prática. É referência simbólica para o estudante de astrologia."

