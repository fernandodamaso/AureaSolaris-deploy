tipo: "aspecto por longitude eclíptica"
angulo: "0°"
natureza: "união, concentração e mistura de significados"
escopo_documental:
  tecnica_historica:
    - "configuração por signo e por grau"
    - "aplicação e separação"
    - "força relativa conforme natureza dos planetas, condição cósmica e contexto"
  calculo_e_orbes: "O motor deve distinguir conjunção por signo, conjunção partil e conjunção por orbe declarado. Não existe um único orbe universal válido para todos os autores, corpos e técnicas."
  divergencias_de_escola: "Em tradições antigas, a conjunção não é automaticamente benéfica nem maléfica: ela mistura e intensifica os significadores. Em leituras modernas, pode receber linguagem de fusão psíquica; isso deve permanecer como camada interpretativa atribuída."
