camada_energetica:
  impressao_mental: "Dois princípios vizinhos no zodíaco — há atrito sutil de 'passagem' de um para o outro, sem fusão nem oposição."
  permeacao_emocional: "Inquietação leve, a sensação de 'quase lá' ou de mudança iminente de tom."
  manifestacao_externa: "Eventos PROVÁVEIS de pequenas transições. Arquétipos: a Porta de Vaivém, o Limiar. Inclinação, não destino."
  como_guiar_o_astral: "Indicar que há um ajuste de passagem — não force, deixe a transição acontecer."

consenso_tradicional: "Pouco usado na tradição; moderna o vê como 'tensão de limiar'."
arquetipos_simbolicos: ["O Limiar", "A Porta de vaivém"]

aplicativo_separativo: "Aplicativa: a transição SE INICIA (o limiar é cruzado). Separativa: a passagem SE COMPLETA (o tom muda sutilmente)."

exemplo_pratico: "Sol semissextil Mercúrio: a identidade e a fala se tocam de leve — a pessoa ajusta quem é a cada vez que comunica, sem grande conflito."

