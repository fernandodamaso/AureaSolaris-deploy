status: review
id: "semissextil"
nome: "Semissextil"
angulo: "30°"
natureza: "tensão menor (transição, ajuste sutil)"

origens_e_divergencias:
  tradicional: "O semissextil de 30° não é um dos cinco aspectos maiores de Ptolomeu. Em leitura helenística por signo, signos adjacentes estão em aversão, o que não é sinônimo do aspecto moderno por grau."
  moderna: "A leitura de ajuste leve, passagem ou fricção discreta é moderna e varia conforme autor e orbe."
  nota: "Distinguir relação por signo de aspecto por longitude. O motor deve informar qual das duas lógicas está exibindo."
escopo_documental:
  significado: "Aspecto menor por longitude de 30° (1/12 do círculo)."
  porque: "O uso moderno explora uma separação pequena entre fatores; a tradição de aversão usa outra regra, baseada em signos inteiros."
  origem: "A nomenclatura é posterior à classificação ptolomaica de aspectos maiores."
  uso: "Usar apenas em perfil que inclua aspectos menores, com orbe declarado e sem substituir relações por signo."
  divergencia: "Escolas tradicionais podem não considerá-lo; escolas modernas divergem sobre força e interpretação."
referencias:
  - autor: "Cláudio Ptolomeu"
    obra: "Tetrabiblos"
    natureza: "primária histórica"
    localizador: "Livro I; aspectos maiores e configurações, conferir edição."
  - autor: "Vettius Valens"
    obra: "Anthology"
    natureza: "primária histórica"
    localizador: "Relações por signo e aversão; conferir edição."
validacao_de_fontes:
  base: "A ficha não apresenta o semissextil moderno como aspecto canônico helenístico."
  limite: "Não converter um semissextil em diagnóstico, questão médica ou necessidade cármica."
