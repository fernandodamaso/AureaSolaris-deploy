    - "tensão entre significadores em signos opostos"
  calculo_e_orbes: "O motor deve calcular a distância até 180° segundo orbe declarado, distinguindo oposição por signo de oposição partil."
  divergencias_de_escola: "Na tradição, a oposição costuma ser aspecto de enfrentamento e contrariedade. Em leituras modernas, também pode ser descrita como complementaridade psíquica ou projeção."
