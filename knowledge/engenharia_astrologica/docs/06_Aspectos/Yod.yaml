status: review
id: "yod"
nome: "Yod — A 'Mão de Deus'"
formato: "Dois planetas em sextil, ambos em quincúncio (150°) com um terceiro (o 'dedo' / ápice)"

origens_e_divergencias:
  tradicional: "Não há evidência de que a figura Yod (‘Mão de Deus’) seja nomeada na astrologia helenística ou medieval; o quincúncio não integra os aspectos clássicos de Ptolomeu."
  moderna: "Configuração popularizada na astrologia do século XX: dois sextis a um ápice em quincúncio; ‘Mão de Deus’ é rótulo moderno."
  nota: "A leitura cármica é linguagem de escolas modernas, não técnica antiga."

referencias:
  - autor: "Cláudio Ptolomeu"
    obra: "Tetrabiblos"
    natureza: "primária/tradicional"
    localizador: "Livro I, caps. 12–14; aspectos clássicos, não Yod"
  - autor: "Alexandre Volguine"
    obra: "The Yod Book"
    natureza: "moderna/especializada"
    localizador: "estudo moderno da configuração"
  - autor: "Jeffrey Wolf Green"
    obra: "Pluto: The Evolutionary Journey of the Soul"
    natureza: "moderna/evolutiva"
    localizador: "linguagem evolutiva/cármica"

limite_documental: "Quincúncio, orbes e critérios de ápice variam entre autores modernos; tratar como configuração opcional com parâmetros explícitos."
atlas_simbolico:
  pessoas_arquetipos: "O escolhido, o enviado, o mensageiro divino"
  lugares_fisicos: "Templos, locais de destino, montanhas sagradas"
  objetos_materia: "Símbolos sagrados, cartas, mensagens divinas"
  eventos_tipicos: "Missões, encontros de destino, revelações"
  animais: "Águia, falcão, fênix"
  plantas_ervas: "Sálvia, mirra, açafrão"
  metais_pedras: "Ouro, lápis-lazúli, safira"
  cores_sons: "Azul-royal, roxo; notas Lá e Dó"
  numeros: "10 (mão de deus), 7 (espiritualidade), 3 (trindade)"
  dias_semana: "Quinta-feira (Júpiter), domingo (Sol)"
  doencas_corpo: "Sistema nervoso central, cérebro, olhos"
  arquetipos_mitologicos: "Zeus/Júpiter, Apolo, Hermes/Mercúrio"
  mitos_historias: "A mão de Deus; O oráculo de Delfos; Hermes mensageiro"
  sonhos_simbolos_inconsciente: "Mãos divinas, mensagens, destinos"
  expressao_elevada_sombra: "Elevada: missão cumprida, serviço divino | Sombra: sentimento de eleito, fanatismo"

camada_energetica:
  impressao_mental: "Configuração de tensão sem resolução óbvia — a mente é 'cutucada' de ângulos que não se tocam diretamente. Sensação de 'faltando algo'."
  permeacao_emocional: "Inquietação de propósito, como se algo estivesse sendo pedido sem instrução clara."
  manifestacao_externa: "Eventos PROVÁVEIS de 'coincidências que forçam mudança de rota'. Arquétipos: a Mão de Deus, o Mensageiro, o Nó que não desata. Inclinação, não destino."
  como_guiar_o_astral: "Mostrar que o Yod é convite à ENTREGA e ao ajuste contínuo — não à síntese forçada. O ápice é o ponto de 'serviço' da alma."

consenso_tradicional: "Conhecido como 'Mão de Deus' ou 'Dedo do Destino' — indica um chamado ou tarefa de vida que a pessoa não escolhe racionalmente."
arquetipos_simbolicos: ["A Mão de Deus", "O Mensageiro", "O Chamado"]
leitura_carmica: "Quando o ápice toca Nodos ou planetas pessoais, ler como MISSÃO DE JORNADA — oferecer a quem ressoa (cármico)."

