definicao_tecnica: "Dois fatores apresentam declinações de magnitude igual ou muito próxima, mas um está ao norte e outro ao sul do equador celeste."
calculo:
  regra: "Comparar os valores absolutos das declinações e confirmar sinais opostos."
  exemplo: "Se um corpo está em +16°40' e outro em -16°55', a diferença entre as magnitudes é 0°15'; dentro do orbe declarado, há contraparalelo."
  aplicativo: "O vínculo é aplicativo quando a diferença de magnitude diminui enquanto os corpos permanecem em hemisférios opostos."
  separativo: "O vínculo é separativo quando a diferença aumenta após a perfeição."
julgamento_tecnico:
  regra_geral: "Em muitas escolas modernas, o contraparalelo é lido como tensão ou polaridade análoga à oposição."
  nota: "Essa leitura deve ser exibida como analogia interpretativa de escola e não como substituto automático de um aspecto por longitude."
nao_confundir_com:
  - "Oposição zodiacal: 180° em longitude eclíptica."
  - "Paralelo: declinações semelhantes no mesmo hemisfério."
  - "Antíscia e contra-antíscia: simetrias pelo eixo solsticial."
origens_e_divergencias:
  tradicional: "A classificação histórica exata precisa ser consolidada com fontes adicionais."
  moderna: "Uso frequente como aspecto complementar de polaridade por declinação."
  nota: "Se o motor usar contraparalelo, deve declarar a escola, o orbe e o estatuto interpretativo adotados."
camada_energetica:
  impressao_mental: "Há ligação forte por polaridade, mas fora da geometria zodiacal comum."
  permeacao_emocional: "Pode ser vivida como tensão, eco inverso ou complementaridade inquieta."
  manifestacao_externa: "Age como vínculo adicional de polarização e não substitui a leitura dos aspectos principais."
  como_guiar_o_astral: "Usar como refinamento técnico secundário, sem inflar sua importância acima dos aspectos por longitude quando a escola não o exige."
exemplo_pratico: "Lua em contraparalelo com Saturno pode ser lida, em escolas que usam declinação, como reforço de tensão afetiva e contenção; o peso final depende do restante do mapa."
