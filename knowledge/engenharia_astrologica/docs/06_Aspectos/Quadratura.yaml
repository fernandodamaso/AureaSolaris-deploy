aplicativo_separativo:
  aplicativo: "A dificuldade se forma e tende a exigir resposta."
  separativo: "O momento exato de fricção já ocorreu, embora seus efeitos permaneçam."
julgamento_tradicional:
  regra_geral: "A quadratura costuma significar impedimento, esforço, obstáculo, disputa, dano relativo ou necessidade de ação dura."
  nota: "Seu efeito varia conforme beneficência/maleficência dos planetas, recepção, dignidade, casas e pergunta/técnica."
camada_moderna:
  uso_psicologico: "Frequentemente descrita como conflito interno produtivo, pressão de individuação ou área de trabalho psíquico."
  regra_documental: "Essa linguagem é válida como nota moderna, mas o sistema não deve suavizar automaticamente quadraturas técnicas difíceis."
nao_confundir_com:
  - "Semiquadratura e sesquiquadratura: famílias modernas de aspectos, não equivalentes."
  - "Quadrado figurativo em padrões de aspecto: a geometria do padrão não substitui a leitura de cada relação individual."
atlas_simbolico:
  pessoas_arquetipos: "guerreiro, construtor sob pressão, antagonista funcional"
  objetos_materia: "muro, martelo, ferramenta de fricção"
  eventos_tipicos: "crise, esforço, colisão de agendas, construção difícil"
  arquetipos_mitologicos: "prova, combate, tarefa exigente"
camada_energetica:
  impressao_mental: "Os princípios se cruzam de modo pouco confortável e pedem correção de rota."
  permeacao_emocional: "Produz tensão que pode virar força treinada ou reação defensiva."
  manifestacao_externa: "Aparece como pressão concreta, resistência, urgência ou exigência de solução."
  como_guiar_o_astral: "Antes de romantizar a quadratura como crescimento, identificar o tipo de dano, custo ou disciplina que ela realmente pede."
exemplo_pratico: "Mercúrio em quadratura com Lua pode indicar atrito entre raciocínio e afeto, mas a leitura concreta depende do eixo de casas, da recepção e do contexto técnico."
