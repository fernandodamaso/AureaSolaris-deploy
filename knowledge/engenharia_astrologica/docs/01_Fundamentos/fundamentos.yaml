    - "Hermes (comunicação)"
    - "Atena (sabedoria)"
  mitos_historias: "Hermes e a escrita; Atena e a organização"
  expressao_elevada_sombra: "Elevada: estrutura viva que serve | Sombra: rigidez, burocracia"

camada_energetica:
  impressao_mental: "Os fundamentos são a BASE. Sem base, a casa desaba."
  permeacao_emocional: "Aprendizado como segurança. Quando saudável: curiosidade. Quando ferido: medo de errar."
  manifestacao_externa: "Eventos prováveis de estudos, aprendizados. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a APRENDER SEM MEDO. Fundamentos não são regras — são ferramentas."

foco_especial:
  infantil: "Nota pedagógica: o estudo inicial deve alternar observação do céu, vocabulário, cálculo simples e leitura de fontes."
  familiar: "Não é significador familiar natal. Relações familiares exigem casas e significadores da técnica escolhida."
  carmico_espiritual: "Nota de estudo: fundamentos são pré-requisitos; não existe uma 'Casa Fundamentos' canônica no mapa natal."

estrutura_de_estudo:
  significado: "Aprender a distinguir coordenada astronômica, regra de escola, interpretação e símbolo."
  porque: "A ordem evita que uma associação memorável substitua cálculo, fonte ou contexto."
  origem: "O vocabulário de base vem de camadas históricas diferentes; a ficha encaminha cada uma à sua tradição."
  uso: "Antes de aplicar técnica, confirmar dados, zodíaco, casas, pontos, orbes e fontes."
  divergencia: "Divergências devem ser registradas como opções de método, nunca escondidas sob termos genéricos."

referencias:
