origens_e_divergencias:
  tradicional: "Fundamentos ocidentais incluem esfera local, zodíaco, planetas, casas, aspectos, seita e dignidades, mas sua definição e prioridade variam entre helenismo, medievo, Renascimento e horária."
  moderna: "Escolas psicológicas, humanistas e evolutivas acrescentam linguagens de arquétipo, desenvolvimento e propósito; elas precisam permanecer atribuídas."
  nota: "A seção organiza pré-requisitos de estudo. Não unifica sistemas contraditórios nem exclui notas históricas, etimológicas, míticas e simbólicas quando estiverem identificadas."

atlas_simbolico:
  pessoas_arquetipos: "O estudante, o iniciante, o buscador de base"
  lugares_fisicos: "Escolas, bibliotecas, salas de aula"
  objetos_materia: "Livros, cadernos, mapas, lápis"
  eventos_tipicos: "Estudos, aprendizados, descobertas"
  animais: "Coruja (sabedoria), formiga (organização)"
  plantas_ervas: "Sálvia (memória), hera (permanência)"
  metais_pedras: "Prata (lua), cristal de rocha (clareza)"
  cores_sons:
    cores: ["Azul-claro", "prata", "verde-oliva"]
    sons: ["Dó", "lá", "vento"]
  numeros: [1, 3, 6]
  dias_semana: ["Quarta-feira"]
  doencas_corpo:
    doencas: ["Problemas nervosos", "olhos"]
    partes_corpo: ["Olhos", "cérebro"]
