camada_energetica:
  impressao_mental: "Cada lote é um PONTO MATEMÁTICO com SENTIDO. 'O que esta fórmula calcula?'."
  permeacao_emocional: "Sorte ligada a cálculo. Quando saudável: sorte como dom. Quando ferido: sorte como capricho."
  manifestacao_externa: "Eventos prováveis de ganho, sorte, prosperidade. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a ENTENDER A FÓRMULA. Lote não é mágica — é matemática simbólica."

foco_especial:
  infantil: "A criança lotes aprende matemática como linguagem simbólica."
  familiar: "O membro que traz sorte ou recursos."
  carmico_espiritual: "Lotes indicam os PONTOS FORTES da jornada."

