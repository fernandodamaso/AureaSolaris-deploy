tipo: "Aprofundamento"
subtema: "Partes arábicas com sentido do cálculo"

origens_e_divergencias:
  tradicional: "Lotes (klêroi) são pontos calculados presentes na astrologia helenística e desenvolvidos em transmissões árabe-medievais; fórmula, inversão diurna/noturna e sentido variam por fonte."
  moderna: "Linguagem psicológica ou evolutiva posterior deve ser atribuída e não substitui a doutrina histórica dos lotes."
  nota: "Registrar a fórmula, a regra de sect, zodíaco, casas e regência. A Parte da Fortuna e a Parte do Espírito são centrais, mas não autorizam atribuir fórmulas tardias a Valens ou Ptolomeu sem fonte."

