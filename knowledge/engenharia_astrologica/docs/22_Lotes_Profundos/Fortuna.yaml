camada_energetica:
  impressao_mental: "Para onde a atenção volta para se sentir 'realizado no mundo material'."
  permeacao_emocional: "Bem-estar ligado a ter o que é seu e circular com segurança."
  manifestacao_externa: "Eventos prováveis de ganho, saúde, circulação. Arquétipos: a Cornucópia, o Corpo que prospera. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a encontrar onde ela 'prospera' de fato — corpo e recursos, não apenas dinheiro."

como_usar: "Ler o signo (QUALIDADE do que nutre), a casa (ONDE na vida) e o regente (COMO se acessa). Quando ativada por trânsito, é janela de favorecimento material/saúde."
regente: "Regente do signo onde cai; lido por casa e aspectos."

