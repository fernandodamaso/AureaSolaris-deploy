status: review
id: "lote_fortuna"
nome: "Parte da Fortuna"
tradicoes:
  - "helenistica"
  - "arabe-medieval"
formula_diurna: "Asc + Lua − Sol"
formula_noturna: "Asc + Sol − Lua"
tema: "Corpo, sorte material, o que nutre"

sentido_do_calculo: |
  O lote transfere ao Ascendente o arco entre os luminares. Na fórmula com inversão
  por sect, Fortuna é Asc + Lua − Sol em carta diurna e Asc + Sol − Lua em carta
  noturna; Espírito usa o arco complementar. Esse é um procedimento técnico,
  não uma prova de que Lua, Sol ou Ascendente descrevam uma única psicologia.
  Algumas práticas modernas usam uma fórmula fixa; o motor deve oferecer a regra
  escolhida e exibir a diferença, sem tratá-las como idênticas.

origens_e_divergencias:
  tradicional: "Valens associa Fortuna a corpo, circunstância e matéria de vida em sua própria doutrina; o peso exato depende da técnica e do autor."
  moderna: "Extensões a dinheiro, saúde, vocação ou linguagem psicológica devem indicar a escola; não são sinônimos automáticos de Fortuna."
  nota: "Interpretar signo, casa, regente, aspectos e ativação dentro de uma técnica declarada; não inferir ganho ou enfermidade por um único lote."

