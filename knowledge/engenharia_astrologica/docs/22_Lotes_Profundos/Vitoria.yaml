camada_energetica:
  impressao_mental: "Onde a mente busca ser bem-sucedida e reconhecida."
  permeacao_emocional: "Esperança de 'dar certo' e o risco de inflação se desmedida."
  manifestacao_externa: "Eventos prováveis de reconhecimento e expansão. Arquétipos: a Coroa, a Laurel. Inclinação, não destino."
  como_guiar_o_astral: "Orientar a pessoa a buscar vitória com mérito, não só sorte."

como_usar: "Ler como 'ponto de sucesso'. Aliar a Júpiter bem dignificado = vitórias naturais; a maléfico = vitória por esforço."
regente: "Regente do signo onde cai; lido por casa e aspectos."

