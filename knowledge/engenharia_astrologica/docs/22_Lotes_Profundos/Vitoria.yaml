status: review
id: "lote_vitoria"
nome: "Parte da Vitória"
tradicoes:
  - "helenistica"
  - "arabe-medieval"
formula_diurna: "Asc + Júpiter − Espírito"
formula_noturna: "Asc + Espírito − Júpiter"
tema: "Sucesso, reconhecimento, triunfo"

sentido_do_calculo: |
  Júpiter (expansão) menos Espírito (direção) = onde a expansão se alinha com o propósito.
  O ponto do TRIUNFO: onde a pessoa 'vence' quando segue sua direção.

origens_e_divergencias:
  tradicional: "Vitória é um lote planetário de Paulus, associado a Júpiter e calculado a partir de Espírito com reversão por sect."
  moderna: "Sucesso psicológico ou reconhecimento são extensões interpretativas e não resultado garantido."
  nota: "Avaliar regente, lugar e contexto; não prometer vitória, prestígio ou resultado material."

referencias:
