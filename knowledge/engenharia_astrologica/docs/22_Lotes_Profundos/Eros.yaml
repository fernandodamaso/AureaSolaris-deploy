status: review
id: "lote_eros"
nome: "Parte de Eros"
tradicoes:
  - "helenistica"
  - "arabe-medieval"
formula_diurna: "Asc + Vênus − Espírito"
formula_noturna: "Asc + Espírito − Vênus"
tema: "Desejo, amor, atração"

sentido_do_calculo: |
  Vênus é o DESEJO/atração; o Espírito é a direção intencional.
  A fórmula mede a distância entre 'o que atrai' e 'para onde a pessoa vai' — ou seja, onde o desejo se encaixa (ou não) na jornada.
  DIURNO: Asc+Vênus−Espírito (o desejo guia a partir da intenção). NOTURNO: Asc+Espírito−Vênus (a intenção busca o desejo).

origens_e_divergencias:
  tradicional: "Eros aparece em diferentes tradições helenísticas com fórmulas não idênticas; a ficha usa a variante planetária de Paulus, vinculada a Vênus e Espírito."
  moderna: "Leituras de romance, desejo ou 'contrato de alma' precisam declarar autoria e não são equivalentes universais de Eros."
  nota: "Exibir fonte da fórmula; não extrapolar o lote para outra pessoa ou resultado relacional literal."

