status: review
id: "lote_coragem"
nome: "Parte da Coragem"
tradicoes:
  - "helenistica"
  - "arabe-medieval"
formula_diurna: "Asc + Marte − Fortuna"
formula_noturna: "Asc + Fortuna − Marte"
tema: "Ousadia, ação, enfrentamento"

sentido_do_calculo: |
  Marte é a AÇÃO/impulso; Fortuna é o que nutre.
  A fórmula mede onde a ação se apoia no que nutre (ou where age à custa do que nutre). É o ponto do ENFRENTAMENTO.

origens_e_divergencias:
  tradicional: "Coragem é um dos lotes planetários de Paulus, associado a Marte; a fórmula usa Fortuna e Marte com reversão por sect."
  moderna: "Leituras de bravura, trauma ou autoafirmação são extensões modernas e não substituem a técnica."
  nota: "Registrar fórmula, sect, fonte e regente. Não tratar o lote como prova de conduta ou destino."

referencias:
