camada_energetica:
  impressao_mental: "De onde a mente tira impulso de enfrentar."
  permeacao_emocional: "Coragem como energia de 'vou' — ou bravata defensiva se desequilibrada."
  manifestacao_externa: "Eventos prováveis de iniciativa ousada. Arquétipos: o Escudo, a Espada. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a usar a Coragem sem confundir com imprudência."

como_usar: "Ler onde a pessoa 'se arma'. Trânsito aqui = janela de audácia (ou de atrito se maléfico)."
regente: "Regente do signo onde cai; lido por casa e aspectos."

