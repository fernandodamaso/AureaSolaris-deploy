status: review
id: "lote_espirito"
nome: "Parte do Espírito"
tradicoes:
  - "helenistica"
  - "arabe-medieval"
formula_diurna: "Asc + Sol − Lua"
formula_noturna: "Asc + Lua − Sol"
tema: "Alma, intenção, o que move por dentro"

sentido_do_calculo: |
  Espírito usa o arco complementar ao da Fortuna: Asc + Sol − Lua em carta diurna
  e Asc + Lua − Sol em carta noturna na fórmula sectária. Em autores helenísticos,
  ele participa de juízos sobre ação, escolha e direção de vida, com aplicações
  que variam. 'Alma', vocação ou espiritualidade são traduções interpretativas,
  não equivalentes universais do termo técnico.

origens_e_divergencias:
  tradicional: "Valens e Paulus tratam Espírito em uma doutrina de lotes e cronocratores; a ficha não o reduz a misticismo nem o isola do mapa."
  moderna: "Leituras de propósito e desenvolvimento podem ser estudadas como extensões modernas, com autoria declarada."
  nota: "Comparar com Fortuna por fórmula, casa, regente e técnica; não atribuir automaticamente evento, pessoa ou 'contrato espiritual'."

