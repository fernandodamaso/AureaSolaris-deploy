camada_energetica:
  impressao_mental: "De onde vem a direção intencional da pessoa — o 'porquê' que a move."
  permeacao_emocional: "Sentido e propósito. Quando bloqueado, sensação de vazio de direção."
  manifestacao_externa: "Eventos prováveis ligados a vocação e expressão da alma. Arquétipos: a Tocha, o Norte interno. Inclinação, não destino."
  como_guiar_o_astral: "Orientar a pessoa a alinhar ação (Fortuna) e intenção (Espírito)."

como_usar: "Ler como 'bússola de propósito'. Onde cai, é o terreno da vocação e do sentido. Contrastar com a Fortuna: o que nutre (corpo) vs o que move (alma)."
regente: "Regente do signo onde cai; lido por casa e aspectos."

