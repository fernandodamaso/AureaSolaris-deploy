status: review
id: "lote_necessidade"
nome: "Parte da Necessidade"
tradicoes:
  - "helenistica"
  - "arabe-medieval"
formula_diurna: "Asc + Fortuna − Mercúrio (Paulus Alexandrinus)"
formula_noturna: "Asc + Mercúrio − Fortuna (Paulus Alexandrinus)"
tema: "Necessidade: lote hermético associado a Hermes/Mercúrio em uma variante de Paulus"

sentido_do_calculo: |
  Na variante de Paulus, conta-se de Mercúrio até Fortuna em carta diurna e o
  inverso em carta noturna, projetando o arco no Ascendente. Outras tradições
  preservam fórmulas e sentidos distintos para Necessidade; o nome não autoriza
  reduzi-la a carência psicológica ou necessidade básica.

origens_e_divergencias:
  tradicional: "Paulus inclui Necessidade entre os lotes planetários; testemunhos helenísticos também mostram diferenças de fórmula e de significação."
  moderna: "Leituras de carência, dependência ou desenvolvimento pessoal são extensões modernas e não equivalem ao uso antigo."
  nota: "O motor deve exigir a fonte da fórmula — ao menos Paulus, Valens/Firmicus ou uma transmissão medieval identificada — e nunca apresentar uma versão como universal."

