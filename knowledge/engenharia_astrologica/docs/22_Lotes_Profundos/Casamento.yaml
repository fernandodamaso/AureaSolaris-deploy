camada_energetica:
  impressao_mental: "Onde a mente busca 'o outro' para se comprometer."
  permeacao_emocional: "Vínculo e o medo de perder liberdade (Saturno na fórmula)."
  manifestacao_externa: "Eventos prováveis de união/contrato. Arquétipos: os Anéis, a Aliança. Inclinação, não destino."
  como_guiar_o_astral: "Ler junto com Casa 7 e Vênus — a Parte mostra o 'ponto sensível' da união."

como_usar: "Ler signo/casa/regente para o 'ponto de compromisso'. Em sinastria: onde a Parte de Casamento de um cai no mapa do outro indica atração de compromisso."
foco_especial:
  familiar: "Em sinastria, onde a Parte de Casamento de um cai no mapa do outro indica atração de compromisso."
regente: "Regente do signo onde cai; lido por casa e aspectos."

