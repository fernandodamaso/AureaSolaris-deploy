status: draft
id: "lote_filhos"
nome: "Parte dos Filhos"
tradicoes:
  - "helenistica"
  - "arabe-medieval"
formula_diurna: "Asc + Júpiter − Saturno"
formula_noturna: "Asc + Saturno − Júpiter"
tema: "Geração, progênie, criação (obras, filhos, o que se 'gera')"

sentido_do_calculo: |
  Júpiter é a EXPANSÃO (crescimento, dar à luz) e Saturno é o LIMITE (forma, contenção).
  A fórmula mede a distância entre 'expandir' e 'limitar' a partir do Ascendente: é o ponto onde a pessoa consegue GERAR algo que continue depois dela.
  Diurno: Asc+Júpiter−Saturno (a criação segue a expansão). Noturno: inverso (a criação exige conter/limitarr primeiro).

origens_e_divergencias:
  tradicional: "Helenística (Ptolomeu, Vettius Valens) — lotes como pontos matemáticos."
  moderna: "Evolutiva/moderna (Steven Forrest, Jeffrey Green) — lotes como 'pontos sensíveis da jornada'."
  nota: "Revisar ao citar — marca a escola usada."
atlas_simbolico:
  pessoas_arquetipos: "A criança, o criador, o filho"
  lugares_fisicos: "Jardins de infância, teatros, lugares de diversão"
  objetos_materia: "Brinquedos, obras de arte, jóias"
  eventos_tipicos: "Nascimentos, criações, festas, jogos"
  animais: "Leão, pavão, cavalo nobre"
  plantas_ervas: "Girassol, heliotropo, rosa, laranjeira"
  metais_pedras: "Ouro, âmbar, topázio, citrino"
  cores_sons: "Amarelo-dourado, laranja; notas Dó e Sol"
  numeros: "1 (criação), 5 (expressão), 9 (completude)"
  dias_semana: "Domingo (Sol)"
  doencas_corpo: "Coração, costas, coluna dorsal"
  arquetipos_mitologicos: "Apolo, Dioniso, Eros/Cupido"
  mitos_historias: "Apolo e a música; Dioniso e o teatro; Eros e Psique"
  sonhos_simbolos_inconsciente: "Crianças, festas, jogos, arte, corações"
  expressao_elevada_sombra: "Elevada: criatividade radiante, amor generoso | Sombra: drama, excesso, necessidade de atenção"

camada_energetica:
  impressao_mental: "Onde a mente deseja criar 'algo que continue' — a necessidade de legado e de gerar vida/forma."
  permeacao_emocional: "Alegria de gerar e o medo de não conseguir; orgulho de 'ver parte de si em outro'."
  manifestacao_externa: "Eventos prováveis de criação (filhos, obras, projetos que 'saem'). Arquétipos: a Genitora, a Semente, a Obra. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a reconhecer onde está seu impulso de criar — e que 'filhos' no mapa também são obras, arte, negócios, ideias encarnadas."

como_usar: |
  O ponto sensível da CRIAÇÃO se lê por:
  - SIGNO: a QUALIDADE do que se gera (ex.: em Touro = criar algo tangível; em Peixes = criar algo invisível/inspirador).
  - CASA: a ÁREA de vida onde a pessoa 'gera' (ex.: Casa 5 = filhos literais e expressão; Casa 10 = obras públicas; Casa 3 = criações de comunicação).
  - REGENTE + ASPECTOS: como a criação se manifesta e se apoia (benéfico = facilidade; maléfico = desafio/atraso que amadurece).
  - TRÂNSITOS: janelas de fertilidade criativa (literal ou simbólica).
  Na ASTROLOGIA INFANTIL: a Parte dos Filhos nos PAIS indica onde a energia de 'gerar' se concentra — útil para entender o desejo (ou medo) de maternidade/paternidade e o estilo de criação.

foco_especial:
  infantil: "No mapa da CRIANÇA, a Parte dos Filhos mostra como ela própria 'gera' (brincadeiras, ideias, cuidado de bichos) — não só no futuro, mas no modo infantil de criar."
  familiar: "Cruzar a Parte dos Filhos dos pais com o mapa do filho mostra onde a dinâmica de 'gerar/cuidar' se toca."
regente: "Regente do signo onde cai; lido por casa e aspectos."

