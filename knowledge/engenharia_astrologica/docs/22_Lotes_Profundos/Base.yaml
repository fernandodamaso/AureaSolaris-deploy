camada_energetica:
  impressao_mental: "Onde a mente carrega o 'peso herdado' — o que limita e, se trabalhado, sustenta."
  permeacao_emocional: "Senso de dever/culpa ou de base sólida, conforme a dignidade."
  manifestacao_externa: "Eventos prováveis de responsabilidade e limite. Arquétipos: o Alicerce, a Pedra. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a transformar a Base em alicerce, não em carga."

como_usar: "Ler o lugar, seu regente e a relação com Fortuna/Espírito dentro da técnica escolhida. Não usar como diagnóstico de herança, culpa ou punição."
foco_especial:
  carmico: "Leituras cármicas são extensões modernas opcionais e precisam de fonte própria; não pertencem à definição técnica de Base."
regente: "Regente do signo onde cai; lido por casa e aspectos."

