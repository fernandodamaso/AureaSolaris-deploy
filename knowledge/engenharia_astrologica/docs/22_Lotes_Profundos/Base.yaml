status: review
id: "lote_base"
nome: "Parte da Base / Nemesis"
tradicoes:
  - "helenistica"
  - "arabe-medieval"
formula_diurna: "Asc + Espírito − Fortuna, pelo arco menor entre os dois lotes"
formula_noturna: "Asc + Fortuna − Espírito, pelo arco menor entre os dois lotes"
tema: "Fundação / base: relação técnica entre Fortuna e Espírito"

sentido_do_calculo: |
  Em Valens, a Base é calculada do arco entre Fortuna e Daimon/Espírito, contado a
  partir do Ascendente; a direção se inverte por sect e usa-se o arco menor. Não é
  um lote de Saturno, Nemesis ou "karma familiar". Esses temas pertencem a outros
  lotes ou a leituras modernas e não devem ser fundidos silenciosamente.

origens_e_divergencias:
  tradicional: "Valens apresenta Base em relação com Fortuna e Daimon e orienta examinar o lugar e seu regente."
  moderna: "Extensões a ancestralidade, peso, trauma ou karma devem ser atribuídas a autor/escola e não substituem o procedimento antigo."
  nota: "Conservar o nome Base/Fundação; não a renomear Nemesis. O motor precisa registrar a regra do arco menor e a convenção de sect."

