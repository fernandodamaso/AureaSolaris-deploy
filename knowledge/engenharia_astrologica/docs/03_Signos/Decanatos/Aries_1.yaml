status: draft
id: "decanato_aries_1"
nome: "Decanato 1 de Áries (0°–10°) — Áries puro"
tradicoes:
  - "convenção por signos da mesma triplicidade"
  - "camada simbólica moderna atribuída"
regente: "Marte (Áries/Marte na convenção por triplicidade; também Marte na face caldaica correspondente)"

origens_e_divergencias:
  sistema_adotado: "Convenção posterior/moderna por signos da mesma triplicidade: 0°–<10° de Áries recebe a cor de Áries/Marte."
  faces_caldaicas: "A face caldaica de 0°–<10° de Áries também é regida por Marte, embora a justificativa histórica seja diferente."
  decanos_egipcios: "Sistema distinto; não inferir equivalência sem tabela específica."
  nota: "A coincidência de Marte entre duas tabelas não autoriza chamá-las de uma só tradição."

calculo_e_escopo:
  intervalo: "Áries tropical 0°–<10°; 10° exatos iniciam o segundo decanato."
  uso: "Refinamento opcional após signo, planeta, casa e técnica principal."
  camada_simbolica: "Atlas, mitos e Ponto Gama são notas atribuídas de estudo, não efeitos automáticos do grau."
referencias:
  - autor: "Engenharia Astrológica"
    obra: "Decanatos"
    natureza: "fonte editorial"
    localizador: "Tabela de sistemas e limites em 03_Signos/Decanatos.yaml."
  - autor: "Cláudio Ptolomeu"
    obra: "Tetrabiblos"
    natureza: "primária histórica"
    localizador: "Faces e divisões zodiacais; consultar edição para a tabela caldaica, que não prova a convenção por triplicidade."
  - autor: "Abu Ma'shar al-Balkhi"
    obra: "The Abbreviation of the Introduction to Astrology (ed. Burnett, Yamamoto e Yano)"
    natureza: "primária medieval traduzida"
    localizador: "Livro I, faces/decanos; fonte histórica de comparação para Marte em 0°–10° de Áries."
  - autor: "Austin Coppock"
    obra: "36 Faces: The History, Astrology and Magic of the Decans"
    natureza: "moderna contemporânea"
    localizador: "Entrada do primeiro decanato de Áries; imagens modernas devem ser lidas como camada própria, não como prova da convenção elemental."
limite_documental: "Permanece draft: falta fonte primária ou obra moderna específica que fundamente esta convenção por triplicidade como tabela independente."
status_reason: "Draft mantido: Marte é coincidência entre a face caldaica e a convenção elemental, mas as linhagens e imagens não são idênticas."
