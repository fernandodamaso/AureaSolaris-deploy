camada_energetica:
  impressao_mental: "Áries sem filtro — iniciativa pura, impulso, 'eu sou o começo'."
  permeacao_emocional: "Entusiasmo cru, às vezes impulsividade sem camada."
  manifestacao_externa: "Eventos PROVÁVEIS de início, ação direta, pioneirismo. Arquétipos: o Batedor, o Gênese. Inclinação, não destino."
  como_guiar_o_astral: "Mostrar que é a 'energia de partida' — canalizar para começar, não para atropelar."

porque_simbolico: "0° de Áries (Ponto Gama) é o equinócio de primavera (hemisfério norte) — a luz supera a escuridão, a natureza 'acorda'. O decanato 1 captura esse despertar primordial."
foco_especial:
  infantil: "Criança com Sol/Marte/ASC em 1º decanato de Áries: impulso de 'fazer primeiro', precisa de canalização física."


