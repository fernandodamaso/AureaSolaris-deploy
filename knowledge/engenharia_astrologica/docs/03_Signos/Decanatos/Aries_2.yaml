status: draft
id: "decanato_aries_2"
nome: "Decanato 2 de Áries (10°–20°) — Áries matizado por Leão"
tradicoes:
  - "convenção por signos da mesma triplicidade"
  - "camada simbólica moderna atribuída"
regente: "Sol (Leão/Sol na convenção por triplicidade; também Sol na face caldaica correspondente)"

origens_e_divergencias:
  sistema_adotado: "Convenção posterior/moderna por signos da mesma triplicidade: 10°–<20° de Áries recebe a cor de Leão/Sol."
  faces_caldaicas: "A face caldaica de 10°–<20° de Áries também é do Sol, por ordem caldaica e não por triplicidade."
  decanos_egipcios: "Sistema distinto; não inferir equivalência sem tabela específica."
  nota: "A coincidência de Sol não transforma a convenção por triplicidade em fonte helenística única."

calculo_e_escopo:
  intervalo: "Áries tropical 10°–<20°; 20° exatos iniciam o terceiro decanato."
  uso: "Refinamento opcional; não equivale a uma dignidade essencial."
  camada_simbolica: "Imagens de brilho, heroísmo e performance são associações interpretativas da convenção adotada."
