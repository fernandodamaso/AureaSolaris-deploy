porque_simbolico: "Leão matiza Áries com Fogo fixo: a iniciativa (Áries) ganha ESTABILIDADE de identidade (Leão). O Sol é 'eu quero brilhar' — por isso este decanato tende a querer liderar de forma magnética."
foco_especial:
  infantil: "Criança aqui tende a ser 'a protagonista' — canalizar com arte/performance evita a frustração de não ser vista."


