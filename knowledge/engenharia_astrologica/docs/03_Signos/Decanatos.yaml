validacao_de_fontes:
  base: "A ficha-base está em review por documentar os sistemas e seus limites. As fichas individuais permanecem draft até que sua tabela e fonte sejam conferidas separadamente."
  limite: "Não usar a palavra 'tradicional' para uma tabela híbrida de regentes modernos, nem apresentar simbologia de triplicidade como tabela caldaica ou egípcia."
