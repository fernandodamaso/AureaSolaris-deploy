elemento: "Fogo"
modalidade: "Mutável"
regente: "Júpiter"

origens_e_divergencias:
  tradicional: "Júpiter (expansão, fé, filosofia, viagens longas)."
  moderna: "Júpiter (mesmo). Sem divergência significativa."
  nota: "Regência unânime."

essencia:
  - "Sentido"
  - "Expansão"
  - "Liberdade"

simbologia_elemento:
  elemento: "Fogo"
  modalidade: "Mutável"
  simbolo: "Seta / Fogo que se espalha pelo vento"
  analogia: "Fogo Mutável — como uma flecha que voa longe ou fogo de palha que se espalha."
  porque: "Fogo Mutável é o fogo em EXPANSÃO: busca, viagem, filosofia. Sagitário é o nono signo, onde a energia se expande em direção ao horizonte. A seta representa a direção do fogo — não fica parado, tem destino."
atlas_simbolico:
  pessoas_arquetipos: "Filósofo, viajante, professor, aventureiro, cavaleiro, missionário"
  lugares_fisicos: "Montanhas, estradas, universidades, templos, países distantes, fronteiras"
  objetos_materia: "Livros de filosofia, mapas, flechas, selas, malas de viagem, títulos"
  eventos_tipicos: "Viagens longas, formaturas, publicações, aventuras, descobertas"
  animais: "Cavalo, centauro, águia, cão de caça, camelo, falcão"
  plantas_ervas: "Nogueira, oliveira, cedro, sálvia, mirra, açafrão"
  metais_pedras: "Estanho, turquesa, topázio azul, safira, lápis-lazúli"
  cores_sons: "Azul-royal, roxo, índigo; notas Dó e Lá; trombeta, címbalo"
  numeros: "3 (trindade filosófica), 7 (espiritualidade), 9 (completude)"
  dias_semana: "Quinta-feira (dia de Júpiter)"
  doencas_corpo: "Quadris, coxas, fígado, sistema nervoso central, excesso, inflamação crônica"
  arquetipos_mitologicos: "Zeus/Júpiter, Héracles/Hércules, Quirón, Atena"
  mitos_historias: "Os Argonautas; Quirón e a educação de Hércules; A busca do Cálice Sagrado"
  sonhos_simbolos_inconsciente: "Montanhas, viagens, livros, setas, festas, templos"
  expressao_elevada_sombra: "Elevada: sabedoria generosa, viagem como busca, fé que liberta | Sombra: fanatismo, exagero, arrogância filosófica, superficialidade"

tarot:
  carta: "O Sol"
  explicacao: "Carta 19 — clareza, expansão, sucesso, iluminação. Sagitário é o Sol porque ambos representam a luz que expande sem esconder: viagem, filosofia, o cavaleiro que chega à montanha dourada."

camada_energetica:
  impressao_mental: "A mente que busca o horizonte e a verdade. Otimismo, fé, 'mais'. Quando atrito: exagero, dogmatismo, promessa vazia."
  permeacao_emocional: "Esperança e alívio de se sentir parte de algo maior. Evita o apequenamento."
  manifestacao_externa: "Eventos prováveis de viagens, estudos, encontros com o estrangeiro, expansão. Trânsitos ampliam o mundo."
  como_guiar_o_astral: "Ajudar a pessoa a ancorar a fé no real. Sagitário guia bem quando inspira sem fugir."

decanatos:
  - "0-10: Sagitário (Júpiter) — fé e expansão"
  - "10-20: Áries (Marte) — iniciativa e coragem"
  - "20-30: Leão (Sol) — brilho e liderança"

foco_especial:
  infantil: "A criança Sagitário precisa de sentido e aventura. Pergunta 'por quê?' sem parar."
  familiar: "O membro que traz crenças e horizontes novos para o lar. Otimismo familiar, às vezes disperso."

