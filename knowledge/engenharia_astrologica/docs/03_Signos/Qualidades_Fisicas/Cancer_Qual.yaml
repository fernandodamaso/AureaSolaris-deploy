status: review
id: cancer_qualidades
nome: Câncer — Qualidades Físicas
cor: Prata, branco-perolado, azul-pálido, cinza-prateado
tradicoes: [tradicional, médica histórica, moderna, editorial]
parte_do_corpo: Peito, mamas e estômago; útero e "líquidos" são ampliações lunares que variam entre autores
elemento_fisico: Água (frio, úmido)
qualidade_termica: Fria e úmida
origens_e_divergencias:
  tradicional: "A melothesia associa Câncer ao peito e ao estômago; prata e branco derivam da cadeia de correspondências da Lua, sua regente."
  moderna: "Nutrição, vínculo e receptividade são leituras psicológicas posteriores. Útero, fluidos e sistema digestivo ampliado devem ser marcados como analogias lunares, não consenso anatômico."
  nota: "A ficha registra uma tradição simbólica; não define corpo, gênero, maternidade nem condição clínica."
atlas_simbolico:
  pessoas_arquetipos: Mãe, cuidador, criança, família, dona de casa, protetor do lar
  lugares_fisicos: Lares, rios, lagos, praias, cavernas, lugares próximos à água
  objetos_materia: Panelas, fotografias, álbuns, cobertores, baús, conchas
  eventos_tipicos: Casamentos, nascimentos, mudanças de lar, reuniões familiares, memórias
  animais: Caranguejo, lagosta, marisco, cisne, golfinho, cão de água
  plantas_ervas: Lírio, jasmim, rosa branca, melão, pepino, lótus
  metais_pedras: Prata, pérola, pedra da lua, cristal, madrepérola
  cores_sons: Branco, prata, azul-claro; notas Dó e Lá; harpa, sino d'água
  numeros: 2 (dualidade mãe-filho), 4 (lar/segurança), 6 (nutrição)
  dias_semana: Segunda-feira (dia da Lua)
  doencas_corpo: "Na medicina astrológica histórica: peito, mamas e estômago. Extensões a útero e fluidos variam por autor. Não usar para diagnóstico."
  arquetipos_mitologicos: Hera/Juno, Deméter/Ceres (mãe), Hécate, Perséfone
  mitos_historias: O caranguejo na luta de Hércules contra a Hidra; Deméter e Perséfone
  sonhos_simbolos_inconsciente: Água parada, casas, mãe, bebês, prata, lua cheia
  expressao_elevada_sombra: 'Elevada: cuidado compassivo, memória afetiva, lar como refúgio | Sombra: apego excessivo, dependência emocional, vitimização'
camada_energetica:
  impressao_mental: A cor prata no mapa = 'reflexo emocional'.
  permeacao_emocional: Sensibilidade, 'maré interna', necessidade de ninho.
  manifestacao_externa: "O Ninho é um arquétipo de estudo; olhos, traços, estilo, gênero e forma corporal não se deduzem de Câncer isoladamente."
  como_guiar_o_astral: "Usar prata, receptividade e nutrição para compreender a cadeia lunar, sem promessa de proteção material ou terapêutica."
porque_simbolico: 'Câncer = ESTÔMAGO/MAMAS/ÚTERO — órgãos da NUTRIÇÃO e do NINHO. O estômago ''recebe'' (assim como a Lua recebe a luz do Sol).

  PRATA = metal da LUA (regente de Câncer). Branco = cor do ''receptáculo'' puro.

  '
leitura_corporal:
  regra: "Câncer corresponde ao peito e ao estômago na sequência anatômica tradicional."
  uso: "Camada histórica e simbólica; julgamentos antigos dependiam do conjunto do mapa e da técnica empregada."
aparencia_nas_tradicoes:
  descricao: "A literatura astrológica descreve tipo lunar/canceriano com face arredondada, olhos úmidos ou expressivos, pele clara e formas suaves."
  porque: "A analogia vem da Lua, de sua luz refletida e das imagens de receptividade, umidade e nutrição."
  variantes: "A tradição julga Lua, Ascendente e regente; manuais populares modernos frequentemente simplificam para o signo solar."
  limite: "Manter como crença fisionômica historicamente situada, sem inferir maternidade, gênero ou condição clínica."
referencias:
  - {autor: "Claudius Ptolemy", obra: "Tetrabiblos", natureza: "primária histórica", localizador: "Livro I; signos, Lua e membros do corpo."}
  - {autor: "Nicholas Culpeper", obra: "Astrological Judgement of Diseases from the Decumbiture of the Sick", natureza: "primária histórica", localizador: "Correspondências lunares e médico-astrológicas; consultar edição utilizada."}
  - {autor: "Heinrich Cornelius Agrippa", obra: "De occulta philosophia", natureza: "primária histórica", localizador: "Livro I; prata e correspondências lunares."}
validacao_de_fontes:
  base: "Peito/estômago e prata são correspondências históricas; psicologia do cuidado é leitura moderna."
  limite: "Não usar para fenotipagem, diagnóstico, fertilidade ou prescrição."
