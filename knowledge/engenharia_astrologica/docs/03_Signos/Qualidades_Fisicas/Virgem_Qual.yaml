status: draft
id: virgem_qualidades
nome: Virgem — Qualidades Físicas
cor: Verde-claro, marrom-terra, verde-oliva
parte_do_corpo: Intestinos, sistema digestivo inferior, vesícula biliar, pâncreas, abdômen
elemento_fisico: Terra (frio, seco na maturidade)
qualidade_termica: Fria e seca
origens_e_divergencias:
  tradicional: Doutrina das Assinaturas (Culpeper/Agrippa) — cor, metal, planta.
  moderna: Astrologia psicológica moderna (Liz Greene) — corpo como linguagem simbólica.
  nota: Revisar ao citar — marca a escola usada.
atlas_simbolico:
  pessoas_arquetipos: Servo, cuidador, analista, médico, professor, artesão, inventor
  lugares_fisicos: Hospitais, escritórios, laboratórios, bibliotecas, jardins, locais de trabalho
  objetos_materia: Instrumentos de medição, livros técnicos, ferramentas, plantas medicinais
  eventos_tipicos: Cura, recuperação, processos seletivos, exames, organização, rotinas
  animais: Galinha, cão de caça, abutre, formiga, abelha, esquilo
  plantas_ervas: Trigo, centeio, hortelã, camomila, sabugueiro, carqueja
  metais_pedras: Mercúrio (metal), jaspe, ágata, cristal de rocha, esmeralda
  cores_sons: Verde-claro, cinza, marrom-claro; notas Mi e Dó; flauta, órgão
  numeros: 5 (cinco sentidos), 6 (serviço), 8 (análise)
  dias_semana: Quarta-feira (dia de Mercúrio)
  doencas_corpo: Intestinos, aparelho digestivo, baço, pâncreas, sistema nervoso
  arquetipos_mitologicos: Atena (sabedoria prática), Deméter/Ceres (colheita), Héstia/Vesta (serviço)
  mitos_historias: Atena e a Aegis; Deméter e a colheita; Héstia e o fogo sagrado
  sonhos_simbolos_inconsciente: Ferramentas, jardins, livros, médicos, análise, limpeza
  expressao_elevada_sombra: 'Elevada: serviço desapegado, análise precisa, cura pelo detalhe | Sombra: crítica destrutiva, perfeccionismo paralisante, hipocondria'
camada_energetica:
  impressao_mental: A cor verde-terra no mapa = 'mente que classifica'.
  permeacao_emocional: Ansiedade de 'fazer certo', crítico consigo e com os outros.
  manifestacao_externa: 'Estilo verde/bege; tende a ter ''cara de virginiano'' (olhos analíticos, postura contida). Arquétipos: o Analista. Inclinação, não destino.'
  como_guiar_o_astral: Verde como amuleto de método — Virgem precisa de RITMO e CLASSE.
porque_simbolico: 'Virgem = INTESTINOS — órgão que CLASSIFICA e ELIMINA. O intestino ''decide'' o que é nutrição e o que é lixo — exatamente Virgem que analisa e separa.

  VERDE-OLIVA = cor da TERRA FÉRTIL (Virgem = terra que cultiva). MARROM = cor do ''solo'' (base do método).

  '
