status: review
id: touro_qualidades
nome: Touro — Qualidades Físicas
cor: Verde-esmeralda, rosa, dourado-suave
parte_do_corpo: Pescoço, garganta, tireoide, cordas vocais
elemento_fisico: Terra (morna, úmida)
qualidade_termica: Morna e úmida
origens_e_divergencias:
  tradicional: Doutrina das Assinaturas (Culpeper/Agrippa) — cor, metal, planta.
  moderna: Astrologia psicológica moderna (Liz Greene) — corpo como linguagem simbólica.
  nota: Revisar ao citar — marca a escola usada.
atlas_simbolico:
  pessoas_arquetipos: Camponês, agricultor, banqueiro, artesão, músico, pessoa de posses
  lugares_fisicos: Campos, fazendas, jardins, montanhas, bosques, locais de abundância
  objetos_materia: Moedas, jóias, instrumentos musicais, ferramentas de trabalho, vinho, pão
  eventos_tipicos: Colheitas, casamentos, aquisições de bens, construções, festas da terra
  animais: Touro, vaca, cavalo de carga, boi, toupeira, cisne
  plantas_ervas: Videira, trigo, rosa, lírio, oliveira, hera, rosmaninho
  metais_pedras: Cobre, bronze, esmeralda, jaspe verde, turquesa, topázio
  cores_sons: Verde, rosa, marrom; notas Lá e Ré; flauta, violão, trompa
  numeros: 2 (dualidade material), 6 (harmonia terrena), 8 (materialidade)
  dias_semana: Sexta-feira (dia de Vênus)
  doencas_corpo: Garganta, pescoço, tireoide, rigidez cervical, excesso de peso, vícios
  arquetipos_mitologicos: Zeus em forma de touro (rapto de Europa), Dioniso/Baco, Deméter/Ceres, Hestia/Vesta
  mitos_historias: Touro de Creta; Os trabalhos de Hércules (captura do touro); Dioniso e a videira
  sonhos_simbolos_inconsciente: Touros, campos verdes, comida, tesouros, musicais, jardins
  expressao_elevada_sombra: 'Elevada: estabilidade confiável, gosto refinado, persistência construtiva | Sombra: possessividade, avareza, teimosia cega, apego material'
camada_energetica:
  impressao_mental: A cor verde/rosa no mapa = 'prazer que vira valor'.
  permeacao_emocional: Apego ao conforto, 'o que é meu e belo'.
  manifestacao_externa: 'Estilo verde/rosa/dourado; tende a ter ''cara de touro'' (traços sólidos, pescoço marcante). Arquétipos: o Fruto. Inclinação, não destino.'
  como_guiar_o_astral: Verde/rosa como amuleto de prazer saudável — Touro precisa de BELEZA para funcionar.
porque_simbolico: 'Touro = PESCOÇO/GARGANTA — é o ''pescoço'' do zodíaco anatômico. O pescoço CONECTA a cabeça ao corpo (Touro = conexão entre pensamento e prazer).

  VERDE-ESMERALDA = cor da NATUREZA que brota (Touro = terra que floresce). ROSA = flor do prazer (Vênus rege Touro).

  '

aparencia_nas_tradicoes:
  descricao: "Na fisionomia astrológica tradicional, Touro ou Ascendente taurino pode ser descrito como de constituição sólida, pescoço forte, traços estáveis e voz marcada; é uma doutrina morfológica de autores e períodos, não consenso universal."
  porque: "A imagem deriva do touro, da qualidade fixa/terrosa e da atribuição anatômica da garganta e do pescoço."
  variantes: "Alguns autores privilegiam Ascendente e regente; outros combinam Vênus, Lua, dignidades e planetas angulares."
  limite: "Registrar fonte e método; não converter uma doutrina histórica em fenótipo ou destino."

referencias:
  - autor: "Claudius Ptolemy"
    obra: "Tetrabiblos"
    natureza: "fonte primária histórica"
    localizador: "Livro I, qualidades dos signos e correspondências corporais."
  - autor: "Heinrich Cornelius Agrippa"
    obra: "De occulta philosophia libri tres"
    natureza: "fonte primária renascentista"
    localizador: "Livro I, cadeias de Vênus, cores, plantas, pedras e metais."
  - autor: "Nicholas Culpeper"
    obra: "Astrological Judgement of Diseases from the Decumbiture of the Sick"
    natureza: "fonte histórica"
    localizador: "Correspondências de Vênus e garganta; não usar como diagnóstico."
