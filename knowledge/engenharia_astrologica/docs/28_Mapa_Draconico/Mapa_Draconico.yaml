status: review
id: "mapa_draconico"
nome: "Mapa Dracônico"
tradicoes:
  - "moderna ocidental"
  - "karmica"
tipo: "Aprofundamento"
subtema: "Eixo do dragão, leitura cármica"

origens_e_divergencias:
  tradicional: "A linguagem Caput/Cauda Draconis e os nodos como cabeça/cauda do dragão é antiga; o mapa dracônico com Nodo Norte em 0° Áries não é técnica helenística preservada."
  moderna: "Evolutiva/cármica — eixo nodoso como 'missão da alma'."
nota: "Revisar ao citar — marca a escola usada."
revisao_editorial:
  estado: "draft_enriquecido"
  atribuicao: "O mapa dracônico é uma técnica moderna: desloca o zodíaco para que o Nodo Norte fique em 0° Áries. A associação do nodo à cabeça/cauda do dragão é antiga; 'missão da alma' e 'vidas passadas' são leituras cármicas contemporâneas."
  divergencias: "Não é uma técnica helenística preservada nem uma prova histórica de karma. Escolas modernas divergem sobre usar nodo médio/verdadeiro e sobre casas, aspectos e orbes."
  calculo: "Longitude dracônica = longitude tropical − longitude do Nodo Norte, normalizada em 0–360°. Declarar nodo médio ou verdadeiro e sistema de casas."
  uso_no_motor: "Exigir modo dracônico explícito; exibir simultaneamente zodíaco tropical de referência e a convenção nodal escolhida."
referencias:
  - autor: "Pam Crane"
    obra: "The Draconic Chart"
