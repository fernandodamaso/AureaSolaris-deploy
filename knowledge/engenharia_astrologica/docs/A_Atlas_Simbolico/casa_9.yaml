  permeacao_emocional: "Esperança e otimismo. Quando saudável: generosidade. Quando ferido: fanatismo."
  manifestacao_externa: "Eventos prováveis de viagens, estudos, publicações. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a encontrar sua verdade sem impô-la. Casa 9 é a fé, não o dogma."

