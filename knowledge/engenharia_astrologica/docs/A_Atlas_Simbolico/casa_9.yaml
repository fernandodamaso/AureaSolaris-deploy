  - autor: "Vettius Valens"
    obra: "Anthology"
    natureza: "fonte helenística"
    localizador: "Livro II, tópicos de lugares e viagens; consultar tradução de Mark Riley."
  - autor: "Dane Rudhyar"
    obra: "The Astrology of Personality"
    ano: 1936
    natureza: "fonte moderna psicológica"
    localizador: "Leitura de sentido e filosofia; não substituir a significação tradicional."

limites_e_divergencias:
  - "‘Fé’ pode significar religião institucional, filosofia ou busca de sentido conforme a escola; não é sinônimo universal de dogma."
  - "Correspondências de Júpiter, quinta-feira, fígado e pedras são camadas tradicionais/modernas distintas; cada uma deve ser rotulada."
  - "O motor deve preservar sistema de casas e tradição selecionados; a casa 9 não determina viagens, vocação religiosa ou doença."

