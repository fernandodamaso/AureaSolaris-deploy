camada_energetica:
  impressao_mental: "A mente que TRANSFORMA e RENASCE. Profundidade, morte do antigo, renascimento."
  permeacao_emocional: "Intensidade emocional extrema. Quando saudável: regeneração. Quando ferido: obsessão, medo de perder o controle."
  manifestacao_externa: "Eventos PROVÁVEIS de crise, morte, renascimento, poder. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a SOLTAR o que já morreu. Plutão é a metamorfose, não a destruição."

tarot_relacionado:
  carta: "A Morte (XIII)"
  conexao: "A Morte é Plutão: fim do que já não serve, renascimento, transformação radical."

foco_especial:
  infantil: "A criança Plutão é intensa, silenciosa, percebe o invisível. Precisa de respeito pela sua profundidade."
  familiar: "O membro que carrega segredos familiares. O que transforma a família através de crise."
  carmico_espiritual: "Plutão indica a LIÇÃO DE PODER. Casa Plutão = onde a pessoa aprende a morrer para renascer."

camada_tecnica_e_limites:
  regra: "O motor só deve usar Plutão quando habilitado e registrar se Escorpião segue Marte tradicional, Plutão moderno ou co-regência; nenhuma opção pode ser silenciosa."
  limites: "Câncer, infecções, morte e trauma não podem ser diagnosticados ou previstos por Plutão isolado. Tarot, pedras e leitura cármica são camadas atribuídas."
referencias:
