origens_e_divergencias:
  tradicional: "Plutão foi descoberto em 1930 e não integra a tradição dos sete planetas. Escorpião permanece domicílio de Marte no esquema tradicional."
  moderna: "Astrologias moderna, psicológica e evolutiva associam Plutão a Escorpião, poder, compulsão, crise, destruição/regeneração e processos coletivos; autores e escolas divergem sobre regência, peso e uso natal."
  nota: "Astronomicamente classificado como planeta anão desde 2006; isso não elimina seu uso astrológico moderno. Plutônio é correspondência posterior à descoberta do elemento e não tradicional."

origem_linguistica_mito_glifo:
  etimologia: "Plutão vem de Ploutōn, 'o rico', título grego ligado às riquezas subterrâneas; o nome astronômico foi adotado em 1930."
  mito: "Hades/Plutão governa o mundo dos mortos; Perséfone articula descida e retorno. Hécate, Cronos e Dioniso aproximam temas, mas não são equivalentes."
  glifo: "♇ combina P e L, iniciais de Pluto e também de Percival Lowell; outros glifos circulam em escolas astrológicas."
  porque: "Nome ctônico, distância, invisibilidade a olho nu e contexto do século XX sustentaram profundidade, massa, poder e transformação coletiva."

