camada_energetica:
  impressao_mental: "A mente que VALORA e HARMONIZA. Busca do belo, da justiça, do equilíbrio."
  permeacao_emocional: "Capacidade de amar, apreciar, sentir prazer. Vênus é o afeto, o gosto, o que 'vale a pena'."
  manifestacao_externa: "Eventos PROVÁVEIS de encontros, arte, dinheiro, casamentos. Arquétipos: o Amante, o Artista. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a AMAR SEM POSSUIR. Vênus é a entrega, não a posse."

tarot_relacionado:
  carta: "Os Enamorados (VI) / A Imperatriz (III)"
  conexao: "Os Enamorados = Vênus como escolha amorosa. A Imperatriz = Vênus como beleza e fertilidade."

foco_especial:
  infantil: "A criança Vênus adora beleza, carinho, harmonia. Precisa de ambiente estético, música, abraços."
  familiar: "A pessoa que MEDIA conflitos. A que traz harmonia. Quando ferida: manipulação por ciúme."
  carmico_espiritual: "Vênus indica a LIÇÃO DE AMOR da alma. Casa Vênus = onde a pessoa aprende a amar."

ver_mais:
