origens_e_divergencias:
  tradicional: "Hipócrates, Agrippa — Vênus = cobre, beleza, amor, harmonia, Vênus/Afrodite."
  moderna: "Psicológica — Vênus como função sentimentos/valores. Evolutiva — Vênus como capacidade de amar e ser amado."
  nota: "Regência unânime de Touro e Libra. Nenhuma divergência."

