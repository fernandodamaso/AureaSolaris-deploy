revisao_editorial:
  origem_e_linguagem: "A primeira casa é o lugar ascendente/horizonte oriental em sistemas de casas; 'eu' e procissão são imagens pedagógicas, não etimologia única."
  mito_arquetipo_e_porque: "Entrada, rosto, começo e encarnação explicam o porquê simbólico da casa; são mapas de linguagem e não prova de aparência ou caráter."
  limite_tecnico: "A casa depende de hora/local e sistema de casas declarado. Signo natural de Áries é analogia moderna, não substituto de cálculo."
