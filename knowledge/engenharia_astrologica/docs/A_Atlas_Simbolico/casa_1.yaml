  tecnicas:
    - "Declarar sistema de casas, UTC, local e coordenadas antes da interpretação."
camada_energetica:
  impressao_mental: "Foco na própria identidade e iniciativa. 'Como eu parto?'"
  permeacao_emocional: "Autoimagem, 'como eu me sinto sendo eu'."
  manifestacao_externa: "Eventos prováveis de 'novo começo', identidade. Arquétipos: o Espelho, o Primeiro. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a 'ser sem máscara' — Casa 1 é o EU sem filtro."

significados_derivados:
  corpo: "Casa 1 = corpo físico (primeira casa = pele/cabeça)."
  identidade: "Quem eu sou, como me apresento, 'a máscara que uso' (no bom sentido)."
  primeira_impressao: "Como o mundo te vê na primeira olhada (diferente de Casa 10 que é reputação consolidada)."

