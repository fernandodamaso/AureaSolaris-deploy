revisao_editorial:
  origem_e_linguagem: "Escorpião deriva do latim scorpio; o animal, a constelação e o signo tropical são camadas relacionadas, mas não idênticas."
  mito_arquetipo_e_porque: "Ferrão, defesa, ocultação e metamorfose são imagens simbólicas; a associação com poder/sexualidade é amplamente moderna e não deve virar essência de uma pessoa."
  limite_tecnico: "Marte é regente tradicional; Plutão é regente moderno. A variante escolhida deve ser visível e o signo não substitui condição planetária."
referencias:
  primarias:
    - "Ptolomeu. Tetrabiblos, livro I: signos e qualidades, conforme edição declarada."
  secundarias:
    - "Greene, Liz. The Astrology of Fate. Samuel Weiser, 1984."
  tecnicas:
    - "Ver 04_Planetas/Marte.yaml, 04_Planetas/Plutao.yaml e regras de regência."
camada_energetica:
  impressao_mental: "A mente que TRANSFORMA e RENASCE. Profundidade, morte do antigo."
  permeacao_emocional: "Intensidade emocional extrema. Quando saudável: regeneração. Quando ferido: obsessão."
  manifestacao_externa: "Eventos PROVÁVEIS de crise, morte, renascimento, poder. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a SOLTAR o que já morreu. Escorpião é a metamorfose."

tarot_relacionado:
  carta: "A Morte (XIII)"
  conexao: "A Morte é Escorpião: fim do que já não serve, renascimento."

foco_especial:
  infantil: "A criança Escorpião é intensa, silenciosa, percebe o invisível. Precisa de respeito pela sua profundidade."
  familiar: "O membro que carrega segredos. O que transforma a família."
  carmico_espiritual: "Escorpião indica a LIÇÃO DE PODER. Casa Escorpião = onde a pessoa aprende a morrer para renascer."

