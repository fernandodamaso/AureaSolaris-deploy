origens_e_divergencias:
  tradicional: "Ptolomeu — Castor = gêmeo imortal; viagens, comércio, eloquência, morte súbita."
  moderna: "Astrologia moderna mantém; acrescenta comunicação, irmãos, viagens curtas."
  nota: "Castor e Pollux são gêmeos mitológicos; Castor é mortal, Pollux imortal."
referencias:
  - {autor: "Claudius Ptolemy", obra: "Tetrabiblos", natureza: "primária astrológica", localizador: "I.9"}
