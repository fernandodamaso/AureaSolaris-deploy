uso_tecnico: "Registrar conjunção, orbe e natureza planetária; não fundir Castor com Pollux."
divergencias_documentadas: "Mercúrio e misturas Mercúrio/Marte aparecem em autores diferentes; a leitura moderna de comunicação é uma extensão."

