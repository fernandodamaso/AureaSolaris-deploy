origens_e_divergencias:
  tradicional: "Quíron não pertence ao cânone dos sete planetas. O corpo 2060 Chiron foi descoberto por Charles Kowal em 1977 e hoje é classificado como pequeno corpo/centauro."
  moderna: "A recepção astrológica posterior desenvolveu 'curador ferido', mentor, ponte e ferida que ensina; Al H. Morrison ajudou a divulgar efemérides e o novo símbolo, mas não deve ser apresentado sozinho como introdutor incontroverso da interpretação."
  nota: "Não há regência, exaltação, dia, metal, cor, corpo ou número universalmente aceitos para Quíron. Forrest, Melanie Reinhart e linhas evolutivas/psicológicas desenvolvem variantes."

origem_linguistica_mito_glifo:
  etimologia: "Chiron translitera o grego Cheírōn; associações populares com cheír, 'mão', são sugestivas, mas a etimologia exata merece cautela."
  mito: "O centauro sábio instrui heróis, domina medicina e música, é ferido por seta envenenada e troca sua imortalidade pela libertação de Prometeu."
  glifo: "⚷ parece uma chave sobre círculo e foi adotado na recepção astrológica moderna; não é símbolo antigo."
  porque: "A combinação mítica de mestre, medicina, ferida incurável e renúncia fundamenta o arquétipo moderno do curador ferido."

