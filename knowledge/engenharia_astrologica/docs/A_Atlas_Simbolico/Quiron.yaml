camada_energetica:
  impressao_mental: "A mente que APRENDE PELA FERIDA. Sabedoria que vem da dor, ensino através do exemplo."
  permeacao_emocional: "Compressão da dor que vira compaixão. Quando saudável: curador. Quando ferido: vitimizado."
  manifestacao_externa: "Eventos PROVÁVEIS de cura, encontro com mestres, acidentes que geram sabedoria. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a PERCEBER que sua ferida é a ponte para o outro. Quíron não é a dor — é o que a dor ensina."

tarot_relacionado:
  carta: "O Sacerdote (Ás de Ouros) / O Eremita (IX)"
  conexao: "O Eremita é Quíron: luz que ilumina por dentro, ferida que ensina, sabedoria que vem da solidão."

foco_especial:
  infantil: "A criança Quíron pode ser precoce, ferida, diferente. Precisa de espaço para curar, não de julgamento."
  familiar: "O membro que cura a família através da própria dor."
  carmico_espiritual: "Quíron indica a LIÇÃO DE CURA. Casa Quíron = onde a pessoa aprende a transformar dor em serviço."

camada_tecnica_e_limites:
  regra: "O motor deve tratar Quíron como ponto moderno opcional, calculado por efeméride, sem dignidades ou regências implícitas."
  limites: "Ferida, crise nervosa e cura são linguagem simbólica, não diagnóstico. Dia, metal, tarot, plantas e partes do corpo são propostas modernas divergentes."
