origens_e_divergencias:
  tradicional: "Mercúrio rege Gêmeos e Virgem e exalta-se em Virgem. Significa linguagem, comércio, cálculo, escrita, viagem e mediação; adapta-se por secto, velocidade, relação solar e associação planetária."
  moderna: "Linhas psicológicas enfatizam percepção, pensamento, aprendizagem e comunicação. Mercúrio não equivale automaticamente ao ego."
  nota: "A velocidade deve ser calculada: Mercúrio é classificado entre os planetas rápidos, mas pode estar lento, estacionário ou retrógrado."

origem_linguistica_mito_glifo:
  etimologia: "Mercurius relaciona-se ao latim merx, mercadoria, preservando a ligação com troca e comércio."
  mito: "Hermes/Mercúrio é mensageiro, negociador, ladrão e psicopompo; Thoth e Anúbis são aproximações interculturais, não equivalentes automáticos."
  glifo: "☿ deriva da tradição de sinais planetários; a leitura de crescente, círculo e cruz é esotérica posterior."
  porque: "Rapidez, proximidade do Sol e alternância matutina/vespertina sustentam mobilidade, ambivalência e travessia de limites."

