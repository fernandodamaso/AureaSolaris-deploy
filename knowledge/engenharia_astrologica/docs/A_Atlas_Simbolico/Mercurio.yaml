camada_energetica:
  impressao_mental: "A mente que CONECTA e CLASSIFICA. Pensamento rápido, curiosidade, busca de informação."
  permeacao_emocional: "Comunicação como ponte emocional. Quando saudável: diálogo, expressão. Quando ferido: silêncio ou ruído excessivo."
  manifestacao_externa: "Eventos PROVÁVEIS de viagens curtas, encontros, contratos, aprendizado. Arquétipos: o Mensageiro, o Escriba. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a ESCREVER/FALAR o que sente. Mercúrio é o canal — se bloqueado, tudo trava."

tarot_relacionado:
  carta: "O Mago (Arcano Maior I)"
  conexao: "O Mago tem Mercúrio no altar: comunicação, ferramentas, vontade manifestada. Canal entre o céu e a terra."

foco_especial:
  infantil: "A criança Mercúrio é tagarela, curiosa, adora aprender. Precisa de estímulo mental, livros, perguntas. Rotina repetitiva a entedia."
  familiar: "O irmão/primso comunicador. O que traz notícias, faz conexões, negocia."
  carmico_espiritual: "Mercúrio indica a LIÇÃO que a alma veio APRENDER e ENSINAR. Casa Mercúrio = onde a pessoa aprende melhor."

camada_tecnica_e_limites:
  regra: "Calcular velocidade, estação, retrogradação, elongação, orientalidade/ocidentalidade, combustão/cazimi, dignidade, casa e aspectos."
  limites: "Correspondências corporais são históricas, não diagnóstico. Tarot, sonhos, pedras e leituras evolutivas não alteram silenciosamente o cálculo."
