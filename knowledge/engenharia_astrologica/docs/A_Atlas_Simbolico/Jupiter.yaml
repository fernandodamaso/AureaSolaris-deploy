camada_energetica:
  impressao_mental: "A mente que EXPANDE e BUSCA SENTIDO. Filosofia, fé, verdade maior."
  permeacao_emocional: "Esperança, otimismo, confiança. Quando saudável: generosidade. Quando ferido: exagero, fuga."
  manifestacao_externa: "Eventos PROVÁVEIS de expansão, viagens, sucesso, estudos. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a ENCONTRAR SUA PRÓPRIA VERDADE. Júpiter é a bússola, não o mapa."

tarot_relacionado:
  carta: "A Roda da Fortuna (X)"
  conexao: "Júpiter é a Roda: expansão, sorte, ciclos, o grande jogo da vida."

foco_especial:
  infantil: "A criança Júpiter adora histórias, viagens, aprender. Precisa de fé, otimismo, horizontes amplos."
  familiar: "O professor/avô da família. O que expande horizontes. Conflitos: excesso, opinião forte."
  carmico_espiritual: "Júpiter indica a LIÇÃO DE FÉ. Casa Júpiter = onde a pessoa cresce e expande."

camada_tecnica_e_limites:
  regra: "Julgar Júpiter por signo, casa, secto, dignidades, velocidade, relação solar, recepções e aspectos; nunca converter 'expansão' em sorte automática."
  limites: "Corpo e doenças são correspondências históricas, não diagnóstico. Tarot, cores, pedras, mitos comparados e leituras cármicas não são parâmetros computáveis por si."
referencias:
