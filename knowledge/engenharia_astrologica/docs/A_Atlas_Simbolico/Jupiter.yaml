tipo: "Atlas Simbólico"
subtema: "Correspondências de Júpiter"

origens_e_divergencias:
  tradicional: "Na astrologia helenística, medieval e renascentista, Júpiter rege Sagitário e Peixes e exalta-se em Câncer; significa lei, fé, honra, conselho, abundância e proteção, condicionado por secto, dignidade, casa e aspectos. Agrippa registra estanho e repertórios naturais jupiterianos."
  moderna: "Linhas psicológicas enfatizam busca de sentido, confiança e visão de mundo; linhas evolutivas podem chamá-lo de bússola moral da alma. São desenvolvimentos modernos, não regras técnicas universais."
  nota: "Correção: Peixes é domicílio tradicional, não exaltação. Pedras, plantas, números e tarot variam entre autores e permanecem como correspondências atribuídas."

origem_linguistica_mito_glifo:
  etimologia: "Iuppiter remonta à fórmula indo-europeia do 'Pai-Céu luminoso'."
  mito: "Zeus/Júpiter governa, distribui honras e guarda juramentos; Thor e Odin são analogias comparativas, não identidades históricas."
  glifo: "♃ deriva da tradição gráfica planetária; explicações como inicial de Zeus ou curva sobre a cruz são exegeses posteriores."
  porque: "A natureza tradicional moderadamente quente e úmida e a imagem do soberano benéfico explicam fertilidade, expansão, justiça e proteção."

