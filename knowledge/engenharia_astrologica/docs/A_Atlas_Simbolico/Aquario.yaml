camada_energetica:
  impressao_mental: "A mente que INOVA e LIBERTA. Insights súbitos, rupturas de padrão."
  permeacao_emocional: "Liberdade interior. Quando saudável: originalidade. Quando ferido: solidão por ser diferente."
  manifestacao_externa: "Eventos PROVÁVEIS de rupturas, inovações, encontros súbitos. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a CANALIZAR a electricidade. Aquário sem filtro causa curto-circuito."

tarot_relacionado:
  carta: "O Louco (0)"
  conexao: "O Louco é Aquário: passo no vazio, ruptura, confiança no desconhecido."

foco_especial:
  infantil: "A criança Aquário é o gênio incompreendido. Precisa de liberdade, estímulo intelectual."
  familiar: "O membro 'estranho' da família. O que traz inovação."
  carmico_espiritual: "Aquário indica a LIÇÃO DE LIBERDADE. Casa Aquário = onde a pessoa deve inovar e libertar."

