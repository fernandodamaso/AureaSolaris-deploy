revisao_editorial:
  origem_e_linguagem: "Aquário vem do latim aquarius, 'portador de água'. O signo tropical não é a constelação e o jarro é imagem iconográfica, não descrição de um objeto técnico."
  mito_arquetipo_e_porque: "Água derramada, renovação e coletividade sustentam leituras simbólicas; Ganimedes e outras narrativas exigem atribuição cultural específica."
  limite_tecnico: "Saturno é regente tradicional; Urano é regente moderno. O motor deve oferecer variante de escola, não ocultar a divergência."
referencias:
  primarias:
    - "Ptolomeu. Tetrabiblos, livro I: signos e qualidades, conforme edição declarada."
  secundarias:
