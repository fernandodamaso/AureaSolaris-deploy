revisao_editorial:
  origem_e_linguagem: "Leão vem do latim leo; o leão é figura zodiacal antiga, enquanto o signo tropical é uma divisão de 30° e não a constelação."
  mito_arquetipo_e_porque: "Luz, realeza, coração e animal solar são imagens de transmissão variada; Apolo, Hélio, Rá e outras divindades devem permanecer culturalmente identificados."
  limite_tecnico: "O Sol é regente tradicional; criatividade, filhos, autoridade ou reconhecimento exigem julgamento por casas, aspectos e contexto."
referencias:
  primarias:
    - "Ptolomeu. Tetrabiblos, livro I: signos e qualidades, conforme edição declarada."
  secundarias:
    - "Greene, Liz. The Luminaries: The Psychology of the Sun and Moon in the Horoscope. Samuel Weiser, 1992."
  tecnicas:
    - "Ver 02_Astronomia/Zodiaco_Tropical.yaml e 04_Planetas/Sol.yaml."
camada_energetica:
  impressao_mental: "A mente que BRILHA e CRIA. Vontade central, 'quem eu sou no fundo'."
  permeacao_emocional: "Autoestima e vitalidade. Quando saudável: generosidade. Quando ferido: vaidade, depressão."
  manifestacao_externa: "Eventos PROVÁVEIS de reconhecimento, liderança, marcos. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a BRILHAR SEM QUEIMAR. Leão é o centro, não o sol que cega."

tarot_relacionado:
  carta: "A Força (VIII) / O Sol (XIX)"
  conexao: "A Força é Leão: coragem, domínio do instinto, força serena."

foco_especial:
  infantil: "A criança Leão precisa ser vista, reconhecida, celebrada."
  familiar: "O rei/rainha da família. O que representa a família para o mundo."
  carmico_espiritual: "Leão indica a LIÇÃO DE EXPRESSÃO. Casa Leão = onde a pessoa aprende a brilhar."

