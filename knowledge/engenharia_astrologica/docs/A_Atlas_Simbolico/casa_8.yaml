revisao_editorial:
  origem_e_linguagem: "A oitava casa é sucessiva à sétima; recursos de outros, herança, temor e morte aparecem em diferentes linhagens de casas. Transformação é releitura moderna importante, não única definição histórica."
  mito_arquetipo_e_porque: "Porta, passagem, legado e oculto organizam o mapa simbólico; não justificam inferência fatalista sobre morte, trauma, sexo ou finanças."
  limite_tecnico: "A analogia com Escorpião/Plutão é moderna. Heranças, perdas e eventos devem ser julgados com técnica, contexto e limites éticos, jamais a partir de um fator isolado."
referencias:
  primarias:
    - "Lilly, William. Christian Astrology. 1647, livro II: significações da oitava casa."
  secundarias:
    - "Houlding, Deborah. The Houses: Temples of the Sky. The Wessex Astrologer, 1996."
  tecnicas:
    - "Declarar sistema de casas, técnica e pergunta antes de qualquer aplicação preditiva."
camada_energetica:
  impressao_mental: "A mente que TRANSFORMA e RENASCE. 'O que morre para eu renascer?'."
  permeacao_emocional: "Intensidade emocional extrema. Quando saudável: regeneração. Quando ferido: obsessão."
  manifestacao_externa: "Eventos PROVÁVEIS de crise, morte, renascimento, poder. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a SOLTAR o que já morreu. Casa 8 é a metamorfose, não a destruição."

