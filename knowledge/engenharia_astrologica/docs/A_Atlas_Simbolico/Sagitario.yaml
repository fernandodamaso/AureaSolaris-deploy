revisao_editorial:
  origem_e_linguagem: "Sagitário vem do latim sagittarius, 'arqueiro'. O centauro-arqueiro é figura zodiacal; signo tropical e constelação não são o mesmo objeto astronômico."
  mito_arquetipo_e_porque: "Arco, direção, viagem e busca de horizonte são imagens simbólicas; Quíron e outros centauros pertencem a mitos específicos e não esgotam a leitura do signo."
  limite_tecnico: "Júpiter é regente tradicional; viagem, ensino, fé ou filosofia só podem ser interpretados com casas, aspectos, condição e pergunta contextualizados."
referencias:
  primarias:
    - "Ptolomeu. Tetrabiblos, livro I: signos e qualidades, conforme edição declarada."
  secundarias:
    - "Rudhyar, Dane. The Astrological Signs: The Pulse of Life. Harper & Row, 1971."
  tecnicas:
    - "Ver 02_Astronomia/Zodiaco_Tropical.yaml e 04_Planetas/Jupiter.yaml."
camada_energetica:
  impressao_mental: "A mente que BUSCA A VERDADE. Filosofia, fé, expansão, 'qual é o sentido?'."
  permeacao_emocional: "Esperança e otimismo. Quando saudável: generosidade. Quando ferido: fanatismo, exagero."
  manifestacao_externa: "Eventos PROVÁVEIS de viagens, estudos, publicações. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a ENCONTRAR SUA VERDADE sem impô-la. Sagitário é a bússola, não o mapa."

tarot_relacionado:
  carta: "A Roda da Fortuna (X)"
  conexao: "Júpiter é a Roda: expansão, sorte, ciclos, a grande jornada."

foco_especial:
  infantil: "A criança Sagitário adora histórias, viagens, aprender. Precisa de fé, otimismo, horizontes amplos."
  familiar: "O professor/avô da família. O que expande horizontes."
  carmico_espiritual: "Sagitário indica a LIÇÃO DE FÉ. Casa Sagitário = onde a pessoa cresce e expande."

