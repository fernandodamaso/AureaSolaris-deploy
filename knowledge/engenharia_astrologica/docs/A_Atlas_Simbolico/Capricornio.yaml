revisao_editorial:
  origem_e_linguagem: "Capricórnio vem do latim capricornus, 'cabra com chifres'; a figura híbrida cabra-peixe é imagem antiga transmitida por múltiplas culturas."
  mito_arquetipo_e_porque: "Subida, pedra, montanha e cabra articulam esforço e altitude; a cauda aquática preserva a imagem de ambivalência, sem converter mito em diagnóstico de personalidade."
  limite_tecnico: "A regência de Saturno é tradicional; imagens modernas de carreira/controle são camadas interpretativas e exigem casa, aspectos e escola declarada."
referencias:
  primarias:
    - "Ptolomeu. Tetrabiblos, livro I: signos e qualidades, conforme edição declarada."
  secundarias:
    - "Houlding, Deborah. The Houses: Temples of the Sky. The Wessex Astrologer, 1996."
  tecnicas:
    - "Ver 02_Astronomia/Zodiaco_Tropical.yaml e 04_Planetas/Saturno.yaml."
camada_energetica:
  impressao_mental: "A mente que ESTRUTURA e PLANEJA. Tempo, regra, maturidade, 'o que dura'."
  permeacao_emocional: "Medo e responsabilidade. Quando saudável: serenidade. Quando ferido: depressão."
  manifestacao_externa: "Eventos PROVÁVEIS de concretização, limitações, contratos. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a CONSTRUIR COM REALISMO. Capricórnio é a prova: o que aguenta o tempo, aguenta tudo."

tarot_relacionado:
  carta: "O Eremita (IX)"
  conexao: "O Eremita é Capricórnio: tempo, solitude, sabedoria que vem com idade."

foco_especial:
  infantil: "A criança Capricórnio é precocemente responsável. Precisa de limites claros, não de abandono."
  familiar: "O patriarca/matriarca que estrutura. O que ensina a lidar com tempo."
  carmico_espiritual: "Capricórnio indica a LIÇÃO DE MATURIDADE. Casa Capricórnio = onde a pessoa aprende a crescer pelo esforço."

