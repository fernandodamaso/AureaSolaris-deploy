  mito_arquetipo_e_porque: "Oficina, rotina, cuidado e tarefa dão o porquê simbólico da casa; não são prova de doença, obrigação ou subordinação de uma pessoa."
  limite_tecnico: "A analogia com Virgem/Mercúrio é moderna. Correspondências médicas são estudo histórico-simbólico, nunca diagnóstico, prescrição ou certeza corporal."
