revisao_editorial:
  origem_e_linguagem: "A sétima casa se inicia no Descendente/horizonte ocidental em muitos sistemas; espelho e outro são imagens pedagógicas para relação, contrato e oposição."
  mito_arquetipo_e_porque: "Encontro, pacto, rival e reflexo ajudam a estudar a casa, mas não determinam casamento, separação ou a conduta de terceiros."
  limite_tecnico: "A analogia com Libra/Vênus é moderna. Sinastria, composto e Davison são técnicas distintas e não podem ser substituídas pela casa natal isolada."
