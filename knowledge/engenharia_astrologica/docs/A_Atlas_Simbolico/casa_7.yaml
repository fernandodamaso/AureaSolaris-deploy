camada_energetica:
  impressao_mental: "A mente que se encontra no outro. 'Quem eu sou quando estou com alguém?'."
  permeacao_emocional: "Amor como espelho. Quando saudável: relação. Quando ferido: apego."
  manifestacao_externa: "Eventos prováveis de casamentos, sociedades, acordos. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a encontrar-se antes de se juntar. Casa 7 é o espelho, não a metade."

