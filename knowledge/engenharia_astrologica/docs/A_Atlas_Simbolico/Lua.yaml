camada_energetica:
  impressao_mental: "A mente que SENTE primeiro. Memória, imagem interna, 'como eu me sinto sendo eu'. Reage antes de pensar."
  permeacao_emocional: "O corpo emocional inteiro — nutrição ou fome emocional. A Lua é a fome, a saciedade, o colo."
  manifestacao_externa: "Eventos PROVÁVEIS de mudanças de estado emocional, lares, mães, mulheres, público feminino, viagens. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a diferenciar 'sentir' de 'ser'. Lua precisa de casa (segurança), não de prisão."

tarot_relacionado:
  carta: "A Sacerdotisa (Arcano Maior II)"
  conexao: "A Sacerdotisa é a Lua personificada: mistério, intuição, o que está oculto, o inconsciente."

foco_especial:
  infantil: "A criança Lua precisa de rotina, acolhimento, colo. Mudanças bruscas a desestruturam. Alimentos e cheiros são âncoras."
  familiar: "A mãe/mulher da família é a Lua. Representa a nutrição, a memória, a que cuida. Conflitos: apego, controle emocional."
  carmico_espiritual: "Lua indica onde a alma precisa de SEGURANÇA. Casa Lua = onde a pessoa se sente em casa. Missão: nutrir o mundo como foi nutrida (ou não foi)."

camada_tecnica_e_limites:
  regra: "Calcular fase, aplicação/separação, velocidade, dignidade, casa, secto, regente e aspectos antes de rotular a Lua."
  limites: "Correspondências corporais são históricas, não diagnóstico. Sonhos, tarot e crenças cármicas são camadas atribuídas, não resultados necessários."
referencias:
