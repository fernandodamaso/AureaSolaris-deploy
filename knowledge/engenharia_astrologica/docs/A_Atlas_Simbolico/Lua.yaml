origens_e_divergencias:
  tradicional: "A Lua rege Câncer e exalta-se em Touro; significa corpo, mãe, povo, geração, viagens, umidade e mudança. Fase, aplicação, velocidade, secto, dignidade e regente modificam o juízo. Agrippa registra prata e repertórios lunares."
  moderna: "Linhas psicológicas a leem como hábitos, memória afetiva e segurança. A associação direta à anima junguiana é aproximação moderna, não consenso."
  nota: "Selene, Ártemis/Diana, Hécate e Ísis vêm de contextos distintos: as aproximações enriquecem o atlas, mas não são identidades históricas."

origem_linguistica_mito_glifo:
  etimologia: "Lua vem do latim luna; Selḗnē nomeia em grego a deusa e o astro."
  mito: "Selene percorre a noite e ama Endimião; Ártemis adquire associações lunares, enquanto Hécate articula limiar e encruzilhada."
  glifo: "☽ representa diretamente o crescente visível."
  porque: "Fases, luz refletida e movimento rápido explicam receptividade, ciclo, hábito, memória e mutabilidade."

