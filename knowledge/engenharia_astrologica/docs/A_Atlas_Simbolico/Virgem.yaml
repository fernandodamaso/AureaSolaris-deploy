revisao_editorial:
  origem_e_linguagem: "Virgem vem do latim virgo, 'jovem/moça'; a figura zodiacal e o signo tropical não devem ser tratados como descrição literal de sexo, pureza ou constelação."
  mito_arquetipo_e_porque: "Colheita, grão, cuidado, discriminação e artesanato são imagens de estudo; Deméter, Astreia e outras figuras pertencem a mitos específicos."
  limite_tecnico: "Mercúrio é regente tradicional. Serviço, saúde e perfeccionismo são leituras contextuais, não diagnósticos ou determinismos pessoais."
