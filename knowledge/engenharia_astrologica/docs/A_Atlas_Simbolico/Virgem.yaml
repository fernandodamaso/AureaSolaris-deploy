camada_energetica:
  impressao_mental: "A mente que ANALISA e SERVE. Pensamento detalhado, busca da perfeição, 'como funciona?'."
  permeacao_emocional: "Serviço como forma de amor. Quando saudável: cuidado. Quando ferido: crítica, perfeccionismo."
  manifestacao_externa: "Eventos PROVÁVEIS de organização, cura, estudo, serviço. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a PERFEICIONAR SEM SE DESTRUIR. Virgem é o serviço, não a autocrítica."

tarot_relacionado:
