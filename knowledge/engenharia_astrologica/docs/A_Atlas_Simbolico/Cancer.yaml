revisao_editorial:
  origem_e_linguagem: "Câncer deriva do latim cancer, 'caranguejo'; o signo tropical e a constelação homônima não são a mesma coisa."
  mito_arquetipo_e_porque: "Caranguejo, casco, água e imagens de cuidado são chaves simbólicas; mitos gregos e leituras psicológicas devem ser mantidos como camadas atribuídas, não como fato universal."
  limite_tecnico: "Regência lunar tradicional não autoriza dedução corporal, familiar ou emocional sem julgamento do mapa inteiro."
referencias:
  primarias:
