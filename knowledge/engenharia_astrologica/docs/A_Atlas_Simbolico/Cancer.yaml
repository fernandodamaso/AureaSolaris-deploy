camada_energetica:
  impressao_mental: "A mente que SENTE e PROTEGE. Memória, imagem interna, 'como eu me sinto sendo eu'."
  permeacao_emocional: "Corpo emocional inteiro — nutrição ou fome emocional."
  manifestacao_externa: "Eventos PROVÁVEIS de mudanças de estado emocional, lares, mães, mulheres. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a diferenciar 'sentir' de 'ser'. Câncer precisa de casa (segurança), não de prisão."

tarot_relacionado:
  carta: "A Lua (XVIII)"
  conexao: "Câncer é regido pela Lua: mistério, intuição, o que está oculto, o inconsciente."

foco_especial:
  infantil: "A criança Câncer precisa de rotina, acolhimento, colo. Mudanças bruscas a desestruturam."
  familiar: "A mãe/mulher da família. A que cuida, nutre, lembra."
  carmico_espiritual: "Câncer indica a LIÇÃO DE NUTRIÇÃO. Casa Câncer = onde a pessoa aprende a cuidar e ser cuidada."

