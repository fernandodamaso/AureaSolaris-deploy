camada_energetica:
  impressao_mental: "A mente que BRILHA e ORGANIZA. Vontade central, senso de propósito, 'quem eu sou no fundo'."
  permeacao_emocional: "Autoestima e vitalidade emocional. Quando saudável: entusiasmo, generosidade. Quando ferido: vaidade, depressão por perda de reconhecimento."
  manifestacao_externa: "Eventos PROVÁVEIS de reconhecimento, liderança, nascimentos, marcos. Arquétipos: o Rei, o Sol, o Fogo Central. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a encontrar SUA própria luz, não a esperar brilho externo. Sol é o centro — o centro não depende de ninguém."

tarot_relacionado:
  carta: "O Sol (Arcano Maior XIX)"
  conexao: "Luz pura, alegria, sucesso, clareza. O Sol no tarot é a expressão máxima da energia solar: sem sombra, sem dúvida."

foco_especial:
  infantil: "A criança Sol precisa ser vista e valorizada. Precisa de espaço para brilhar, de reconhecimento sincero. Quando não tem: tende a apagar-se ou a exagerar."
  familiar: "O pai/mãe solar é a autoridade da família. A referência de 'como se lidera'. Conflitos: orgulho familiar, legado."
  carmico_espiritual: "O Sol no mapa indica onde a alma veio brilhar. Casa/signo do Sol = missão kármica de expressão autêntica. Não é destino — é inclinação para desenvolver."

camada_tecnica_e_limites:
  regra: "O motor deve calcular longitude solar, casa, dignidade e aspectos. O Sol não recebe rótulos impossíveis à sua definição, como combusto ou feral quando a regra exige ausência de aspectos com outros planetas e o consenso do projeto o exclui."
  limites: "Coração, pressão e olhos são correspondências históricas, não diagnóstico. Self, missão, tarot e mitos são camadas interpretativas atribuídas."
referencias:
  primarias: ["Ptolemeu, Tetrabiblos, I.4 e I.17-19.", "William Lilly, Christian Astrology (1647), pp. 69-71.", "Agrippa, De occulta philosophia, I.23-24 e II.10."]
  secundarias: ["Dane Rudhyar, The Astrology of Personality (1936), leitura humanista moderna do Sol."]
