tipo: "Atlas Simbólico"
subtema: "Correspondências do Sol"

origens_e_divergencias:
  tradicional: "O Sol rege Leão e exalta-se em Áries; significa rei, autoridade, honra, luz, vitalidade, pai em certos contextos e centro de visibilidade. Agrippa registra ouro e repertórios solares."
  moderna: "Rudhyar e linhas psicológicas enfatizam identidade, vontade e Self; linhas evolutivas podem falar em propósito da alma. Essas leituras ampliam, mas não substituem, o julgamento técnico."
  nota: "Apolo e Hélio são distintos na religião grega, embora Apolo tenha sido progressivamente solarizado. Pai/mãe solar, missão e Self variam por escola e contexto."

origem_linguistica_mito_glifo:
  etimologia: "Sol vem do latim sol; Hḗlios é o deus/astro grego e Shamash o solar mesopotâmico ligado à justiça."
  mito: "Hélio conduz o carro solar; Rá atravessa o ciclo diurno e noturno; Amaterasu recolhe-se à caverna. Comparações mostram motivos solares sem apagar diferenças culturais."
  glifo: "☉, círculo com ponto central, tornou-se a imagem gráfica do centro luminoso."
  porque: "Fonte aparente de luz e organizador do dia e das estações, o Sol fundamenta centro, visibilidade, realeza, vida e medida do tempo."

