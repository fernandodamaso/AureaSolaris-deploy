revisao_editorial:
  origem_e_linguagem: "Touro vem do latim taurus, 'touro'; o signo tropical de 30° não é a constelação de Touro."
  mito_arquetipo_e_porque: "Corpo, fertilidade, solo, ruminação e valor fazem uma rede simbólica; o touro aparece em mitos distintos, que devem conservar atribuição cultural."
  limite_tecnico: "Vênus é regente tradicional. Recursos, prazer e estabilidade não se concluem de um signo isolado nem substituem casas, dignidade e aspectos."
