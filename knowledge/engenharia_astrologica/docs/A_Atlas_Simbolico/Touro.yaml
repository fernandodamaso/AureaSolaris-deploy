camada_energetica:
  impressao_mental: "A mente que CONSTRUI e VALORIZA. Pensamento lento, sensorial, pragmático."
  permeacao_emocional: "Segurança emocional através do corpo e dos sentidos. Quando saudável: prazer. Quando ferido: apego, medo de perder."
  manifestacao_externa: "Eventos PROVÁVEIS de ganhos, construções, casamentos, aquisições. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a CONSTRUIR SEM APEGAR. Touro é a terra, não a prisão."

tarot_relacionado:
