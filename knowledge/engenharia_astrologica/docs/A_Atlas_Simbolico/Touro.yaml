  conexao: "Touro é o Ás de Ouros: início material, semente de prosperidade, estabilidade que cresce."

foco_especial:
  infantil: "A criança Touro precisa de rotina, conforto, toque, alimentação boa. Mudanças bruscas a assustam."
  familiar: "O membro que sustenta a família financeiramente. O que traz estabilidade. Conflitos: possessividade."
  carmico_espiritual: "Touro indica a LIÇÃO DE VALOR. Casa Touro = onde a pessoa aprende a construir recursos e prazer."

