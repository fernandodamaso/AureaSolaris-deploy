revisao_editorial:
  origem_e_linguagem: "Gêmeos vem do latim gemini, 'gêmeos'. O nome do signo tropical e a constelação não são sinônimos astronômicos."
  mito_arquetipo_e_porque: "Dupla, troca, espelho e mensageiro oferecem porquês simbólicos; Castor e Pólux pertencem a uma narrativa grega específica, não a origem única de toda leitura."
  limite_tecnico: "Mercúrio é regente tradicional; comunicação, mobilidade e multiplicidade não podem ser concluídas de um signo isolado."
referencias:
  primarias:
    - "Ptolomeu. Tetrabiblos, livro I: signos e qualidades, conforme edição declarada."
  secundarias:
    - "Rudhyar, Dane. The Astrological Signs: The Pulse of Life. Harper & Row, 1971."
  tecnicas:
    - "Ver 02_Astronomia/Zodiaco_Tropical.yaml e 04_Planetas/Mercurio.yaml."
camada_energetica:
  impressao_mental: "A mente que CONECTA e MUDA. Curiosidade, versatilidade, 'e se?'."
  permeacao_emocional: "Rapidez emocional, troca constante. Quando saudável: diálogo. Quando ferido: ansiedade, dispersão."
  manifestacao_externa: "Eventos PROVÁVEIS de viagens curtas, encontros, aprendizado, mudanças. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a ESCOLHER UM FOCO. Gêmeos aprende tudo, mas precisa de raiz."

tarot_relacionado:
  carta: "Os Gêmeos (VI de Ouros) / O Mago (I)"
  conexao: "Gêmeos é versatilidade pura, múltiplas vozes, aprendizado constante."

foco_especial:
  infantil: "A criança Gêmeos adora perguntar, aprender, se comunicar. Precisa de estímulo, variedade."
  familiar: "O irmão, o primo, o que traz notícias."
  carmico_espiritual: "Gêmeos indica a LIÇÃO DE COMUNICAÇÃO. Casa Gêmeos = onde a pessoa aprende a ouvir e falar."

