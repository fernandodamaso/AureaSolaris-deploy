revisao_editorial:
  origem_e_linguagem: "A quinta casa é sucessiva e reúne, em tradições de casas, filhos, prazer, criação, jogos e emissões; 'trono' e criação são imagens pedagógicas."
  mito_arquetipo_e_porque: "Palco, obra, fertilidade e brincadeira formam o porquê simbólico, sem transformar desejo de filhos ou talento em destino obrigatório."
  limite_tecnico: "A analogia com Leão/Sol é moderna. Filhos, gestação e projetos requerem método, contexto e nunca diagnóstico/prognóstico determinista."
referencias:
  primarias:
    - "Lilly, William. Christian Astrology. 1647, livro II: significações da quinta casa."
  secundarias:
    - "Houlding, Deborah. The Houses: Temples of the Sky. The Wessex Astrologer, 1996."
  tecnicas:
    - "Distinguir técnica natal, horária e eletiva antes de aplicar as significações."
camada_energetica:
  impressao_mental: "A mente que CRIA e AMA. Prazer, expressão, 'o que eu faço por amor?'."
  permeacao_emocional: "Alegria e paixão. Quando saudável: criatividade. Quando ferido: drama, ego inflado."
  manifestacao_externa: "Eventos PROVÁVEIS de criação, nascimentos, romance, jogos. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a CRIAR SEM MEDO. Casa 5 é a vida que se expressa, não o espetáculo."

