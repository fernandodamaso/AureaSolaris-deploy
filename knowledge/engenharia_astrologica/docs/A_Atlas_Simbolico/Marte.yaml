camada_energetica:
  impressao_mental: "A mente que AGE primeiro. Impulso, 'vamos lá', urgência de começar."
  permeacao_emocional: "Entusiasmo quente e rápido. Paixão de estouro, não de sustentação."
  manifestacao_externa: "Eventos PROVÁVEIS de ação, disputas, acidentes por pressa. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a MIRAR antes de disparar. Marte precisa de causa, não de violência vazia."

tarot_relacionado:
  carta: "O Carro (VII)"
  conexao: "O Carro é Marte: vontade pura, direção, impulso controlado. Dois cavalos = dualidade do impulso."

foco_especial:
  infantil: "A criança Marte é quem chega primeiro, a pioneira. Precisa de desafio e movimento, não de contenção excessiva."
  familiar: "O membro que puxa a família para a ação. Conflitos diretos, mas que passam rápido."
  carmico_espiritual: "Marte indica a LIÇÃO DE CORAGEM da alma. Casa Marte = onde a pessoa precisa agir e defender."

camada_tecnica_e_limites:
  regra: "Julgar Marte por secto, dignidade, casa, velocidade, relação solar, recepção e aspectos; não inferir acidente ou cirurgia isoladamente."
  limites: "Febre, inflamação, corte e queimadura são correspondências históricas, não diagnóstico. Tarot, pedras e leitura cármica são camadas atribuídas."
referencias:
