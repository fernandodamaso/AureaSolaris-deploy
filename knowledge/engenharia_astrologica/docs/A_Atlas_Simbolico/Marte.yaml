origens_e_divergencias:
  tradicional: "Marte rege Áries e Escorpião e exalta-se em Capricórnio. Quente e seco, significa corte, guerra, fogo, coragem e conflito; secto, dignidade, casa e aspectos definem como atua. Agrippa registra ferro e repertórios marciais."
  moderna: "Linhas psicológicas enfatizam desejo, assertividade, separação e defesa de limites; linhas evolutivas podem falar em lição de coragem."
  nota: "Correção: Escorpião é domicílio tradicional, não exaltação. Ares grego e Mars romano não são equivalentes culturais exatos."

origem_linguistica_mito_glifo:
  etimologia: "Marte vem de Mars, divindade romana de etimologia remota incerta."
  mito: "Ares encena o furor da batalha; Mars também protege a ordem cívica e agrícola. Perseu e Hércules são heróis comparáveis, não personificações de Marte."
  glifo: "♂ é o sinal planetário de Marte, posteriormente usado para o masculino; círculo e seta alimentam leituras modernas."
  porque: "A aparência avermelhada e o deus guerreiro sustentam analogias com sangue, calor, ferro, corte e impulso."

