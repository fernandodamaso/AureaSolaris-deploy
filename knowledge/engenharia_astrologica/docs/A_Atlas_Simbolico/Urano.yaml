camada_energetica:
  impressao_mental: "A mente que INOVA e LIBERTA. Insights súbitos, rupturas de padrão, electricidade mental."
  permeacao_emocional: "Liberdade interior. Quando saudável: originalidade. Quando ferido: rebeldia, solidão por ser 'diferente'."
  manifestacao_externa: "Eventos PROVÁVEIS de rupturas, inovações, encontros súbitos. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a CANALIZAR a electricidade. Urano sem filtro causa curto-circuito."

tarot_relacionado:
  carta: "O Louco (Arcano Maior 0)"
  conexao: "O Louco é Urano: passo no vazio, ruptura, confiança no desconhecido, gênio que não vê limites."

foco_especial:
  infantil: "A criança Urano é o gênio incompreendido. Precisa de liberdade, estímulo intelectual, espaço para ser diferente."
  familiar: "O membro 'estranho' da família. O que traz inovação ou desestrutura."
  carmico_espiritual: "Urano indica a LIÇÃO DE LIBERDADE. Casa Urano = onde a pessoa deve inovar e libertar."

camada_tecnica_e_limites:
  regra: "O motor só deve usar Urano quando habilitado e registrar se Aquário segue Saturno tradicional, Urano moderno ou co-regência; nenhuma variante pode ser silenciosa."
  limites: "Sistema nervoso, insônia e choques são correspondências modernas, não diagnóstico. Tarot, oitavas, pedras e leituras cármicas exigem atribuição."
referencias:
  primarias: ["William Herschel, 'Account of a Comet', Philosophical Transactions of the Royal Society 71 (1781); fonte da descoberta, antes do reconhecimento orbital como planeta."]
  secundarias: ["James Holden, A History of Horoscopic Astrology (1996), contexto dos planetas modernos.", "Dane Rudhyar, The Astrology of Personality (1936), recepção humanista de Urano."]
