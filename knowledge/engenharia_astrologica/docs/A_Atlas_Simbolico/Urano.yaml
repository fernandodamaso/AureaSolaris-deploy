tipo: "Atlas Simbólico"
subtema: "Correspondências de Urano"

origens_e_divergencias:
  tradicional: "Urano foi reconhecido como planeta por William Herschel em 1781 e não integra os sete planetas da astrologia antiga. Aquário permanece domicílio de Saturno no esquema tradicional."
  moderna: "Autores modernos ligam Urano a Aquário, ruptura, invenção, reforma, eletricidade, independência e eventos súbitos; escolas divergem sobre regência, co-regência e peso interpretativo."
  nota: "Não há dia semanal tradicional próprio: sábado pertence a Saturno. Urânio, eletricidade, computadores, plantas, pedras e anatomia são correspondências modernas, não consenso."

origem_linguistica_mito_glifo:
  etimologia: "O planeta recebeu o nome latinizado Uranus, do grego Ouranos, o Céu primordial."
  mito: "Ouranos é castrado por Cronos — não castra a si mesmo. Prometeu é uma analogia moderna de rebelião e fogo técnico, não identidade com Ouranos."
  glifo: "⛢ é um glifo astrológico moderno; ♅, com H em homenagem a Herschel, também é usado. A coexistência deve ser preservada."
  porque: "A própria descoberta ampliou a fronteira conhecida do sistema solar; o período revolucionário e posteriores associações à eletricidade sustentaram ruptura e inovação."

