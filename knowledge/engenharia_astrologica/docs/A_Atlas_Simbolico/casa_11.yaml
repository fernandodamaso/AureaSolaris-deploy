status: draft
id: "casa_11_atlas"
nome: "Casa 11 — O Clã / O Futuro Coletivo"
tradicoes:
  - "atlas simbolico editorial"
  - "sintese multiescola"
tipo: "Atlas Simbólico"
subtema: "Correspondências da Casa 11"

origens_e_divergencias:
  tradicional: "Na tradição helenística, a Casa 11 é o Bom Daimon, ligada a aliados, amigos, esperança e benefícios; Ptolomeu é uma testemunha posterior, não a única fonte."
  moderna: "A astrologia moderna amplia a Casa 11 para grupos, redes, causas e futuro coletivo; a associação com Urano é uma releitura do século XX, não uma dignidade tradicional."
  divergencias: "‘Amigos e benfeitores’ (helenística/medieval), ganhos derivados da carreira (derivação moderna) e revolução/tecnologia (moderna) são camadas diferentes; declarar a escola."
  nota: "Urano, doenças nervosas e tecnologias não são significados antigos da Casa 11."

atlas_simbolico:
  pessoas_arquetipos: "O amigo, o grupo, o visionário, o inovador coletivo"
  lugares_fisicos: "Clubes, associações, redes, comunidades"
  objetos_materia: "Bandeiras, símbolos de grupo, redes, computadores"
  eventos_tipicos: "Fundações de grupos, amizades, projetos coletivos"
  animais: "Abelha, formiga, lobo (alcateia), ave migratória"
  plantas_ervas: "Trevo de quatro folhas, hera, orquídea rara"
  metais_pedras: "Urânio, zircônio, ametista, fluorita"
  cores_sons:
    cores: ["Azul-elétrico", "violeta", "prata-luz"]
    sons: ["Zumbido eléctrico", "vento forte", "bip"]
  numeros: [11]
  dias_semana: ["Sábado"]
  doencas_corpo:
    doencas: ["Problemas nervosos", "choques eléctricos"]
    partes_corpo: ["Sistema nervoso autônomo", "cérebro", "panturrilhas"]
  arquetipos_mitologicos:
    - "Prometeu (revolucionário)"
    - "Urano (céu)"
    - "Atlas (sustentação do grupo)"
  mitos_historias: "Prometeu roubando o fogo; Atlas carregando o céu"
  sonhos_simbolos_inconsciente: "Grupos, amizades, futuros coletivos"
  expressao_elevada_sombra: "Elevada: amizade autêntica, visão coletiva | Sombra: tribo exclusiva, rebeldia de grupo, fuga da individualidade"

camada_energetica:
  impressao_mental: "A mente que VÊ O FUTURO COLETIVO. 'O que nós construímos?'."
  permeacao_emocional: "Amizade como pertencimento. Quando saudável: comunidade. Quando ferido: exclusão, solidão em grupo."
  manifestacao_externa: "Eventos prováveis de encontros de grupo, projetos coletivos, inovações. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a PERTENCER SEM PERDER A SI. Casa 11 é o clã, não a manada."

ver_mais:
  - "../05_Casas/Casa_11.yaml"

referencias:
  - autor: "Vettius Valens"
    obra: "Anthology"
    natureza: "fonte primária helenística"
    localizador: "Livros II–IV, tópicos de casas, amigos, esperança e testemunhos."
  - autor: "Claudius Ptolemy"
    obra: "Tetrabiblos"
    natureza: "fonte primária greco-romana"
    localizador: "Livro III, significações derivadas das casas; consultar a edição utilizada."
  - autor: "Robert Hand"
    obra: "The Houses: Temples of the Sky"
    natureza: "síntese moderna ocidental"
    localizador: "Discussão moderna das casas e sua evolução de significados."

