subtema: "Correspondências de Saturno"

origens_e_divergencias:
  tradicional: "Saturno rege Capricórnio e Aquário e exalta-se em Libra. Frio e seco, significa tempo, limite, velhice, trabalho, isolamento e permanência; secto, dignidade, casa e recepção modulam o juízo."
  moderna: "Linhas psicológicas enfatizam medo, autoridade, responsabilidade e amadurecimento; karma estruturante é formulação moderna/esotérica."
  nota: "Correção: Aquário é domicílio tradicional, não exaltação. Cronos e Saturnus foram identificados, mas a divindade romana também guarda semeadura e Idade do Ouro."

origem_linguistica_mito_glifo:
  etimologia: "Saturnus tem etimologia discutida; a associação com satus, semeadura, é tradicional, mas não consenso filológico."
  mito: "Cronos devora os filhos e é deposto; Saturno preside uma Idade do Ouro. Hades e Anúbis são analogias, não identidades saturninas."
  glifo: "♄ vem da tradição gráfica planetária; foice ou cruz sobre matéria são leituras posteriores."
  porque: "Como planeta visível mais lento e limite do cosmos clássico, Saturno tornou-se imagem de duração, fronteira, necessidade e maturação."

