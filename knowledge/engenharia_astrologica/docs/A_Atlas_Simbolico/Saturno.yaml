camada_energetica:
  impressao_mental: "A mente que ESTRUTURA e LIMITA. Tempo, regra, maturidade, 'o que dura'."
  permeacao_emocional: "Medo e responsabilidade. Quando saudável: serenidade. Quando ferido: depressão, isolamento."
  manifestacao_externa: "Eventos PROVÁVEIS de concretização, limitações, contratos, maturidade. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a CONSTRUIR COM REALISMO. Saturno é a prova: o que aguenta o tempo, aguenta tudo."

tarot_relacionado:
  carta: "A Roda da Fortuna no aspecto sombra / O Eremita (IX)"
  conexao: "O Eremita é Saturno: tempo, solitude, sabedoria que vem com idade."

foco_especial:
  infantil: "A criança Saturno é precocemente responsável. Precisa de limites CLAROS, não de abandono."
  familiar: "O patriarca/matriarca que estrutura. O que ensina a lidar com tempo e realidade."
  carmico_espiritual: "Saturno indica a LIÇÃO DE MATURIDADE. Casa Saturno = onde a pessoa aprende a crescer pelo esforço."

camada_tecnica_e_limites:
  regra: "Julgar Saturno por secto, dignidade, casa, velocidade, relação solar, recepção e aspectos; não produzir automaticamente morte, depressão ou punição."
  limites: "Correspondências corporais são históricas, não diagnóstico. Tarot, karma, pedras e mitos comparados não são regra computável."
referencias:
