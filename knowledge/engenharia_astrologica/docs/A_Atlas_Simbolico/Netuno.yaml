subtema: "Correspondências de Netuno"

origens_e_divergencias:
  tradicional: "Netuno foi observado como planeta em 1846 e não integra os sete planetas da astrologia helenística, medieval ou renascentista. Peixes permanece domicílio de Júpiter no esquema tradicional."
  moderna: "Autores modernos associam Netuno a Peixes, imaginação, dissolução, ideal, êxtase, engano, arte e espiritualidade; o uso e a regência não são unânimes."
  nota: "Não existe dia da semana planetário tradicional para Netuno; quinta-feira pertence a Júpiter. Correspondências minerais, vegetais e corporais são repertórios modernos variáveis."

origem_linguistica_mito_glifo:
  etimologia: "O planeta recebeu o nome do romano Neptunus, assimilado ao grego Poseidon, por convenção astronômica moderna."
  mito: "Poseidon/Netuno governa mares, terremotos e cavalos; Dioniso e Oceano são analogias de êxtase ou vastidão, não identidades com Netuno."
  glifo: "♆ estiliza o tridente de Netuno/Poseidon."
  porque: "O nome marítimo, a cor azul observada e a recepção romântica/espiritualista favoreceram água, indistinção, inspiração e dissolução."

