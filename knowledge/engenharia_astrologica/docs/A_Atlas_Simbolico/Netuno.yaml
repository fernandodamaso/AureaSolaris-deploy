camada_energetica:
  impressao_mental: "A mente que TRANSCENDE e DISSOLVE. Fronteiras tênues, imaginação pura, 'o que não se vê'."
  permeacao_emocional: "Amor universal e compaixão infinita. Quando saudável: criatividade. Quando ferido: vitimização, vazio."
  manifestacao_externa: "Eventos PROVÁVEIS de inspiração, encontros com o invisível, dissoluções. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a DAR NOME ao que é invisível. Netuno precisa de canal (arte, serviço), senão causa ilusão."

tarot_relacionado:
  carta: "O Louco (alternativa) / O Mago da fantasia"
  conexao: "Netuno dissolve fronteiras — o Louco pula sem ver, Netuno deixa de ver para crer."

foco_especial:
  infantil: "A criança Netuno é sensível, artística, vê o invisível. Precisa de proteção contra 'dureza' prematura."
  familiar: "O membro que traz arte, espiritualidade ou sofrimento oculto."
  carmico_espiritual: "Netuno indica a LIÇÃO DE ENTREGA. Casa Netuno = onde a pessoa aprende a confiar no invisível."

camada_tecnica_e_limites:
  regra: "O motor só deve usar Netuno quando a escola/configuração o habilitar; deve preservar Júpiter como regente tradicional de Peixes e registrar a variante moderna."
  limites: "Vícios, alergias e saúde mental são correspondências astrológicas modernas, não diagnóstico. Tarot, oitavas, pedras e experiências do invisível exigem atribuição."
referencias:
  primarias: ["Urbain Le Verrier, carta de 31 de agosto de 1846 e comunicações sobre a posição do novo planeta; fonte histórica da descoberta, não texto astrológico."]
  secundarias: ["James Holden, A History of Horoscopic Astrology (1996), contexto histórico dos planetas modernos.", "Robert Hand, Horoscope Symbols (1981), recepção astrológica moderna de Netuno."]
