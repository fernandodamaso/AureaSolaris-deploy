  mito_arquetipo_e_porque: "Caverna, solo, ancestralidade e lar oferecem imagens de enraizamento; não provam uma história familiar ou origem social determinada."
  limite_tecnico: "A analogia com Câncer/Lua é moderna. O sistema de casas e a distinção entre IC e cúspide devem ser declarados."
