origens_e_divergencias:
  tradicional: "'Salomônica' designa famílias textuais medievais e modernas atribuídas a Salomão; Goetia, grimórios, magia cerimonial e hermetismo têm sobreposições, mas não são sinônimos."
  moderna: "Releituras psicológicas e ocultistas contemporâneas devem ser datadas e não legitimam uma genealogia direta para a maçonaria."
  nota: "Conteúdo histórico e simbólico, não manual de prática. Qualquer relação com correntes iniciáticas ou maçonaria deve indicar transmissão documental específica, não apenas semelhança de símbolos."

