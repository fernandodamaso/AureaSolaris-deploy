  permeacao_emocional: "Poder como responsabilidade. Quando saudável: serviço. Quando ferido: manipulação."
  manifestacao_externa: "Eventos prováveis de transformação, proteção, invocação. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a USAR A MAGIA COM ÉTICA. Magia não é controle — é cooperação."

