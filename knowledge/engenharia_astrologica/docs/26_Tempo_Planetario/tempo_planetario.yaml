  tradicional: "Tempo planetário reúne técnicas distintas — dias, horas, cronocratores e eleições — que não devem ser calculadas como uma regra única."
  moderna: "Planejamento cotidiano é uso contemporâneo e precisa declarar qual técnica foi aplicada."
  nota: "Este é índice de estudo: cada saída deve informar técnica, parâmetros, escola e fonte."

