como_usar: |
  Dias planetários:
  - Sábado = Saturno (estrutura, limites)
  - Quinta-feira = Júpiter (expansão, fé)
  - Terça-feira = Marte (ação, coragem)
  - Domingo = Sol (vontade, identidade)
  - Sexta-feira = Vênus (amor, beleza)
  - Quarta-feira = Mercúrio (comunicação, aprendizado)
  - Segunda-feira = Lua (nutrição, emoção)

  Horas planetárias:
  - Seguem ordem inversa dos dias
  - 1ª hora = planeta do dia
  - 2ª hora = próximo planeta
  - ...até completar 7, depois repetir ordem inversa para 24

