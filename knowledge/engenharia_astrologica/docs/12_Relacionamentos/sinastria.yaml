camada_energetica:
  impressao_mental: "Sinastria é o DIÁLOGO entre dois mapas. 'O que eu ativo em você?'."
  permeacao_emocional: "Amor como espelho. Quando saudável: crescimento mútuo. Quando ferido: apego."
  manifestacao_externa: "Eventos prováveis de encontros, uniões, separações. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a VER O RELACIONAMENTO COMO ESPELHO. Sinastria não é 'compatibilidade' — é 'como eu cresço contigo'."

como_usar: |
  1. Confirmar dados natais e convenções compartilhadas de zodíaco, casas, nós e orbes.
  2. Comparar interaspectos entre planetas, luminares, ângulos e pontos escolhidos.
  3. Ler a sobreposição de casas separadamente da leitura por aspecto.
  4. Declarar a camada adotada: técnica descritiva, psicológica, sistêmica ou cármica.
  5. Não substituir a leitura natal individual pelo mapa relacional.
