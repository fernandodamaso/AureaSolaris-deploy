camada_energetica:
  impressao_mental: "Sobreposição de casas = 'onde eu entro na sua vida e você entra na minha'."
  permeacao_emocional: "Amor como território compartilhado. Quando saudável: troca. Quando ferido: invasão."
  manifestacao_externa: "Eventos prováveis de encontros, uniões, separações. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a RESPEITAR O TERRITÓRIO DO OUTRO. Sobreposição não é posse."

como_usar: |
  1. Sobreponha os dois mapas: planeta de A na casa de B.
  2. Leia: 'meu Sol está na sua Casa 7 = eu brilho no seu relacionamento'.
  3. Planetas nas casas do outro = áreas de ativação mútua.
  4. SEMPRE como tendência, não como sentença.

