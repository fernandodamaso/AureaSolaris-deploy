status: review
id: "sobreposicao_casas"
nome: "Sobreposição de Casas"
tradicoes:
  - "moderna ocidental"
  - "relacional"
tipo: "Relacionamentos"
subtema: "Mapas em diálogo — casas"

origens_e_divergencias:
  tradicional: "A sobreposição de casas, tal como praticada na sinastria contemporânea, não é uma técnica helenística padronizada; significadores relacionais tradicionais têm outra lógica."
  moderna: "Sinastria por casas é prática moderna ocidental e depende de dados natais, sistema de casas e política de orbes declarados."
  nota: "Descreve uma hipótese de ênfase simbólica entre duas cartas, não a intenção, o caráter ou o destino da outra pessoa."

referencias:
  - autor: "Ronald C. Davison"
    obra: "Synastry: Understanding Human Relations through Astrology"
    natureza: "fonte moderna relacional"
    localizador: "Métodos comparativos de duas cartas; conferir edição utilizada"
  - autor: "Faculty of Astrological Studies"
    obra: "The Astrology of the Family"
    natureza: "fonte contemporânea de estudo"
    localizador: "Contexto relacional e familiar; não confundir com regra histórica universal"

