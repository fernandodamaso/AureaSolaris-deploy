  permeacao_emocional: "Composite tende a descrever a terceira entidade simbólica; Davison, uma carta relacional situada."
  manifestacao_externa: "O valor maior está em comparar pressupostos antes de comparar interpretações."
  como_guiar_o_astral: "Ensinar a escolher o método, não apenas a interpretar o resultado."

como_usar: |
  Composite:
  1. Calcular midpoint planetário entre fatores equivalentes dos dois mapas.
  2. Ler a carta resultante como entidade simbólica do vínculo.

  Davison:
  1. Calcular midpoint real de tempo e de lugar entre os dois nascimentos.
  2. Erguer uma carta relacional própria para esse instante e local medianos.

  Regra editorial:
  - Escolher conscientemente qual pergunta cada método responde.
  - Não usar Davison como substituto improvisado de composite nem o contrário.

