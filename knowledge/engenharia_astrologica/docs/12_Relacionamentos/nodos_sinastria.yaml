status: review
id: "nodos_sinastria"
nome: "Nodos em Sinastria"
tradicoes:
  - "moderna ocidental"
  - "relacional"
tipo: "Relacionamentos"
subtema: "Eixo nodoso como ponte cármica"

origens_e_divergencias:
  tradicional: "Nodos possuem usos antigos ligados a eclipses e condições do mapa, mas a linguagem de reencarnação e 'missão da alma' não é consenso da tradição ocidental histórica."
  moderna: "Leituras nodais cármicas/evolutivas são linhas modernas, com pressupostos espirituais próprios e autores declarados."
  nota: "Em sinastria, tratar a ligação nodal como hipótese simbólica da escola escolhida; não concluir passado compartilhado, obrigação ou destino relacional."

referencias:
  - autor: "Martin Schulman"
    obra: "Karmic Astrology: The Moon's Nodes and Reincarnation"
    ano: 1975
    natureza: "fonte moderna cármica"
    localizador: "Linguagem nodal e pressuposto reencarnacionista"
  - autor: "Steven Forrest"
    obra: "Yesterday's Sky: Astrology and Reincarnation"
    ano: 2008
    natureza: "fonte moderna evolutiva"
    localizador: "Leitura moderna de Nodos; não usar como fonte da doutrina helenística"

