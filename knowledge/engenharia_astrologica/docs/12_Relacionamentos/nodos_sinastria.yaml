camada_energetica:
  impressao_mental: "Nodos em sinastria = 'qual é a missão deste relacionamento?'."
  permeacao_emocional: "Busca de sentido no relacionamento. Quando saudável: direção clara. Quando ferido: desvio."
  manifestacao_externa: "Eventos prováveis de encontros com missão, mudanças de direção. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a SEGUIR O NODO NORTE JUNTOS. O relacionamento é um CAMINHO, não uma prisão."

como_usar: |
  1. Nodo Norte de A na casa/planeta de B = missão de A através de B.
  2. Nodo Norte de B na casa/planeta de A = missão de B através de A.
  3. Nodos Sul em sinastria = passado compartilhado.
  4. SEMPRE como tendência, não como sentença.

