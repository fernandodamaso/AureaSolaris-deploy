como_usar: |
  1. Reunir data, hora e lugar corretos dos dois nascimentos.
  2. Calcular o ponto médio cronológico entre as duas datas e horas.
  3. Calcular o ponto médio geográfico entre as duas localidades.
  4. Erguer a carta para esse instante e esse lugar medianos.
  5. Ler a carta resultante como mapa relacional próprio, sem confundi-la com composite.

