camada_energetica:
  impressao_mental: "Marte é AÇÃO e FRONTEIRA — a mente 'avança' ou 'defende'."
  permeacao_emocional: "Raiva, coragem, impulso."
  manifestacao_externa: "Estilo vermelho/preto; tende a ser atlético ou ter 'cara de luta'. Arquétipos: o Guerreiro. Inclinação, não destino."
  como_guiar_o_astral: "Marte pede CANAL — a pessoa precisa de esporte/arte/luta, senão a raiva 'encarna'."

porque_simbolico: |
  FERRO = metal da GUERRA (espadas, armaduras). Vermelho = cor do SANGUE e do FOGO.
  ESPINHO = planta que DEFENDE (como Marte defende). GENGIBRE/PIMENTA = picam como golpe.
  CABEÇA = parte do corpo de Áries (o signo de Marte) — 'cabeça de Áries' = avançar primeiro.

linha_tradicao: "Doutrina das Assinaturas: Marte = ferro, espinho, absinto, vermelho."
