camada_energetica:
  impressao_mental: "Ceres é NUTRIÇÃO e CUIDADO — a mente 'alimenta' o que ama."
  permeacao_emocional: "Amor maternal, cuidado, medo da perda do filho."
  manifestacao_externa: "Estilo verde/amarelo-terra; tende a ter 'cara de nutriz'. Arquétipos: a Mãe Terra, a Colheita. Inclinação, não destino."
  como_guiar_o_astral: "Ceres pede CUIDADO — a pessoa 'dá de si' e precisa aprender a RECEBER."

porque_simbolico: |
  CERES = deusa da AGRICULTURA e da COLHEITA — TRIGO/MILHO são os frutos dela.
  VERDE-TERRA = cor da terra FÉRTIL. AMARELO-TRIGO = cor do grão maduro.
  ÚTERO = 'terra que gesta' (Ceres = mãe que nutre o filho na terra/útero).

linha_tradicao: "Doutrina das Assinaturas moderna: Ceres = trigo, romã, útero, fertilidade."
chakra_nota: "Overlay sincretico."
tradicoes:
  - "astrologia moderna de asteroides"
  - "mitologia greco-romana"
  - "correspondências simbólicas editoriais"
revisao_editorial:
  atribuicao: "Ceres é deusa romana da agricultura; o corpo celeste 1 Ceres foi descoberto em 1801. Trigo, romã, cuidado e cultivo são associações míticas/modernas, não parte do septenário clássico."
  limite: "Útero, digestão e gestação são imagens simbólicas de nutrição; não são diagnóstico, prognóstico ou regra médica. Cores, cobre e plantas não formam tabela canônica única."
  chakra: "Overlay sincrético contemporâneo, não doutrina da astrologia ocidental nem equivalência tântrica canônica."
