status: review
id: simbolos_graficos
nome: Símbolos Gráficos dos Planetas
tradicoes:
- editorial
- simbolica
tema: Cada planeta tem um símbolo (glyph) feito de combinações de Sol, Lua, Marte, Vênus, Mercúrio — explicando o porquê de cada traço
origens_e_divergencias:
  tradicional: Tradição hermética ocidental (glyphs derivados de Sol/Lua/Marte/Vênus/Mercúrio/Saturno/Júpiter).
  moderna: Astrologia psicológica (Liz Greene) — corpo como linguagem simbólica.
  nota: Chakra overlay = sincretismo Nova Era, não canônico.
atlas_simbolico:
  pessoas_arquetipos: escribas, astr?logos, copistas, desenhistas de glifos e selos
  lugares_fisicos: manuscritos, oficinas de escrita, quadros de aula, margens de mapas
  objetos_materia: glifos, sigilos, alfabetos planet?rios, tabelas de s?mbolos
  eventos_tipicos: anota??o de mapas, transmiss?o visual de conceitos, reconhecimento imediato de corpos e pontos
  arquetipos_mitologicos: o sinal que condensa uma for?a, o glifo como chave visual
  expressao_elevada_sombra: 'Elevada: s?ntese visual clara, mem?ria simb?lica | Sombra: decorar sinal sem entender doutrina'
camada_energetica:
  campo_mental: O símbolo é a 'assinatura visual' do planeta — cada traço conta a história do princípio.
  permeacao_emocional: O símbolo carrega o arquétipo em forma compacta — 'ler o glyph é ler o planeta'.
  manifestacao_externa: O símbolo usado em amuletos, talismãs e gráficos ativa a frequência do planeta. Inclinação, não destino.
  como_guiar_o_astral: Usar o símbolo como foco de meditação ou amuleto — cada traço é uma 'nota' do planeta.
base_simbolos: 'Sol (☉) = círculo com ponto = EU, identidade, centro.

  Lua (☽) = crescente = reflexo, emocional, receptividade.

  Marte (♂) = círculo com seta = ação, assertividade, ''avanço''.

  Vênus (♀) = círculo com cruz abaixo = amor, beleza, ''atração''.

  Mercúrio (☿) = círculo com cruz + asas = mente, comunicação, ''transporte''.

  Saturno (♄) = Lua com cruz grande = limite, estrutura, ''peso''.

  Júpiter (♃) = número 4 (Lua + cruz abaixo) = expansão, sorte, ''crescimento''.

  Urano (⛢) = círculo com seta para cima = inovação, ruptura, ''choque''.

  Netuno (♆) = tridente = dissolução, mistério, ''profundidade''.

  Plutão (♇) = círculo com P (Sol + cruz + Lua) = transformação, poder, ''morte/renascimento''.

  Quíron (⚷) = K com seta = ferida curadora, mentor, ''o que dói ensina''.

  Nodos (☊/☋) = duas Luas opostas = eixo cármico, ''passado/futuro''.

  Ceres (⚳) = C com duas linhas = nutrição, colheita, ''cuidado''.

  '
