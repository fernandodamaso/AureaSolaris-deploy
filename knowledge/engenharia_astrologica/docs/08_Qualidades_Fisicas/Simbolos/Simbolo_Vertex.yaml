status: review
id: simbolo_vertex
nome: Símbolo do Vertex — 🔻 (Ponto de Encontro)
planeta: Vertex
significado_visual: '🔻 = TRIÂNGULO PARA BAIXO = o vértice que aponta para a terra = encontro com o outro.

  O triângulo representa a manifestação, o encontro que desce do céu para a terra.

  O Vertex é o ponto onde o meridiano encontra a eclíptica = o lugar do destino.

  Não é planeta, é ponto de encontro = o símbolo representa o ''momento do encontro''.

  '
origem: Símbolo moderno da astrologia de relacionamentos.
