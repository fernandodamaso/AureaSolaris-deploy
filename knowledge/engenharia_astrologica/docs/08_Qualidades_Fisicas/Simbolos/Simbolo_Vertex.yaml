  - "iconografia simbólica editorial"
revisao_editorial:
  origem_do_glifo: "O triângulo usado para Vertex é convenção contemporânea de algumas interfaces e materiais; não há um glifo histórico universal equivalente aos sete planetas."
  curiosidade: "Vertex é ponto geométrico derivado, não corpo celeste; a disponibilidade do símbolo depende de fonte tipográfica e software."
  convencao_nao_tecnica: "O glifo identifica o ponto. O motor deve documentar a fórmula, sistema de casas/localidade e dados de nascimento; o símbolo não cria uma técnica de destino ou encontro."
referencias:
  primarias:
    - "Johndro, L. Edward. Formulações modernas relativas ao Vertex; consultar edição/arquivo declarado."
  secundarias:
    - "Sasportas, Howard. The Twelve Houses. Thorsons, 1987; para contexto moderno de pontos e ângulos, quando aplicável."
  tecnicas:
    - "Unicode não padroniza um glifo astronômico histórico universal para Vertex; a interface deve tratar o ícone como variante visual."
camada_energetica:
  impressao_mental: Símbolo gráfico do planeta/corpo celeste.
