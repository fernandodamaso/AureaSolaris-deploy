origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação moderna de planetas exteriores"
  - "mitologia greco-romana"
  - "astrologia psicológica moderna"
revisao_editorial:
  origem_do_glifo: "♆ foi adotado após a descoberta de Netuno como tridente de Poseidon/Netuno; existiram propostas e variantes de notação no século XIX. A leitura dos 'três mundos' é associação simbólica editorial, não significado técnico do sinal."
  curiosidade: "A escolha do tridente liga nome do planeta à iconografia do deus do mar; a associação astronômica não prova uma doutrina psicológica."
  convencao_nao_tecnica: "O glifo identifica Netuno. Posição e aspectos dependem de efeméride; interpretações modernas devem declarar sua escola."
referencias:
