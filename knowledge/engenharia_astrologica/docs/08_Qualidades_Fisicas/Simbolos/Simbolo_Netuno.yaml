status: review
id: simbolo_netuno
nome: Símbolo de Netuno — ♆ (Tridente)
planeta: Netuno
significado_visual: '♆ = TRIDENTE (três pontas) = o cetro de Netuno (Poseidon, deus dos mares).

  O tridente tem TRÊS PONTAS = três níveis de realidade (céu, terra, mar).

  A haste vertical = o ''eixo'' que conecta os três níveis.

  O tridente é ''arma e cetro ao mesmo tempo'' = Netuno é ''o que dissolve e o que governa''.

  '
interpretacao_esoterica: Netuno é o 'deus do mar' — o tridente é o cetro que GOVERNA as ondas (emoções, inconsciente). As três pontas = os TRÊS MUNDOS (causal, celestial, marinho).
uso_pratico: Meditar no ♆ é lembrar da 'dissolução do ego' — usar como amuleto de espiritualidade, arte, compaixão.
