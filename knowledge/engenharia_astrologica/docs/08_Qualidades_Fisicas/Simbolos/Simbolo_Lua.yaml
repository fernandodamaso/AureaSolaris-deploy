  expressao_elevada_vs_sombra:
    elevada: Nutridor sábio, curador emocional, conectado aos ciclos, que acolhe sem sugar.
    sombra: Dependência emocional, instabilidade de humor, 'mãe que devora', vazio que nunca se sacia.
origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação astronômica e astrológica ocidental"
  - "astrologia helenística e medieval"
  - "iconografia simbólica editorial"
revisao_editorial:
  origem_do_glifo: "☽ é a convenção gráfica do crescente lunar. A explicação como receptividade/taça é leitura simbólica; a orientação visual muda conforme fonte, tipografia, hemisfério e convenção de ilustração."
  curiosidade: "O crescente é uma fase observável e também um emblema religioso/político em múltiplas culturas; nenhuma delas esgota seu uso astrológico."
  convencao_nao_tecnica: "O glifo identifica a Lua; fase, velocidade, latitude e aspectos devem vir de cálculo/efeméride, não da forma do crescente."
