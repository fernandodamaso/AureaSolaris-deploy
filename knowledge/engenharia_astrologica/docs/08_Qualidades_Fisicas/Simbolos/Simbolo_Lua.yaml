status: review
id: simbolo_lua
nome: Símbolo da Lua — ☽ (Crescente)
planeta: Lua
significado_visual: '☽ = CRESCENTE (duas curvas que se abrem) = a fase da Lua que RECEBE a luz do Sol.

  O crescente é ''abertura'' — a mente que RECEBE, não emite.

  A ''cabeça'' do crescente aponta para a direita (na maioria dos sistemas) = direção do tempo, do fluxo.

  '
interpretacao_esoterica: A Lua é o 'espelho que reflete' — o crescente é a taça que RECEBE a luz. Ela não tem luz própria; ela é o que o Sol projeta.
uso_pratico: Meditar no ☽ é lembrar da 'receptividade' — usar como amuleto de intuição.
