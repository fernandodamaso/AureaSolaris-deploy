status: review
id: simbolo_mercurio
nome: Símbolo de Mercúrio — ☿ (Círculo + Cruz + Asas)
planeta: Mercúrio
significado_visual: '☿ = CÍRCULO (mente) + CRUZ (matéria, corpo) + ASAS (transporte, movimento).

  O círculo acima da cruz = a MENTE que está ACIMA do corpo (pensa antes de agir).

  As asas = a MENTE VOADORA, que viaja entre mundos (consciente/inconsciente).

  A cruz na parte inferior = a MENTE que se ENCARNA no corpo.

  '
interpretacao_esoterica: Mercúrio é o 'mensageiro entre mundos' — o círculo é o Céu (mente), a cruz é a Terra (corpo), as asas são o VOO (transporte). Ele é o único planeta que TEM ASAS — porque sua função é CONECTAR.
uso_pratico: Meditar no ☿ é lembrar da 'comunicação' — usar como amuleto de estudo, escrita, negociação.
