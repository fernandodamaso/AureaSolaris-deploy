  - Perder sapatos = perda de mobilidade mental
  - Mapa em branco = falta de direcionamento
  expressao_elevada_vs_sombra:
    elevada: Comunicador claro, curador pela palavra, mediador, que traduz o complexo em simples.
    sombra: Mentiroso, manipulador da palavra, tagarela vazio, ansiedade mental, ladrão de pequenos objetos.
origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação astronômica e astrológica ocidental"
