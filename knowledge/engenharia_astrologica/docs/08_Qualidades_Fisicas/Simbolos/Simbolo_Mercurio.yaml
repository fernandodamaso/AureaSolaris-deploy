revisao_editorial:
  origem_do_glifo: "☿ é o sinal planetário de Mercúrio, normalmente lido em relação ao caduceu/atributos do mensageiro. Círculo, cruz e asas podem servir como leitura pedagógica, mas não têm uma única origem gráfica documentada."
  curiosidade: "O nome romano Mercúrio corresponde a Hermes; o símbolo foi transmitido por tradição manuscrita e tipográfica, com variantes históricas."
  convencao_nao_tecnica: "O glifo identifica Mercúrio. Combustão, retrogradação, velocidade e aspectos são dados calculados, não qualidades extraídas do desenho."
