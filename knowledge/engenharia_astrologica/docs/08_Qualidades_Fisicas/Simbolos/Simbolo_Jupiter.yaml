status: review
id: simbolo_jupiter
nome: Símbolo de Júpiter — ♃ (Número 4 estilizado)
planeta: Júpiter
significado_visual: '♃ = LUAS (crescente) + CRUZ ABAIXO (expansão para a terra).

  O crescente é a ''tigela'' que RECEBE; a cruz é a ''expansão'' que DESCE.

  Juntos = a EXPANSÃO que desce do céu à terra (abundância, sorte, crescimento).

  Alguns veem o número 4 (estrutura, base) — Júpiter estrutura a expansão.

  '
interpretacao_esoterica: Júpiter é o 'céu que desce à terra' — o crescente é a 'tigela da sorte' que RECEBE a luz; a cruz é a 'mão que espalha' na matéria. Ele é o planeta da ABUNDÂNCIA que NÃO retém.
uso_pratico: Meditar no ♃ é lembrar da 'generosidade' — usar como amuleto de sorte, expansão, estudo.
