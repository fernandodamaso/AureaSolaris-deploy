origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação astronômica e astrológica ocidental"
  - "astrologia helenística e medieval"
  - "iconografia simbólica editorial"
revisao_editorial:
  origem_do_glifo: "♃ é um sinal planetário histórico, frequentemente relacionado à inicial grega de Zeus em histórias da notação. A leitura como 'número 4' e a análise de crescente/cruz são mnemônicas simbólicas, não origem gráfica estabelecida."
  curiosidade: "O nome romano Júpiter corresponde ao grego Zeus; a continuidade de nomes não torna todas as imagens posteriores regras antigas."
  convencao_nao_tecnica: "O glifo identifica Júpiter. A interpretação requer posição, condição, aspectos e tradição, não o desenho do símbolo."
