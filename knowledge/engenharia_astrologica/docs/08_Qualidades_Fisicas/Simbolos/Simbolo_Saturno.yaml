  - "iconografia simbólica editorial"
revisao_editorial:
  origem_do_glifo: "♄ é o sinal planetário histórico de Saturno, frequentemente relacionado à inicial grega de Kronos em histórias da notação. Crescente e cruz podem ser úteis como leitura simbólica, mas não são uma origem gráfica consensual."
  curiosidade: "O nome romano Saturno e o grego Kronos têm histórias religiosas e linguísticas próprias; não se deve reduzir o planeta a uma única alegoria do tempo."
  convencao_nao_tecnica: "O glifo identifica Saturno. Sect, dignidade, casa e aspectos são regras calculadas e independem do sinal gráfico."
