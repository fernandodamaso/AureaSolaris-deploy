status: review
id: simbolo_saturno
nome: Símbolo de Saturno — ♄ (Lua com Cruz Grande)
planeta: Saturno
significado_visual: '♄ = CRESCENTE (Lua) + CRUZ GRANDE (cruz de Saturno, mais longa que a de Júpiter).

  A cruz NÃO fica abaixo do crescente, ela CRUZA o crescente = o LIMITE que ATRAVESSA o emocional.

  O crescente é a ''taça'' (emoção); a cruz é o ''fardo'' (limite) que CRUZA a taça.

  Saturno é o ''peso que atravessa o sentimento'' — a estrutura que NÃO deixa o emocional ''transbordar''.

  '
interpretacao_esoterica: Saturno é o 'limite que educa' — a cruz é o 'fardo' que a Lua (emoção) carrega. O símbolo é 'a taça que tem peso' — o emocional com responsabilidade.
uso_pratico: Meditar no ♄ é lembrar do 'tempo e limite' — usar como amuleto de estrutura, paciência, solidez.
