origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação astronômica e astrológica ocidental"
  - "mitologia greco-romana"
  - "iconografia simbólica editorial"
revisao_editorial:
  origem_do_glifo: "♀ é o sinal planetário associado a Vênus e, em uso moderno, ao espelho de Vênus/sexo feminino. A leitura de círculo e cruz como amor/matéria é simbólica e não esgota a história da notação."
  curiosidade: "O emprego do mesmo sinal na biologia é posterior à tradição astronômica e não limita Vênus a gênero, aparência ou papel social."
  convencao_nao_tecnica: "O glifo identifica Vênus. Dignidade, recepção, aspectos e leitura relacional exigem regras e contexto próprios."
