status: review
id: simbolo_venus
nome: Símbolo de Vênus — ♀ (Círculo com Cruz Abaixo)
planeta: Vênus
significado_visual: '♀ = CÍRCULO (espírito) + CRUZ ABAIXO (matéria, corpo, terra).

  O círculo está ACIMA da cruz = o ESPÍRITO (beleza, amor) DOMINA a matéria.

  A cruz é a ''âncora'' — Vênus traz o divino PARA O CORPO (prazer, toque, beleza material).

  Diferença de Mercúrio: Mercúrio tem cruz ABAIXO do círculo (mente encarnada); Vênus tem círculo ACIMA da cruz (espírito que desce à matéria).

  '
interpretacao_esoterica: 'Vênus é o ''divino que desce ao corpo'' — o círculo é o Céu (amor universal), a cruz é a Terra (prazer, toque). O símbolo é ''invertido'' em relação a Marte: Vênus traz o céu à terra; Marte traz a terra ao céu.'
uso_pratico: Meditar no ♀ é lembrar do 'prazer sagrado' — usar como amuleto de amor, arte, beleza.
