origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação moderna de Quíron"
  - "mitologia greco-romana"
  - "astrologia psicológica moderna"
revisao_editorial:
  origem_do_glifo: "⚷ é a forma tipográfica hoje usada para 2060 Chiron. Sua associação visual à chave/monograma é discutida; a leitura como letra K e seta é mnemônica editorial, não explicação histórica encerrada."
  curiosidade: "O objeto 2060 Chiron foi descoberto em 1977 e recebeu o nome do centauro Quíron; mito e objeto astronômico são camadas distintas."
  convencao_nao_tecnica: "O glifo identifica o objeto. Uma leitura de ferida/cura é de escolas modernas e não deve ser inferida automaticamente pelo motor."
