status: review
id: simbolo_quiron
nome: Símbolo de Quíron — ⚷ (K + Seta)
planeta: Quíron
significado_visual: '⚷ = LETRA K (Quíron) + SETA PARA CIMA (o ''sinal de cura'').

  A letra K é o ''nome próprio'' do centauro.

  A seta é a ''direção da cura'' — o ferido que SABE o caminho.

  Juntos = a FERIDA que VIRA SETA (o que dói aponta para a cura).

  '
interpretacao_esoterica: Quíron é o centauro FERIDO que não pode morrer — o símbolo é o 'K de Khaos' (o buraco, a ferida) com a seta que 'aponta para cima' (a cura). A ferida É O CAMINHO.
uso_pratico: Meditar no ⚷ é lembrar da 'ferida curadora' — usar como amuleto de cura, mentorado, missão.
