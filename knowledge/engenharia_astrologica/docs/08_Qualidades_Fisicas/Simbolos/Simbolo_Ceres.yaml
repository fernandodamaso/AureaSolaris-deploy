status: review
id: simbolo_ceres
nome: Símbolo de Ceres — ⚳ (Foice + Cruz)
planeta: Ceres
significado_visual: '⚳ = FOICE (colheita, Deméter/Ceres) + CRUZ (matéria, terra, corpo).

  A foice representa a deusa da agricultura que ceifa o trigo = nutrir, colher, ciclo de vida.

  A cruz representa a matéria que é trabalhada = o corpo que cultiva.

  Junção = foice + cruz = o ato de **nutrir a matéria**. Ceres é o planeta da mãe que alimenta, da terra que dá fruto.

  '
origem: Glifo proposto em 1801, aprovado pela IAU como símbolo de Ceres (1 Ceres).
