origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação astronômica e astrológica moderna"
  - "mitologia greco-romana"
  - "iconografia simbólica editorial"
revisao_editorial:
  origem_do_glifo: "⚳ é a forma tipográfica moderna usada para Ceres; a foice remete iconograficamente a Ceres/Deméter e à agricultura. A decomposição 'foice + cruz' é leitura simbólica do caderno, não etimologia gráfica comprovada."
  curiosidade: "Ceres foi o primeiro asteroide/planeta menor descoberto (1801); sua adoção em mapas é muito posterior ao repertório dos sete planetas tradicionais."
  convencao_nao_tecnica: "O glifo identifica o objeto/ponto no mapa. Ele não altera cálculo, orbes, dignidades ou significadores sem regra de escola declarada."
