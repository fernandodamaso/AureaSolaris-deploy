status: review
id: simbolo_urano
nome: Símbolo de Urano — ⛢ (Sol + Cruz + Duas Luas)
planeta: Urano
significado_visual: '⛢ = CÍRCULO (Sol) + CRUZ (matéria) + duas LUAS CRESCENTES (duplo reflexo, dupla realidade).

  O círculo é o EU; a cruz é a MATÉRIA; as duas luas são os DOIS REFLEXOS (duas realidades, duas camadas).

  Urano é o planeta que ''dobra a realidade'' — ele tem DOIS reflexos, como se ''tudo fosse ao mesmo tempo''.

  Outra leitura: Sol + Marte (seta) → Urano é o ''Sol que avança'' (inovação, ruptura).

  '
interpretacao_esoterica: Urano é o 'choque de realidade' — o círculo é o EU que se vê; as duas luas são os DOIS reflexos (o que é e o que poderia ser). A cruz é a MATÉRIA que se DOBRA.
uso_pratico: Meditar no ⛢ é lembrar da 'liberdade de ser diferente' — usar como amuleto de inovação, ruptura, originalidade.
