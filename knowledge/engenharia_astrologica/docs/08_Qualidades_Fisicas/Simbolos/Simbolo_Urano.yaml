origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação moderna de planetas exteriores"
  - "mitologia greco-romana"
  - "astrologia psicológica moderna"
revisao_editorial:
  origem_do_glifo: "⛢ é uma das variantes de notação de Urano; ♅ também é usado. A forma com H remete à homenagem a William Herschel, enquanto leituras de sol, cruz e luas são mnemônicas/editoriais."
  curiosidade: "A coexistência de dois glifos de Urano é um bom exemplo de convenção de notação, não de divergência de cálculo; interfaces devem aceitar e identificar a variante visual."
  convencao_nao_tecnica: "O glifo identifica Urano. Descoberta, posição e aspectos são dados de efeméride; inovação/ruptura são leituras modernas de escola."
referencias:
