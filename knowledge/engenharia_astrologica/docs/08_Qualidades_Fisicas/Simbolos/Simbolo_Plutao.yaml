status: review
id: simbolo_plutao
nome: Símbolo de Plutão — ♇ (Sol + Cruz + Lua)
planeta: Plutão
significado_visual: '♇ = CÍRCULO (Sol) + CRUZ (matéria, morte) + LUA CRESCENTE (emocional, inconsciente).

  O círculo é o EU; a cruz é a MORTE/RENASCIMENTO; a lua é o INCONSCIENTE EMOCIONAL.

  Juntos = o EU que MORRE (cruz) no INCONSCIENTE (lua) para RENASCER (círculo = novo eu).

  Outra leitura: a Lua está SOBRE a cruz = a emoção que ''morre'' para o eu renascer.

  O símbolo também lembra a letra P (Plutão) = o nome do planeta disfarçado no glyph.

  '
interpretacao_esoterica: 'Plutão é o ''deus do inferno'' (Hades) — o símbolo é o EU (círculo) que ENCONTRA a MORTE (cruz) no INCONSCIENTE (lua) para RENASCER.

  A ordem dos traços: Sol (eu) → cruz (morte) → Lua (emoção/inconsciente) = a jornada de Plutão: ''eu morro no fundo do mar emocional para renascer transformado''.

  A Lua POR CIMA da cruz = a emoção que ''mergulha'' na morte — Plutão é a ''descida ao inferno'' (inconsciente) para ''subir transformado''.

  '
uso_pratico: Meditar no ♇ é lembrar da 'transformação' — usar como amuleto de cura, renascimento, poder pessoal. O símbolo é a 'assinatura do phoenix'.
