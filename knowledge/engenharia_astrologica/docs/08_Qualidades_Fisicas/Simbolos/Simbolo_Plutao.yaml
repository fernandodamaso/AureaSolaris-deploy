origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação moderna de planetas exteriores"
  - "mitologia greco-romana"
  - "astrologia psicológica moderna"
revisao_editorial:
  origem_do_glifo: "♇ é uma forma moderna de notação de Plutão; coexistem variantes tipográficas, inclusive monograma PL. A leitura de sol, lua e cruz é simbólica/editorial, não uma origem documental única."
  curiosidade: "Plutão foi descoberto em 1930 e depois classificado astronomicamente como planeta anão; a escolha de seu nome remete ao deus romano do submundo."
  convencao_nao_tecnica: "O glifo identifica Plutão. O motor deve calcular posição por efeméride e declarar a política de pontos, sem derivar transformação ou destino do desenho."
