origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "astrologia helenística, medieval e moderna"
  - "notação astronômica e astrológica ocidental"
  - "leituras cármicas/evolutivas modernas"
revisao_editorial:
  origem_do_glifo: "☊ e ☋ são os sinais de cabeça e cauda do dragão (caput/cauda draconis) usados na tradição astrológica. Não são, historicamente, crescentes com setas; a imagem de eixo, memória e crescimento pertence a leituras modernas específicas."
  curiosidade: "Os nodos são pontos geométricos de interseção entre a eclíptica e a órbita lunar, não corpos celestes. A metáfora do dragão ajuda a lembrar sua história simbólica."
  convencao_nao_tecnica: "O glifo identifica os nodos; o motor precisa declarar se calcula nodo verdadeiro ou médio e não deduz karma/destino a partir do símbolo."
