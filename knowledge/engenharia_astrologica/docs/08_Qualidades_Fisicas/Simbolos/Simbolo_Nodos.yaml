status: review
id: simbolo_nodos
nome: Símbolo dos Nodos Lunares — ☊ (Norte) e ☋ (Sul)
planeta: Nodos Lunares
significado_visual: '☊ (Norte) = CRESCENTE LUA (inconsciente, passado) + SETA PARA CIMA (direção, crescimento).

  ☋ (Sul) = CRESCENTE LUA + SETA PARA BAIXO (recolhimento, passado).

  O crescente representa a Lua = memória, padrão, karma.

  A seta indica direção: Norte = subir, crescer; Sul = descer, repetir.

  Juntos formam o EIXO DO DRAGÃO = linha de destino da alma.

  '
origem: Símbolos tradicionais da astrologia helenística (Cabeça e Cauda do Dragão).
