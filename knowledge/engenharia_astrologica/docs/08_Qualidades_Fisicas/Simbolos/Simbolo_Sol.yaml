origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação astronômica e astrológica ocidental"
  - "astrologia helenística e medieval"
  - "iconografia simbólica editorial"
revisao_editorial:
  origem_do_glifo: "☉ é uma convenção antiga do disco solar com ponto central. A leitura de círculo como totalidade e ponto como eu/centro é interpretação simbólica útil, não regra técnica derivada do desenho."
  curiosidade: "O disco solar ocorre em muitas tradições visuais; nomes e mitos solares variam entre culturas e devem ser atribuídos à sua origem, não fundidos em uma única doutrina."
  convencao_nao_tecnica: "O glifo identifica o Sol. A posição solar, a declinação e os aspectos dependem de cálculo/efeméride."
