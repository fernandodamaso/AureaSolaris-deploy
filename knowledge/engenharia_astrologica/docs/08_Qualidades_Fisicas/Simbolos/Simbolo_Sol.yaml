status: review
id: simbolo_sol
nome: Símbolo do Sol — ☉ (Círculo com Ponto)
planeta: Sol
significado_visual: '☉ = CÍRCULO (totalidade, perfeição, eterno) + PONTO no centro (o EU que ocupa o centro).

  O círculo SEM PONTO é a ''matriz'' (a Lua). O círculo COM PONTO é o ''EU que se reconhece'' (o Sol).

  O ponto é a ''centelha'' — o Sol é o centro que EMITE.

  '
interpretacao_esoterica: O Sol é o 'centro que brilha' — a identidade que não depende de reflexo (ao contrário da Lua, que reflete). O ponto no centro é a 'centelha divina' que cada ser carrega.
uso_pratico: Meditar no ☉ é lembrar do 'centro próprio' — usar como amuleto de autoconfiança.
