status: review
id: simbolo_marte
nome: Símbolo de Marte — ♂ (Círculo com Seta)
planeta: Marte
significado_visual: '♂ = CÍRCULO (EU) + SETA PARA CIMA/DIREITA (ação, avanço, direção).

  O círculo é a ''cabeça'' (a identidade); a seta é a ''lança'' (a ação que parte do eu).

  A seta aponta para DIANTE = Marte é o planeta que AVANÇA, que ''vai primeiro''.

  Diferença de Vênus: Vênus tem cruz (horizontal = equilíbrio); Marte tem seta (direcional = ação).

  '
interpretacao_esoterica: Marte é o 'eu que avança' — o círculo é a identidade, a seta é a VONTADE que se PROJETA. Ele é o 'batedor' que parte do centro (círculo) e vai para o desconhecido (seta).
uso_pratico: Meditar no ♂ é lembrar da 'coragem de avançar' — usar como amuleto de ação, defesa, inciativa.
