revisao_editorial:
  origem_do_glifo: "♂ é o sinal planetário associado a Marte e, em contextos modernos, ao símbolo de escudo e lança. A decomposição em círculo, identidade e seta é leitura mnemônica/simbólica; não é uma regra técnica produzida pelo desenho."
  curiosidade: "O mesmo sinal passou a ter uso em biologia para o sexo masculino; esse uso posterior não reduz Marte a gênero nem altera sua significação astrológica histórica."
  convencao_nao_tecnica: "O glifo identifica Marte. Qualquer leitura usa sua condição, casas, aspectos e escola de interpretação declarada."
