status: review
id: simbolo_lilith
nome: Símbolo de Lilith — ⚸ (Lua Negra / Meu Apogeu)
planeta: Lilith
significado_visual: '⚸ = CRESCENTE LUA (inconsciente, feminino) + CRUZ INVERTIDA (rejeição, inversão, sombra).

  O crescente representa a Lua = o feminino rejeitado.

  A cruz invertida = o que foi invertido, negado, colocado de cabeça para baixo.

  Junção = Lilith = o feminino que foi rejeitado e se tornou sombra/autonomia radical.

  '
origem: Glifo moderno, usado em astrologia feminista e psicológica (século XX).
