  tecnicas:
    - "Unicode Consortium. The Unicode Standard, bloco Miscellaneous Symbols: U+26B8 BLACK MOON LILITH."
camada_energetica:
  impressao_mental: Símbolo gráfico do planeta/corpo celeste.
