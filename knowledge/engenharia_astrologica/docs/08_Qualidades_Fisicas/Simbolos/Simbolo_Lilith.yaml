origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação moderna da Lua Negra"
  - "escolas modernas e psicológicas"
  - "estudo mítico-literário de Lilith"
revisao_editorial:
  origem_do_glifo: "⚸ é usado em software e tabelas modernas para Black Moon Lilith; não é glifo herdado do repertório planetário clássico. A leitura de crescente e cruz invertida é simbólica/editorial, não origem documental consensual do desenho."
  curiosidade: "'Lilith' pode designar conceitos distintos — figura mítica/literária, apogeu lunar médio ou oscilante, asteroide e pontos hipotéticos — que não devem ser confundidos."
  convencao_nao_tecnica: "O sinal só identifica a definição escolhida. O motor deve declarar qual Lilith calcula e não inferir 'sombra' ou autonomia a partir do glifo."
referencias:
  primarias:
