camada_energetica:
  impressao_mental: Símbolo gráfico do planeta/corpo celeste.
  permeacao_emocional: Reconhecimento visual do arquétipo.
  manifestacao_externa: Uso em mapas, fichas e leitura visual.
  como_guiar_o_astral: Fixar o símbolo como atalho visual do planeta.
