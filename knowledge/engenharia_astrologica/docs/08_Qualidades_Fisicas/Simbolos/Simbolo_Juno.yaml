status: review
id: simbolo_juno
nome: Símbolo de Juno — ⚵ (Juno / Hera)
planeta: Juno
significado_visual: '⚵ = CRUZ + CRESCENTE LUA ABAIXO + PONTO (união, casamento, contrato).

  A cruz representa o corpo, a matéria do casamento.

  O crescente representa a Lua = emoção, feminino, união.

  O ponto representa a semente, o filho, o fruto do casamento.

  Junção = Juno = o contrato que gera vida.

  '
origem: Glifo proposto em 1804, aprovado pela IAU como símbolo de Juno (3 Juno).
