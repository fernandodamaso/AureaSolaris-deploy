origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação de asteroides moderna"
  - "mitologia greco-romana"
  - "iconografia simbólica editorial"
revisao_editorial:
  origem_do_glifo: "⚵ é a forma tipográfica moderna usada para Juno. A leitura de cruz, crescente e ponto é interpretação simbólica editorial; a história do desenho não autoriza tratá-la como decomposição canônica consensual."
  curiosidade: "Juno, descoberto em 1804, recebeu nome da deusa romana do matrimônio; o nome mítico não obriga uma única interpretação astrológica."
  convencao_nao_tecnica: "O glifo identifica Juno no mapa e não cria por si só um 'indicador de casamento' nem substitui significadores relacionais."
referencias:
  primarias:
    - "Fontes clássicas sobre Hera/Juno, conforme tradução/edição declarada."
  secundarias:
