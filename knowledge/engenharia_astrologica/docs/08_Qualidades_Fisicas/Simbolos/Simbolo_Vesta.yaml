  expressao_elevada_vs_sombra:
    elevada: Guardião da tradição, devoto compassivo, que serve sem precisar de reconhecimento.
    sombra: Fanático religioso, medo da sexualidade, 'santo' que condena, obsessão por pureza.
origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação de asteroides moderna"
  - "mitologia greco-romana"
  - "iconografia simbólica editorial"
revisao_editorial:
  origem_do_glifo: "⚴ é a forma tipográfica moderna usada para Vesta. A associação visual com chama/altar pode orientar memória simbólica, mas não é uma decomposição histórica única do desenho."
  curiosidade: "Vesta, descoberto em 1807, recebeu o nome da deusa romana do fogo doméstico; sacerdócio, lareira e dedicação são temas míticos retomados na astrologia moderna de asteroides."
  convencao_nao_tecnica: "O glifo identifica Vesta. Ele não configura, por si, vocação, celibato ou destino; a escola e o contexto devem ser declarados."
