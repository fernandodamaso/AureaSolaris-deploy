status: review
id: simbolo_vesta
nome: Símbolo de Vesta — ⚴ (Vesta / Hestia)
planeta: Vesta
significado_visual: '⚴ = CRUZ + CRESCENTE LUA ABAIXO (fogo sagrado, altar).

  A cruz representa o altar, a estrutura do templo.

  O crescente representa o fogo que queima continuamente (chama sagrada).

  Junção = Vesta = o fogo que nunca apaga, a devoção que sustenta.

  '
origem: Glifo proposto em 1807, aprovado pela IAU como símbolo de Vesta (4 Vesta).
