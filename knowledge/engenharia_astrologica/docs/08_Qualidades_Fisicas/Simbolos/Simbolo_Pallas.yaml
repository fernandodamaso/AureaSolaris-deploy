status: review
id: simbolo_pallas
nome: Símbolo de Pallas — ⚶ (Pallas / Atena)
planeta: Pallas
significado_visual: '⚶ = CRUZ + CRESCENTE LUA + SETA (estratégia, sabedoria, guerra justa).

  A cruz representa o corpo, a matéria.

  O crescente representa a Lua = mente intuitiva, sabedoria.

  A seta representa a direção, a estratégia, a ação correta.

  Junção = Pallas = sabedoria que age com justiça.

  '
origem: Glifo proposto em 1802, aprovado pela IAU como símbolo de Pallas (2 Pallas).
