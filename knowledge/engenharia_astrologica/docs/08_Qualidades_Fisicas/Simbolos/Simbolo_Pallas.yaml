  expressao_elevada_vs_sombra:
    elevada: Estrategista justa, que usa a mente para defender e criar, que une arte e justiça.
    sombra: Manipuladora fria, que usa estratégia para dominar, 'justiça' como máscara de vingança.
origens_e_divergencias:
  tradicional: Símbolo padrão da astrologia ocidental.
  moderna: Mantido o símbolo tradicional; algumas variantes modernas existem.
  nota: Símbolo é convenção visual, não técnica.
tradicoes:
  - "notação de asteroides moderna"
  - "mitologia greco-romana"
  - "iconografia simbólica editorial"
revisao_editorial:
  origem_do_glifo: "⚶ é a forma tipográfica moderna usada para Pallas. O sinal é geralmente apresentado com referência aos atributos de Atena/Pallas; a leitura de cruz, crescente e seta é simbólica/editorial, não decomposição histórica consensual."
  curiosidade: "Pallas foi descoberto em 1802 e recebeu nome de Pallas Atena; estratégia e artesanato são temas míticos, depois retomados por escolas modernas de asteroides."
  convencao_nao_tecnica: "O glifo identifica Pallas e não produz, sozinho, uma regra de estratégia, justiça ou guerra. A técnica precisa declarar objeto, escola e parâmetros."
referencias:
  primarias:
    - "Fontes clássicas sobre Atena/Pallas, conforme tradução/edição declarada."
  secundarias:
