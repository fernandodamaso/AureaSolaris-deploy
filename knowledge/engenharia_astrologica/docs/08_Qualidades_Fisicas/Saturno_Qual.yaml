qualidade_termica: "Fria e seca"
chakra_overlay: "Raiz (1º) e Coroa (7º) — estrutura e transcendência do limite"

origens_e_divergencias:
  tradicional: "Doutrina das Assinaturas (Culpeper/Agrippa)."
  moderna: "Astrologia psicológica (Liz Greene) — corpo como linguagem simbólica."
  nota: "Chakra overlay = sincretismo Nova Era, não canônico."
atlas_simbolico:
  pessoas_arquetipos: "Ancião, construtor, pai, autoridade"
  lugares_fisicos: "Montanhas, cumes, castelos, subsolo"
  objetos_materia: "Coroas, cetros, relógios, ferramentas"
  eventos_tipicos: "Ascensão profissional, construções, mortes de autoridades"
  animais: "Cabra, crocodilo, abutre, caracol"
  plantas_ervas: "Alecrim, mirra, sálvia, heléboro negro, hera, pinheiro"
  metais_pedras: "Chumbo, ferro, ônix, granada, turquesa escura"
  cores_sons: "Preto, marrom, cinza-escuro; notas Lá e Sol; sino, órgão"
  numeros: "4 (estrutura), 8 (materialidade), 10 (autoridade)"
  dias_semana: "Sábado"
  doencas_corpo: "Ossos, joelhos, dentes, pele, articulações"
  arquetipos_mitologicos: "Cronos, Saturno, Janus"
  mitos_historias: "Cronos devorando os filhos; Prometeu e o fogo"
  sonhos_simbolos_inconsciente: "Montanhas, castelos, pedras, estruturas, inverno"
  expressao_elevada_sombra: "Elevada: estrutura que serve, autoridade responsável | Sombra: rigidez, pessimismo"

camada_energetica:
  impressao_mental: "Saturno é ESTRUTURA e LIMITE — a mente 'segura' a forma."
  permeacao_emocional: "Medo, responsabilidade, rigidez — ou solidez madura."
  manifestacao_externa: "Estilo preto/cinza; tende a ter 'cara de Saturno' (ossos marcantes, postura ereta). Arquétipos: o Velho, o Tempo. Inclinação, não destino."
  como_guiar_o_astral: "Saturno pede TEMPO — a pessoa precisa de 'prazo' para crescer; forçar = quebrar."

porque_simbolico: |
  CHUMBO = metal mais PESADO, FRIO, DURADOURO. Saturno = limite, peso, tempo. O chumbo NÃO enferruja (dura para sempre).
  CIPRESTE = árvore funerária, 'sempre verde' — Saturno = estrutura que atravessa a morte.
  HERVA = planta que SEGURA (se agarra), como Saturno segura a estrutura.

linha_tradicao: "Doutrina das Assinaturas: Saturno = chumbo, cipreste, hera, ossos."
chakra_nota: "Overlay sincretico."
tradicoes:
  - "astrologia helenística e medieval"
  - "correspondências renascentistas"
  - "astrologia psicológica moderna"
revisao_editorial:
  atribuicao: "Chumbo e qualidades fria/seca pertencem a tabelas tradicionais; plantas, órgãos e cores variam por autor e edição."
  limite: "Ossos, dentes, joelhos, pele e baço são correspondências histórico-simbólicas; não são prognóstico médico ou prova de condição corporal."
  chakra: "Overlay sincrético contemporâneo, não regra de cálculo astrológico."
referencias:
  primarias:
    - "Ptolomeu. Tetrabiblos, livro I: natureza saturnina e qualidades planetárias; consultar tradução/edição declarada."
    - "Agrippa, Heinrich Cornelius. Three Books of Occult Philosophy, livro I: chumbo e correspondências de Saturno."
    - "Culpeper, Nicholas. The English Physitian / Complete Herbal, 1653: regências planetárias das plantas."
  secundarias:
    - "Greene, Liz. Saturn: A New Look at an Old Devil. Samuel Weiser, 1976."
  tecnicas:
    - "Ler Saturno com sect, dignidade, casas e aspectos; uma correspondência isolada não define a interpretação."
