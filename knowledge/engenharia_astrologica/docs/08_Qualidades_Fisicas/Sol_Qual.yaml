camada_energetica:
  impressao_mental: "A cor dourada no mapa = 'centro que brilha'. Pessoa de Sol forte tende a 'iluminar' o ambiente."
  permeacao_emocional: "Calor, generosidade, orgulho."
  manifestacao_externa: "Estilo dourado/amarelo; tende a ser 'o centro' nas fotos. Arquétipos: o Rei, o Sol. Inclinação, não destino."
  como_guiar_o_astral: "Usar a cor como 'amuleto' — dourado fortalece a expressão do Sol."

porque_simbolico: |
  OURO = metal nobre que NÃO enferruja — exatamente o Sol: identidade que não 'envelhece' no sentido de perder valor.
  ROSA/GIRASSOL = seguem o Sol (giram para ele). CINNAMON/LOURO = calor solar (especiarias 'quentes').
  CORAÇÃO = centro do corpo = Sol = centro do mapa.

linha_tradicao: "Doutrina das Assinaturas (Culpeper/Agrippa): Sol = ouro, girassol, coração, fogo."
