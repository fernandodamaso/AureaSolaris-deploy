status: review

id: "qualidades_fisicas"
nome: "Qualidades Físicas (Planetas, Signos, Decanatos)"
tradicoes:
  - "editorial"
  - "correspondencias simbolicas"
tema: "Cor, planta, metal, parte do corpo, qualidade térmica, umidade, elemento físico — e overlay chakra (rotulado como sincretismo)"

origens_e_divergencias:
  tradicional: "Doutrina das Assinaturas (Culpeper/Agrippa) — cor, metal, planta, elemento físico."
  moderna: "Astrologia psicológica (Liz Greene) — corpo como linguagem simbólica + overlay chakra (sincretismo)."
  divergencia: "Chakras NÃO são astrológicos (tântrica/hindu). Incluir rotulado como overlay sincretico, não como canônico."

limites_de_uso:
  - "Correspondências corporais, botânicas, metálicas e cromáticas pertencem a sistemas históricos de correspondência; não são evidência clínica nem regra de diagnóstico."
  - "O overlay de chakras é um sincretismo contemporâneo de estudo e não uma doutrina canônica da astrologia ocidental nem da tradição tântrica."
  - "Aparência, saúde e temperamento não devem ser inferidos como certezas a partir de um único fator do mapa."

essencia:
  - "Cada planeta tem cor, metal, qualidade térmica (quente/frio/seco/úmido)"
  - "Cada signo tem cor, parte do corpo, elemento físico"
  - "Cada decanato tem nuance física"
  - "Chakras = OVERLAY sincretico (não-canônico; tradição tântrica/hindu sobreposta). Rotular como tal."
