camada_energetica:
  campo_mental: "O corpo físico é a 'roupa' do mapa — a cor do planeta no signo 'pinta' a expressão física do nativo."
  permeacao_emocional: "A cor que a pessoa 'sente como sua' frequentemente é a cor do signo/planeta dominante."
  manifestacao_externa: "Aparência, saúde, estilo, 'aura' — tudo manifesta a cor do mapa. Inclinação, não destino."
  como_guiar_o_astral: "Usar como 'linguagem simbólica' — não como predição de aparência, mas como chave de leitura."

topicos:
  - "Planetas: cor, metal, qualidade térmica, umidade, parte do corpo"
  - "Signos: cor, parte do corpo (Zodíaco Anatômico), elemento físico"
  - "Decanatos: nuance de cor/textura"
  - "Chakras: overlay sincretico (7 chakras × 7 planetas/signos — ver nota)"
  - "Doutrina das Assinaturas (Culpeper/Agrippa): planta = planeta"

nota_chakras: "Chakras NÃO são astrológicos. São tradição tântrica/hindu. O overlay 'chakra por planeta/signo' é SINCRETISMO Nova Era moderno — incluir rotulado como tal, não como canônico."
overlay_chakras_sugerido:
  - "Raiz (1º): Saturno/Capricórnio — base, estrutura, 'chão'"
  - "Sacro (2º): Vênus/Touro — prazer, corpo, 'sentir'"
  - "Plexo Solar (3º): Marte/Áries — ação, fogo, 'vou'"
  - "Coração (4º): Sol/Leão — centro, amor, 'brilho'"
  - "Garganta (5º): Mercúrio/Gêmeos — comunicação, 'falo'"
  - "Terceira Visão (6º): Lua/Câncer — imaginação, 'sinto'"
  - "Coroa (7º): Netuno/Peixes — transcendência, 'uno'"

foco_especial:
  infantil: "Criança com 'cor de planeta dominante' tende a se vestir/brincar com aquela cor — é simbólico, não moda."
  familiar: "A 'cor da família' (planetas angulares) aparece na decoração, roupas, gostos."

referencias:
  primarias:
    - "Agrippa, Heinrich Cornelius. Three Books of Occult Philosophy, livro I: correspondências planetárias, metais, cores e plantas."
    - "Culpeper, Nicholas. The English Physitian / Complete Herbal, 1653: regências e virtudes atribuídas às plantas."
  secundarias:
