camada_energetica:
  impressao_mental: "Vênus é HARMONIA e CONTATO — a beleza é a 'aparência que faz bem'."
  permeacao_emocional: "Prazer, amor, apreciação."
  manifestacao_externa: "Estilo suave, harmonioso, 'bonito por natureza'; tende a ter traços suaves. Arquétipos: a Vênus, o Artista. Inclinação, não destino."
  como_guiar_o_astral: "Vênus pede BELEZA — a pessoa precisa de 'toque estético' para funcionar."

porque_simbolico: |
  COBRE = metal da VÊNUS (afrodite) — condutor de calor/eletricidade, como o toque conduz emoção.
  ROSA = flor da deusa Vênus/Afrodite. VIOLETA = cor da 'transição' (Vênus entre Marte e Sol).
  PELE = órgão do toque = Vênus = prazer pelo contato.

linha_tradicao: "Doutrina das Assinaturas: Vênus = cobre, rosa, violeta, maçã, pele."
chakra_nota: "Overlay sincretico."
tradicoes:
  - "astrologia helenística e medieval"
  - "correspondências renascentistas"
  - "astrologia psicológica moderna"
revisao_editorial:
  atribuicao: "Cobre e qualidades fria/úmida pertencem a tabelas tradicionais de correspondência; rosa, beleza e toque também recebem releituras míticas e psicológicas modernas."
  limite: "Pele, rins, lombar, fertilidade, aparência e traços físicos são correspondências histórico-simbólicas; não constituem diagnóstico, prognóstico, padrão estético ou inferência determinista."
  chakra: "Overlay sincrético contemporâneo, não regra de cálculo astrológico."
referencias:
  primarias:
    - "Ptolomeu. Tetrabiblos, livro I: natureza e qualidades de Vênus, conforme edição declarada."
    - "Agrippa, Heinrich Cornelius. Three Books of Occult Philosophy, livro I: cobre e correspondências de Vênus."
    - "Culpeper, Nicholas. The English Physitian / Complete Herbal, 1653: regências planetárias das plantas."
  secundarias:
    - "Greene, Liz. The Astrology of Fate. Samuel Weiser, 1984."
  tecnicas:
    - "Ler Vênus com dignidade, recepção, casas e aspectos; o símbolo e uma correspondência isolada não bastam."
