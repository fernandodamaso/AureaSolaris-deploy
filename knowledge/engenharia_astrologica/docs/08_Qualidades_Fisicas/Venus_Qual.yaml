atlas_simbolico:
  pessoas_arquetipos: "Amante, artista, juiz, parceiro"
  lugares_fisicos: "Jardins, templos, galerias, locais de amor"
  objetos_materia: "Anéis, jóias, arte, música, contratos"
  eventos_tipicos: "Casamentos, contratos, festas, arte, amor"
  animais: "Cervo, cisne, pomba, lebre"
  plantas_ervas: "Rosa, violeta, madressilva, orquídea, oliveira"
  metais_pedras: "Cobre, ouro rosa, diamante, esmeralda, safira"
  cores_sons: "Rosa, verde-claro, azul-claro; notas Lá e Ré; violino, piano"
  numeros: "2 (dualidade), 6 (harmonia), 7 (amor)"
  dias_semana: "Sexta-feira"
