  permeacao_emocional: "Liberdade, originalidade, medo de 'ser igual'."
  manifestacao_externa: "Estilo elétrico, 'diferente'; tende a ter 'cara de inventor'. Arquétipos: o Gênio. Inclinação, não destino."
  como_guiar_o_astral: "Urano pede LIBERDADE — a pessoa precisa de 'espaço para ser diferente'."

porque_simbolico: |
  URÂNIO = elemento radioativo, que 'muda de face' (Urano = mudança súbita). AZUL ELÉTRICO = cor da eletricidade (Urano = raio).
  LAVANDA = cor entre azul e violeta (transição), erva que 'acalma o choque'.
  PANTURRILHAS/TORNOZELOS = 'rede de sustentação móvel' (Urano = rede em movimento).

linha_tradicao: "Doutrina das Assinaturas moderna: Urano = alumínio, raízes que 'explodem' (ex.: batata-inglesa)."
chakra_nota: "Overlay sincretico."
tradicoes:
  - "astrologia moderna de planetas exteriores"
  - "astrologia psicológica moderna"
  - "correspondências simbólicas editoriais"
revisao_editorial:
  atribuicao: "Urano foi descoberto em 1781 e não integra o septenário clássico. Urânio, eletricidade, alumínio, rede e 'choque' são associações modernas/editoriais, não doutrina renascentista original."
  limite: "Tornozelos, panturrilhas, sistema circulatório e 'gênio' são imagens simbólicas modernas; não autorizam diagnóstico, previsão corporal ou atribuição determinista de personalidade."
  chakra: "Overlay sincrético contemporâneo, não regra de cálculo astrológico."
referencias:
  primarias:
    - "Herschel, William. Relatos da descoberta de Urano, 1781; consultar edição/arquivo declarado."
  secundarias:
    - "Sasportas, Howard. The Gods of Change. Arkana, 1989."
  tecnicas:
    - "Usar efemérides para longitude, velocidade e aspectos de Urano; a associação simbólica não substitui cálculo."
