camada_energetica:
  impressao_mental: "Júpiter é EXPANSÃO e SENTIDO — a mente 'quer mais' e 'quer que faça sentido'."
  permeacao_emocional: "Esperança, fé, generosidade — risco de exagero."
  manifestacao_externa: "Estilo amplo, 'grande'; tende a ter 'corpo de filósofo/rei'. Arquétipos: o Rei, o Sábio. Inclinação, não destino."
  como_guiar_o_astral: "Júpiter pede MODERAÇÃO — a expansão sem limite 'engorda' o fígado."

porque_simbolico: |
  ESTANHO = metal 'jovem' (Júpiter é o 'jovem entre os deuses'), condutor, expansivo.
  CARVALHO = árvore mais LONGEVA e MAIOR da Europa — Júpiter = expansão no tempo e no espaço.
  FIGO = fruto ABUNDANTE, doce, que 'cresce rápido' — Júpiter = abundância.

linha_tradicao: "Doutrina das Assinaturas: Júpiter = estanho, carvalho, figo, fígado."
chakra_nota: "Overlay sincretico."
tradicoes:
  - "astrologia helenística e medieval"
  - "correspondências renascentistas"
  - "astrologia psicológica moderna"
revisao_editorial:
  atribuicao: "Estanho e qualidades quente/úmida pertencem a tabelas tradicionais de correspondência; plantas, órgãos e cores variam por autor e edição."
  limite: "Fígado, quadris, coxas e temperamento são correspondências histórico-simbólicas; não são diagnóstico nem causalidade biomédica."
  chakra: "Overlay sincrético contemporâneo, não regra de cálculo astrológico."
referencias:
  primarias:
    - "Ptolomeu. Tetrabiblos, livro I: natureza e qualidades planetárias; consultar tradução/edição declarada."
    - "Agrippa, Heinrich Cornelius. Three Books of Occult Philosophy, livro I: metal e correspondências de Júpiter."
    - "Culpeper, Nicholas. The English Physitian / Complete Herbal, 1653: regências planetárias das plantas."
  secundarias:
    - "Greene, Liz. The Astrology of Fate. Samuel Weiser, 1984."
  tecnicas:
    - "Confrontar qualquer aplicação corporal com a seção de Astrologia Médica e seus limites de estudo."
