porque_simbolico: |
  QUÍRON = centauro FERIDO que não podia morrer = imortalidade com dor. A FERIDA É O DOM.
  ERVA-DE-SÃO-JOÃO = planta da CURA (hipericum = 'sobre o fantasma'). CAMOMILA = acalma a ferida.
  COXAS = força do centauro (corpo animal) — Quíron tem 'força de cavalo' para carregar a cura.

