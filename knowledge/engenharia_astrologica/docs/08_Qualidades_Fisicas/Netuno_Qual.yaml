camada_energetica:
  impressao_mental: "Netuno é NEBLINA e UNIDADE — a mente 'dissolve' as fronteiras."
  permeacao_emocional: "Compaixão, confusão, 'mar de sentimentos'."
  manifestacao_externa: "Estilo azul-translúcido/neon; tende a ter 'cara de sonho' (olhos 'alagados'). Arquétipos: o Místico, o Artista. Inclinação, não destino."
  como_guiar_o_astral: "Netuno pede RITUAL — a pessoa precisa de 'ato sagrado' para não se dissolver na rotina."

porque_simbolico: |
  NEPTUNO = planeta AZUL, gasoso, sem superfície sólida — exatamente 'dissolução de fronteiras'.
  PAPOULA = flor que 'alucina' (ópio = Netuno). VIOLETA = cor do 'entre-dois' (azul + vermelho = violeta).
  PÉS = parte do corpo de Peixes (signo de Netuno) — 'andar sobre as águas', 'fundar-se no invisível'.

linha_tradicao: "Doutrina das Assinaturas moderna: Netuno = papoula, violeta, névoa."
chakra_nota: "Overlay sincretico."
tradicoes:
  - "astrologia moderna de planetas exteriores"
  - "astrologia psicológica"
  - "correspondências simbólicas editoriais"
revisao_editorial:
  atribuicao: "Netuno foi descoberto em 1846 e não possui correspondência no septenário antigo. Papoula, violeta, névoa, platina e éter são associações modernas/editoriais, não doutrina renascentista original."
  limite: "Pés, sistema linfático, álcool, drogas e remédios são associações simbólicas modernas; não autorizam inferir dependência, doença ou uso de substâncias."
  chakra: "Overlay sincrético contemporâneo, não regra de cálculo astrológico."
referencias:
  primarias:
    - "Galle, Johann Gottfried. Registros da observação de Netuno em 1846; consultar edição/arquivo histórico declarado."
  secundarias:
    - "Greene, Liz. The Astrological Neptune and the Quest for Redemption. Samuel Weiser, 1992."
    - "Sasportas, Howard. The Gods of Change: Pain, Crisis and the Transits of Uranus, Neptune and Pluto. Arkana, 1989."
  tecnicas:
    - "Usar efemérides para longitude, velocidade e aspectos de Netuno; a associação simbólica não substitui cálculo."
