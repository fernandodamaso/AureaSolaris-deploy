revisao_editorial:
  atribuicao: "Prata e qualidades fria/úmida pertencem a tabelas tradicionais; a imagem da prata como reflexo é interpretação simbólica moderna."
  limite: "Líquidos, estômago, mamas e útero são correspondências histórico-simbólicas; não permitem dedução clínica ou reprodutiva sobre uma pessoa."
  chakra: "Overlay sincrético contemporâneo, não regra de cálculo astrológico."
