camada_energetica:
  impressao_mental: "A cor prata no mapa = 'reflexo'. Pessoa de Lua forte tende a 'refletir' o ambiente antes de agir."
  permeacao_emocional: "Sensibilidade, intuição, 'maré interna'."
  manifestacao_externa: "Estilo prata/branco/azul-pálido; tende a ter 'cara de lua' (olhos arredondados). Arquétipos: a Mãe, o Espelho. Inclinação, não destino."
  como_guiar_o_astral: "Usar prata/branco como 'escudo suave' — protege sem blindagem dura."

porque_simbolico: |
  PRATA = metal reflexivo (reflete a luz, não emite). A Lua REFLETE a luz do Sol.
  SALGUEIRO cresce na água, é flexível (Lua = adaptação). CAMOMILA = calmante, 'embala' como a Lua embala a maré.
  ESTÔMAGO = primeiro órgão que 'recebe' (assim como a Lua recebe a luz do Sol).

linha_tradicao: "Doutrina das Assinaturas: Lua = prata, salgueiro, jasmim, líquidos."
chakra_nota: "Overlay sincretico."
