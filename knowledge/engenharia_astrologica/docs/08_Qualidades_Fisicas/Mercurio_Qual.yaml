  - "astrologia psicológica moderna"
revisao_editorial:
  atribuicao: "Mercúrio/hidrargírio e a qualidade variável de Mercúrio pertencem a sistemas tradicionais; plantas e associação mental moderna variam por autor."
  limite: "Sistema nervoso, pulmões, braços e mãos são correspondências histórico-simbólicas; não são leitura neurológica, respiratória ou diagnóstica."
  chakra: "Overlay sincrético contemporâneo, não regra de cálculo astrológico."
referencias:
