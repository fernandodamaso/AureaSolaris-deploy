camada_energetica:
  impressao_mental: "Mercúrio é TRANSIÇÃO — mistura quente/fria, úmida/seca. A mente se adapta ao contexto."
  permeacao_emocional: "Curiosidade leve, ansiedade de estímulo."
  manifestacao_externa: "Estilo mutante, 'cada dia uma cor'; tende a ter mãos/olhos expressivos. Arquétipos: o Mensageiro. Inclinação, não destino."
  como_guiar_o_astral: "Mercúrio pede MOVIMENTO — a pessoa precisa trocar, senão 'enferruja'."

porque_simbolico: |
  MERCÚRIO (metal) é o ÚNICO líquido à temperatura ambiente — representa a MENTE em movimento, que não 'congeleta'.
  HORTELã= erva da 'comunicação' (refrescante, abre a garganta). NOZ-MOSCADA = estimula a mente.
  MÃOS = instrumento de Mercúrio (escrever, pegar, comunicar pelo tato).

linha_tradicao: "Doutrina das Assinaturas: Mercúrio = noz-moscada, verbena, hortelã, sistema nervoso."
chakra_nota: "Overlay sincretico."
