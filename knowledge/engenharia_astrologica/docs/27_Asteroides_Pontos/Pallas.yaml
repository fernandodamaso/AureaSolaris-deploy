limites_e_divergencias:
  - "Virgem como domicílio e Peixes como detrimento são propostas modernas, não dignidades clássicas."
  - "A deusa Atena/Pallas tem tradições míticas distintas; o arquivo preserva a síntese moderna, mas não deve atribuí-la a uma única fonte antiga."
  - "O motor deve informar corpo, orbe e regra escolhida; ‘justiça’ ou ‘estratégia’ são interpretações, não resultados astronômicos."

