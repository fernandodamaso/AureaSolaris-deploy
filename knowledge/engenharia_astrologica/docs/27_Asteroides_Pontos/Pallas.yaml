camada_energetica:
  impressao_mental: "A mente de 'como eu planejo?'. Estratégia, arte, justiça prática. Quando atrito: frieza, manipulação, 'o fim justifica os meios'."
  permeacao_emocional: "Clareza e objetividade. Quando bloqueado: confusão, 'não sei o que fazer'. Quando solto: criatividade estratégica."
  manifestacao_externa: "Eventos prováveis de julgamento, criação artística, vitória por estratégia. Trânsitos marcam decisões importantes."
  como_guiar_o_astral: "Ajudar a mente a usar a estratégia para o bem comum, não só para ganho pessoal. Pallas pede justiça, não vingança."

