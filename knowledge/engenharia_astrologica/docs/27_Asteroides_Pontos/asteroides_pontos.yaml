limites_e_divergencias:
  - "Asteroides e pontos não formam um sistema único: cada autora escolhe corpos, orbes e mitologia diferentes."
  - "Lilith, Vertex e East Point são pontos calculados; não são asteroides físicos."
  - "As camadas cármica, arquetípica, aparência e ‘cura’ são linguagens modernas atribuídas a escolas específicas; não devem ser apresentadas como consenso tradicional."
  - "O motor deve expor corpo/ponto, efeméride, método, orbe e fonte da regra antes de interpretar."

