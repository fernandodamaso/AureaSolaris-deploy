  manifestacao_externa: "Eventos prováveis de casamento, divórcio, contrato, sociedade. Trânsitos marcam compromissos ou rupturas."
  como_guiar_o_astral: "Ajudar a mente a ver que união não é posse: Juno pede igualdade, não fusão; contrato, não corrente."

