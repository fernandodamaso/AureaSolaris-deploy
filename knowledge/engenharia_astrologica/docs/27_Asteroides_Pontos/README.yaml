      - "Juno"
      - "Vesta"
      - "Pallas"
      - "outros asteroides quando o corpus os incluir"
    regra: "São corpos reais com efemérides próprias; sua interpretação depende de escola e não deve sobrepor os planetas clássicos."
  apsides_e_pontos_orbitais:
    exemplos:
      - "Lilith/Lua Negra"
      - "Priapo"
      - "nodos lunares"
    regra: "Exigem declaração de variante de cálculo: média, verdadeira, osculante, natural/interpolada etc."
