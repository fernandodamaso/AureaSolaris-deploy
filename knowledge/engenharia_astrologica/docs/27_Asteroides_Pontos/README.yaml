  regra_do_projeto: "Esta seção não deve tratar todos os itens como equivalentes. Asteroides, apsides lunares, lotes, vertex, pontos médios e ângulos derivados têm genealogias e cálculos diferentes."
  camada_simbolica: "Curiosidades mitológicas, etimologias e leituras psicológicas podem ser mantidas, desde que não substituam a definição técnica."
