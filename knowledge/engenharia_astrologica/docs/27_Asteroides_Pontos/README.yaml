    exemplos:
      - "Vertex"
      - "Antivertex"
      - "East Point"
      - "Co-Ascendente"
      - "Ascendente Polar"
    regra: "Dependem fortemente de hora, latitude, longitude, obliquidade e algoritmo."
  formulaicos_e_simetricos:
    exemplos:
      - "lotes/partes"
      - "pontos médios"
      - "antíscia e contra-antíscia"
    regra: "Não são corpos nem ângulos; cada família tem lógica própria."
notas_editoriais:
  - "Lilith no uso moderno costuma designar um ponto lunar, não o asteroide 1181 Lilith."
  - "O projeto exclui astrologia Uraniana/Hamburgo como escola, mas pode registrar pontos médios de forma controlada e rotulada."
  - "Nem todo ponto calculado merece o mesmo peso interpretativo do mapa natal clássico."
