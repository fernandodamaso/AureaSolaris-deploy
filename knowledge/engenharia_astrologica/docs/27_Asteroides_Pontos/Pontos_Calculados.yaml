id: pontos_calculados
nome: 'Pontos calculados: taxonomia, cálculo e escopo'
tipo: fundamento_de_pontos_derivados
tradicoes:
- helenística e medieval para lotes
- moderna ocidental para ângulos derivados e pontos orbitais
status: review
definicao: Pontos calculados são posições derivadas de uma geometria celeste, fórmula
  entre fatores ou parâmetro orbital. Não são corpos materiais. Vertex, Lilith, Lotes
  e pontos médios exigem documentação diferente, embora todos apareçam como graus
  no mapa.
familias:
  angulos_e_geometria_local:
    exemplos:
    - Ascendente/Descendente
    - Meio do Céu/Fundo do Céu
    - Vertex/Antivertex
    - East Point/Ascendente Equatorial
    - Co-Ascendente/Ascendente Polar
    dados_criticos: Hora, latitude, longitude, tempo sideral, obliquidade e algoritmo
      de casas/ângulos.
  orbitais:
    exemplos:
    - Nodo Norte/Sul
    - apogeu lunar médio
    - apogeu osculante (Lilith)
    - perigeu/Priapo
    dados_criticos: Efeméride, modelo médio/verdadeiro/osculante e convenção geocêntrica/topocêntrica.
  formulaicos:
    exemplos:
    - Lote da Fortuna
    - Lote do Espírito
    - partes árabes
    - pontos médios
    dados_criticos: Fórmula, ordem dos termos, seita, zodíaco e regra de conversão
      circular.
  simetricos:
    exemplos:
    - antíscia
    - contra-antíscia
    - pontos solsticiais
    dados_criticos: Regra de espelhamento em relação ao eixo Câncer–Capricórnio.
procedimento_geral:
- Identificar a família do ponto e a variante exata antes de interpretar.
- Registrar fórmula/algoritmo, software, efeméride, hora, local e convenções relevantes.
- Verificar com segundo programa quando o ponto depender de cálculo complexo.
- Declarar orbe e técnica de uso; os orbes planetários não se transferem automaticamente.
- Separar resultado de cálculo, regra de tradição e leitura simbólica no registro.
nao_confundir_com:
- Um ponto matemático não recebe dignidade essencial por si; seu regente e suas relações
  podem ser avaliados apenas dentro da técnica.
- Lilith/Lua Negra, asteroide 1181 Lilith e uma Dark Moon hipotética são entidades
  distintas.
- Vertex/Antivertex não são Descendente/Ascendente; East Point não é o Ascendente
  local.
- Pontos médios tradicionais/modernos não implicam adotar a escola Uraniana/Hamburgo,
  excluída do projeto.
ligacoes_internas:
