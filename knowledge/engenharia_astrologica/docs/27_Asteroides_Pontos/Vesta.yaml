  - autor: "Mary Beard"
    obra: "SPQR: A History of Ancient Rome"
    ano: 2015
    natureza: "contexto histórico sobre as Vestais romanas"
    localizador: "Distinguir história religiosa romana da interpretação astrológica moderna."
