camada_energetica:
  impressao_mental: "A mente de 'o que eu sirvo?'. Devoção, missão, pureza. Quando atrito: fanatismo, medo da sexualidade, 'sou puro por rejeitar o corpo'."
  permeacao_emocional: "Fogo interno constante. Quando bloqueado: frieza, solidão, 'ninguém entende minha missão'. Quando solto: dedicação que ilumina."
  manifestacao_externa: "Eventos prováveis de iniciação, retiro, dedicação total. Trânsitos marcam chamado de missão ou crise de fé."
  como_guiar_o_astral: "Ajudar a mente a honrar o fogo interno sem se isolar: Vesta pede devoção, não fanatismo; serviço, não autoflagelação."

