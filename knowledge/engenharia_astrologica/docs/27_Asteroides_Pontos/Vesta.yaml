limites_e_divergencias:
  - "Virgem como domicílio e Peixes como detrimento são atribuições modernas; a tradição romana não as formulou como dignidades."
  - "A história das Vestais inclui voto, poder e coerção; não reduzir ‘pureza’ a virtude universal nem apagar sua sombra histórica."
  - "Correspondências de saúde, karma e missão pertencem a leituras modernas; o motor deve mostrá-las como overlay e não como diagnóstico."

