  manifestacao_externa: "Eventos prováveis de aparição pública, reconhecimento, liderança visível. Trânsitos marcam momentos de 'aparecer'."
  como_guiar_o_astral: "Ajudar a mente a ser visível sem se perder na imagem: East Point pede autenticidade, não performance."

