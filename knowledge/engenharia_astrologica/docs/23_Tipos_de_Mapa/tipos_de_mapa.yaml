como_usar: |
  Tipos de mapa:
  1. Natal — a base de tudo
  2. Qualidades do mapa natal — sect, orientalidade, dominância, padrões
  3. Sinastria — comparação entre duas vidas
  4. Composite — carta composta do vínculo
  5. Davison — carta relacional por midpoint real
  6. Horária — pergunta específica no tempo
  7. Mundana — eventos coletivos
  8. Médica — saúde e corpo
  9. Eletiva — timing de início
  10. Astrocartografia — mapa geográfico

  Regra: o Natal é SEMPRE a base. Os outros são LENTES.
