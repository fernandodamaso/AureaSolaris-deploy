status: draft
id: "retorno_lunar"
nome: "Retorno Lunar"
tradicoes:
  - "editorial"
  - "multiescola"
tipo: "Engenharia da Previsão"
subtema: "Timing mensal"

origens_e_divergencias:
  tradicional: "Hellenística — retorno lunar como 'ciclo emocional'."
  moderna: "Evolutiva — retorno lunar como 'necessidade emocional'."
  nota: "Revisar ao citar — marca a escola usada."

atlas_simbolico:
  pessoas_arquetipos: "A nutridora, a sensitiva, o ciclo"
  lugares_fisicos: "Lares, cozinhas, lugares de nutrição"
  objetos_materia: "Pratos, leite, velas, fotografias de família"
  eventos_tipicos: "Ciclos emocionais, mudanças de humor, nutrição"
  animais: "Caranguejo, gato, lebre"
  plantas_ervas: "Lírio, jasmim noturno, alface"
  metais_pedras: "Prata, pedra da lua, pérola"
  cores_sons:
    cores: ["Prata", "branco luar", "azul-prateado"]
    sons: ["Flauta", "murmúrio d'água", "canto noturno"]
  numeros: [2, 4]
  dias_semana: ["Segunda-feira"]
  doencas_corpo:
    doencas: ["Problemas digestivos", "ansiedade", "insônia"]
    partes_corpo: ["Estômago", "útero", "seios"]
  arquetipos_mitologicos:
    - "Artemis"
    - "Hécate"
    - "Selene"
  mitos_historias: "Lua e Endimion; Artemis e Actaeon"
  expressao_elevada_sombra: "Elevada: nutrição emocional consciente | Sombra: humor volátil, apego"

camada_energetica:
  impressao_mental: "O retorno lunar é o 'mês emocional' da alma. 'O que eu preciso nutrir agora?'."
  permeacao_emocional: "Ciclo emocional mensal. Quando saudável: nutrição. Quando ferido: instabilidade."
  manifestacao_externa: "Eventos prováveis de mudança emocional, nutrição. Inclinação, não destino."
  como_guiar_o_astral: "Ajudar a pessoa a RESPEITAR SEU CICLO. Retorno lunar é respiração, não prisão."

como_usar: |
  1. Calcule o mapa do retorno lunar (Lua no mesmo grau do natal).
  2. Compare com o mapa natal.
  3. Leia os temas emocionais do mês.
  4. SEMPRE como tendência emocional, não como sentença.

