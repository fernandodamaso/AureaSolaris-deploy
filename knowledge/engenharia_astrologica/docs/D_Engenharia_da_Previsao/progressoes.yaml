    - Envelhecimento
    - maturidade
    partes_corpo:
    - Ossos
    - coluna
  arquetipos_mitologicos:
  - Cronos (tempo)
  - Hécate (transformação)
  mitos_historias: Cronos e o tempo que devora
  expressao_elevada_sombra: 'Elevada: crescimento consciente | Sombra: estagnação,
    medo de mudança'
camada_energetica:
  impressao_mental: As progressões são o 'tempo interno' do mapa. 'O que amadurece
    em mim agora?'.
  permeacao_emocional: 'Maturidade emocional gradual. Quando saudável: crescimento.
    Quando ferido: estagnação.'
  manifestacao_externa: Eventos prováveis de maturidade, transformação interna. Inclinação,
    não destino.
  como_guiar_o_astral: Ajudar a pessoa a RESPEITAR SEU TEMPO. Progressão é rio, não
    corredeira.
como_usar: 'Progressão secundária: cada dia = um ano.

  Progressão terciária: cada dia = um mês.

  Ambos mostram EVOLUÇÃO INTERNA.

  '

