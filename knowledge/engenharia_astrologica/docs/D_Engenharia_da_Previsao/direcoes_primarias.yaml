status: review
id: direcoes_primarias_eng
nome: Direções Primárias e Simbólicas
tradicoes:
  - "editorial"
  - "multiescola"
tipo: Engenharia da Previsão
subtema: Timing planetário avançado
origens_e_divergencias:
  tradicional: "Ptolomeu, Doroteu, al-Qabisi e autores medievais descrevem direções como conversão do movimento diurno em tempo."
  moderna: "Direções simbólicas e progressões de um grau por ano foram rearticuladas por Sepharial e Alan Leo; não são idênticas às direções primárias."
  divergencias: "Primárias usam arco no equador e podem usar conversão Naibod, Ptolomeu ou chave de 1°=1 ano; mundanas e zodiacais, diretas e conversas produzem resultados diferentes."
referencias:
  - autor: "Claudius Ptolemy"
    obra: "Tetrabiblos, III.14–15"
    periodo: "século II, helenística"
    uso: "direções/conversão temporal"
  - autor: "Abu Ali al-Khayyat"
    obra: "The Judgments of Nativities"
    periodo: "século IX, árabe medieval"
    uso: "direções e significadores"
  - autor: "John Gadbury"
    obra: "Genethlialogia"
    periodo: "1658, inglesa tradicional"
    uso: "prática de direções"
  - autor: "Alan Leo"
    obra: "The Progressed Horoscope"
    periodo: "1906, moderna"
    uso: "direção/progressão simbólica"
protocolo_calculo:
  - "Converter a diferença de ascensão reta entre significador e promissor em arco; registrar sistema, latitude, chave e direção/conversão."
  - "Aplicar aspecto dirigido ao grau natal e registrar orbe; não misturar com progressão secundária."
atlas_simbolico:
  pessoas_arquetipos: O estrategista, o temporizador, o navegador
  lugares_fisicos: Mapas, efemérides, relógios
  objetos_materia: Relógios, bússolas, mapas direcionais
  eventos_tipicos: Ativações, mudanças de ciclo, timing preciso
  animais: Águia (visão ampla), tartaruga (tempo longo)
  plantas_ervas: Carvalho (longevidade), hera (permanência)
  metais_pedras: Chumbo (Saturno), cristal (clareza temporal)
  cores_sons:
    cores:
    - Azul-escuro
    - verde-escuro
    - prata
    sons:
    - Tambor lento
    - sino fúnebre
    - gongo
  numeros:
  - 1
  - 7
  - 12
  dias_semana:
  - Sábado
  - Quinta-feira
  doencas_corpo:
    doencas:
    - Envelhecimento
    - tensão temporal
    partes_corpo:
    - Ossos
    - coluna
    - cérebro
  arquetipos_mitologicos:
  - Cronos (tempo)
  - Ananke (necessidade)
  mitos_historias: Cronos e o tempo que devora; Ananke e o destino
  expressao_elevada_sombra: 'Elevada: timing consciente | Sombra: obsessão por timing,
    fadiga'
camada_energetica:
  impressao_mental: Direções primárias = 'o tempo que anda'. Cada grau de movimento
    = um ano de vida.
  permeacao_emocional: 'Paciência e respeito pelo tempo. Quando saudável: timing.
    Quando ferido: ansiedade por resultados.'
  manifestacao_externa: Eventos prováveis de maturidade, ativação de promessas. Inclinação,
    não destino.
  como_guiar_o_astral: Ajudar a pessoa a RESPEITAR O TEMPO. Direção primária é o rio,
    não a corredeira.
como_usar: 'Direção primária tradicional:

  - Cada grau de movimento = 1 ano de vida

  - Direção do Sol = identidade

  - Direção da Lua = emoção

  - Direção do Ascendente = expressão


  Direção simbólica (moderna):

  - Mesmo conceito, mas com orbes maiores

  - Mais flexível e interpretativa


  Regra: SEMPRE como tendência, não como sentença.

  '

