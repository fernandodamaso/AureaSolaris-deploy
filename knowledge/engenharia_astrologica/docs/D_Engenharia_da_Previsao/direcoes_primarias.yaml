status: draft
id: direcoes_primarias_eng
nome: Direções Primárias e Simbólicas
tradicoes:
  - "editorial"
  - "multiescola"
tipo: Engenharia da Previsão
subtema: Timing planetário avançado
origens_e_divergencias:
  tradicional: Hellenística — direções como 'movimento simbólico do mapa'.
  moderna: Forrest, Rudhyar — direções como 'interiorização do tempo'.
  nota: Revisar ao citar — marca a escola usada.
atlas_simbolico:
  pessoas_arquetipos: O estrategista, o temporizador, o navegador
  lugares_fisicos: Mapas, efemérides, relógios
  objetos_materia: Relógios, bússolas, mapas direcionais
  eventos_tipicos: Ativações, mudanças de ciclo, timing preciso
  animais: Águia (visão ampla), tartaruga (tempo longo)
  plantas_ervas: Carvalho (longevidade), hera (permanência)
  metais_pedras: Chumbo (Saturno), cristal (clareza temporal)
  cores_sons:
    cores:
    - Azul-escuro
    - verde-escuro
    - prata
    sons:
    - Tambor lento
    - sino fúnebre
    - gongo
  numeros:
  - 1
  - 7
  - 12
  dias_semana:
  - Sábado
  - Quinta-feira
  doencas_corpo:
    doencas:
    - Envelhecimento
    - tensão temporal
    partes_corpo:
    - Ossos
    - coluna
    - cérebro
  arquetipos_mitologicos:
  - Cronos (tempo)
  - Ananke (necessidade)
  mitos_historias: Cronos e o tempo que devora; Ananke e o destino
  expressao_elevada_sombra: 'Elevada: timing consciente | Sombra: obsessão por timing,
    fadiga'
camada_energetica:
  impressao_mental: Direções primárias = 'o tempo que anda'. Cada grau de movimento
    = um ano de vida.
  permeacao_emocional: 'Paciência e respeito pelo tempo. Quando saudável: timing.
    Quando ferido: ansiedade por resultados.'
  manifestacao_externa: Eventos prováveis de maturidade, ativação de promessas. Inclinação,
    não destino.
  como_guiar_o_astral: Ajudar a pessoa a RESPEITAR O TEMPO. Direção primária é o rio,
    não a corredeira.
como_usar: 'Direção primária tradicional:

  - Cada grau de movimento = 1 ano de vida

  - Direção do Sol = identidade

  - Direção da Lua = emoção

  - Direção do Ascendente = expressão


  Direção simbólica (moderna):

  - Mesmo conceito, mas com orbes maiores

  - Mais flexível e interpretativa


  Regra: SEMPRE como tendência, não como sentença.

  '

