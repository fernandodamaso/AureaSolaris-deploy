status: draft
id: transitos_eng
nome: Trânsitos
tradicoes:
  - "editorial"
  - "multiescola"
tipo: Engenharia da Previsão
subtema: Timing planetário
origens_e_divergencias:
  tradicional: Ptolomeu, Lilly — trânsitos como 'movimento atual dos planetas'.
  moderna: Forrest, Greene — trânsitos como 'ativação de promessas'.
  nota: Há consenso sobre o método, divergência sobre a leitura.
atlas_simbolico:
  pessoas_arquetipos: O viajante, o mensageiro, o catalisador
  lugares_fisicos: Estradas, mapas celestes
  objetos_materia: Mapas, efemérides, relógios
  eventos_tipicos: Ativações, mudanças, oportunidades, desafios
  animais: Pássaro mensageiro, cavalo
  plantas_ervas: Verbas, sálvia
  metais_pedras: Mercúrio, cristal
  cores_sons:
    cores:
    - Azul
    - amarelo
    - prata
    sons:
    - Vento
    - sino
  numeros:
  - 1
  - 3
  - 9
  dias_semana:
  - Quarta-feira
  - Domingo
  doencas_corpo:
    doencas:
    - Problemas nervosos
    - ansiedade
    partes_corpo:
    - Sistema nervoso
    - cérebro
  arquetipos_mitologicos:
  - Hermes (mensageiro)
  - Mercúrio (viagem)
  mitos_historias: Hermes trazendo mensagens
  sonhos_simbolos_inconsciente: Viagens, mensagens, mapas
  expressao_elevada_sombra: 'Elevada: timing consciente | Sombra: obsessão por timing'
camada_energetica:
  impressao_mental: Os trânsitos são o 'agora' do mapa. Eles ATIVAM pontos sensíveis
    do natal.
  permeacao_emocional: Emoção atualizada pelo trânsito. 'Hoje eu sinto...'.
  manifestacao_externa: Eventos PROVÁVEIS que correspondem ao trânsito no ponto natal
    ativado. Inclinação, não destino.
  como_guiar_o_astral: Ajudar a pessoa a ENTENDER O CICLO. Trânsito não é destino
    — é janela.
como_usar: '1. Identifique o planeta em trânsito.

  2. Identifique o ponto natal que ele ativa.

  3. Leia a qualidade da ativação (harmônica ou tensa).

  4. Ofereça a interpretação como INCLINAÇÃO, não sentença.

  '

