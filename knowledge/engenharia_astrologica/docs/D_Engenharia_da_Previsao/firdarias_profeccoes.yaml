como_usar: |
  Ordem das firdárias (vida):
  1. Saturno (0-10 anos)
  2. Júpiter (10-20)
  3. Marte (20-30)
  4. Sol (30-40)
  5. Vênus (40-50)
  6. Mercúrio (50-60)
  7. Lua (60-70)
  8. Saturno (ciclo reinicia)

  Profeções anuais:
  - Cada ano = uma casa do mapa (começa pela Casa 1 no ano 1)
  - Ano 2 = Casa 2, Ano 3 = Casa 3, etc.

  Profeções mensais:
  - Cada mês = uma sub-casa do ano

