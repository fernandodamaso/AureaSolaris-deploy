tipo: Engenharia da Previsão
subtema: Timing anual
origens_e_divergencias:
  tradicional: Hellenística — revolução solar como 'retorno ao Sol natal'.
  moderna: Forrest, Greene — revolução solar como 'ano de vida'.
  nota: Revisar ao citar — marca a escola usada.
atlas_simbolico:
  pessoas_arquetipos: O renascido, o novo ciclo, o Sol que retorna
  lugares_fisicos: Locais de renascimento, aniversários, celebrações
  objetos_materia: Velas, bolos, presentes, mapas de ano
  eventos_tipicos: Aniversários, novos ciclos, renascimentos
  animais: Galo (renascimento solar), fênix
  plantas_ervas: Girassol, rosa amarela, louro
  metais_pedras: Ouro, topázio, citrino, diamante
  cores_sons:
    cores:
    - Ouro
    - amarelo-dourado
    - laranja
    - branco-radiante
    sons:
    - Trombeta
    - canto coral
    - celebração
  numeros:
  - 1
  - 10
  dias_semana:
  - Domingo
  doencas_corpo:
    doencas:
    - Problemas cardíacos
    - excesso
    partes_corpo:
    - Coração
    - coluna dorsal
  arquetipos_mitologicos:
  - Rá (renascimento diário)
  - Hércules (novo ciclo)
  mitos_historias: Rá e Apófis; renascimento solar
  expressao_elevada_sombra: 'Elevada: renascimento consciente | Sombra: estagnação,
    medo de novo ciclo'
camada_energetica:
  impressao_mental: A revolução solar é o 'novo ano' da alma. 'O que eu vou construir
    agora?'.
  permeacao_emocional: 'Renascimento emocional. Quando saudável: esperança. Quando
    ferido: medo de mudança.'
  manifestacao_externa: Eventos prováveis de renascimento, novos ciclos. Inclinação,
    não destino.
  como_guiar_o_astral: Ajudar a pessoa a CELEBRAR O NOVO CICLO. Revolução solar é
    nascimento, não obrigação.
como_usar: '1. Calcule o mapa do retorno solar (Sol no mesmo grau do natal).

  2. Compare com o mapa natal.

  3. Leia os temas do ano: ''este ano eu trabalho...''

  4. SEMPRE como tendência, não como sentença.

  '

