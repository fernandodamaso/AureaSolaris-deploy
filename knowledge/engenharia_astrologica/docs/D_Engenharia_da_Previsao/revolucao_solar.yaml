    - coluna dorsal
  arquetipos_mitologicos:
  - Rá (renascimento diário)
  - Hércules (novo ciclo)
  mitos_historias: Rá e Apófis; renascimento solar
  expressao_elevada_sombra: 'Elevada: renascimento consciente | Sombra: estagnação,
    medo de novo ciclo'
camada_energetica:
  impressao_mental: A revolução solar é o 'novo ano' da alma. 'O que eu vou construir
    agora?'.
  permeacao_emocional: 'Renascimento emocional. Quando saudável: esperança. Quando
    ferido: medo de mudança.'
  manifestacao_externa: Eventos prováveis de renascimento, novos ciclos. Inclinação,
    não destino.
  como_guiar_o_astral: Ajudar a pessoa a CELEBRAR O NOVO CICLO. Revolução solar é
    nascimento, não obrigação.
como_usar: '1. Calcule o mapa do retorno solar (Sol no mesmo grau do natal).

  2. Compare com o mapa natal.

  3. Leia os temas do ano: ''este ano eu trabalho...''

  4. SEMPRE como tendência, não como sentença.

  '

