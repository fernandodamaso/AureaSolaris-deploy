name: FDM-736 Vite advisory remediation

on:
  push:
    branches:
      - fernandoyarrum/fdm-736-p410-run-the-final-security-and-web-v1-completion-audit

permissions:
  contents: write

jobs:
  update-vite-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update only Vite within major 7
        run: npm install --workspace apps/web --save-dev 'vite@^7.3.6' --package-lock-only

      - name: Verify dependency floor regression
        run: python -m unittest tests.test_dependency_security_floor -v

      - name: Commit generated manifest and lockfile, then remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fdm-736-vite-fix.yml
          git add apps/web/package.json package-lock.json
          git diff --cached --check
          git commit -m 'fix: update Vite past advisory floor'
          git push origin HEAD:${GITHUB_REF_NAME}
